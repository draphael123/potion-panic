// === PARTICLES & EFFECTS ===
function updateParticles(dt) {
  gameTime += dt;
  cloudOffset += dt * 6; // drift clouds

  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 5 * dt;
    p.life -= dt * 1.5;
  }
  particles = particles.filter(p => p.life > 0);

  for (const f of floatTexts) {
    f.y -= 30 * dt;
    f.life -= dt;
  }
  floatTexts = floatTexts.filter(f => f.life > 0);

  if (cauldron.length > 0 || brewFlash > 0) {
    cauldronBubbleTimer -= dt;
    if (cauldronBubbleTimer <= 0) {
      cauldronBubbleTimer = 0.15 + Math.random()*0.1;
      bubbles.push({
        x: CAULDRON_X + 20 + Math.random()*(CAULDRON_W-40),
        y: CAULDRON_Y + 20,
        vy: -20 - Math.random()*15,
        life: 0.6 + Math.random()*0.3,
        size: 2 + Math.random()*3,
      });
    }
  }
  for (const b of bubbles) {
    b.y += b.vy * dt;
    b.x += Math.sin(b.y * 0.1) * 0.3;
    b.life -= dt;
  }
  bubbles = bubbles.filter(b => b.life > 0);

  // Fire particles (always active — fire is always burning)
  if (Math.random() < 0.3) {
    fireParticles.push({
      x: CAULDRON_X + CAULDRON_W/2 - 12 + Math.random()*24,
      y: CAULDRON_Y + CAULDRON_H + 2,
      vx: (Math.random()-0.5)*0.8,
      vy: -15 - Math.random()*25,
      life: 0.3 + Math.random()*0.4,
      bright: Math.random() > 0.5,
    });
  }
  for (const fp of fireParticles) {
    fp.x += fp.vx; fp.y += fp.vy * dt;
    fp.vx += (Math.random()-0.5)*0.5;
    fp.life -= dt * 2;
  }
  fireParticles = fireParticles.filter(fp => fp.life > 0);

  // Ambient sparkles (potion shop magic in the air)
  if (ambientSparkles.length < 15 && Math.random() < 0.05) {
    ambientSparkles.push({
      x: Math.random() * W,
      y: Math.random() * COUNTER_Y,
      vx: (Math.random()-0.5)*0.3,
      vy: -0.2 - Math.random()*0.3,
      life: 2 + Math.random()*3,
      maxLife: 2 + Math.random()*3,
      color: [P.ACCENT, P.POTION_GLO, getEnvTheme().particle, P.MUSH_PURPLE, P.FLOW_YELLOW][Math.floor(Math.random()*5)],
      size: 1 + Math.random()*2,
    });
  }
  for (const s of ambientSparkles) {
    s.x += s.vx + Math.sin(gameTime*2 + s.x*0.01)*0.2;
    s.y += s.vy;
    s.life -= dt;
  }
  ambientSparkles = ambientSparkles.filter(s => s.life > 0);

  if (shakeTimer > 0) shakeTimer -= dt;
  if (brewFlash > 0) brewFlash -= dt;
  if (bossDeathRing.active) {
    bossDeathRing.radius += dt * 300;
    bossDeathRing.life -= dt;
    if (bossDeathRing.life <= 0 || bossDeathRing.radius > bossDeathRing.maxRadius) bossDeathRing.active = false;
  }
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0 && comboShieldTimer <= 0) comboCount = 0; }
}

// === DRAWING FUNCTIONS ===

function drawRoundRect(x,y,w,h,r,fill,stroke) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r+amt); g = Math.min(255, g+amt); b = Math.min(255, b+amt);
  return `rgb(${r},${g},${b})`;
}

function drawBottle(x, y, w, h, color, style) {
  // style: 0=round, 1=tall, 2=flask
  const neckW = Math.floor(w * 0.4);
  const neckH = Math.floor(h * 0.22);
  const bodyH = h - neckH;
  // Cork
  ctx.fillStyle = P.COUNTER_LT;
  ctx.fillRect(x + (w-neckW)/2, y, neckW, 4);
  // Neck
  ctx.fillStyle = color; ctx.globalAlpha = 0.7;
  ctx.fillRect(x + (w-neckW)/2, y+4, neckW, neckH-4);
  ctx.globalAlpha = 1;
  // Body
  ctx.fillStyle = color;
  if (style === 0) {
    ctx.beginPath();
    ctx.moveTo(x+2, y+neckH+bodyH);
    ctx.lineTo(x+2, y+neckH+4);
    ctx.quadraticCurveTo(x+w/2, y+neckH-2, x+w-2, y+neckH+4);
    ctx.lineTo(x+w-2, y+neckH+bodyH);
    ctx.closePath(); ctx.fill();
  } else if (style === 1) {
    ctx.fillRect(x+1, y+neckH, w-2, bodyH);
  } else {
    ctx.beginPath();
    ctx.moveTo(x+(w-neckW)/2, y+neckH);
    ctx.lineTo(x+1, y+neckH+bodyH);
    ctx.lineTo(x+w-1, y+neckH+bodyH);
    ctx.lineTo(x+(w+neckW)/2, y+neckH);
    ctx.closePath(); ctx.fill();
  }
  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x + 2, y+neckH+2, 2, bodyH-4);
  // Liquid level line
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(x+2, y+neckH + Math.floor(bodyH*0.3), w-4, 1);
}

function drawLantern(x, y) {
  const t = gameTime;
  const flick = Math.sin(t*8)*0.08 + Math.sin(t*13)*0.05 + Math.cos(t*5)*0.04;
  // Chain
  ctx.fillStyle = P.STONE_DK; ctx.fillRect(x+5, y-12, 2, 14);
  // Body
  ctx.fillStyle = '#443322';
  ctx.fillRect(x, y, 12, 16);
  // Glass
  ctx.fillStyle = P.LANTERN; ctx.globalAlpha = 0.6 + flick;
  ctx.fillRect(x+2, y+2, 8, 12);
  ctx.globalAlpha = 1;
  // Glow halo
  const grd = ctx.createRadialGradient(x+6, y+8, 2, x+6, y+8, 50+flick*30);
  grd.addColorStop(0, 'rgba(255,220,130,0.18)');
  grd.addColorStop(1, 'rgba(255,220,130,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(x-50, y-50, 112, 112);
}

function drawHangingHerbs(x, y, count) {
  for (let i = 0; i < count; i++) {
    const hx = x + i * 18;
    const sway = Math.sin(gameTime * 1.5 + i * 1.2) * 2;
    // String
    ctx.strokeStyle = P.COUNTER_LT; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hx+3, y); ctx.lineTo(hx+3+sway, y+14); ctx.stroke();
    // Herb bundle
    ctx.fillStyle = i%2===0 ? P.MOSS_GREEN : '#557733';
    ctx.fillRect(hx+sway, y+12, 6, 10);
    ctx.fillStyle = i%2===0 ? '#557733' : P.MOSS_GREEN;
    ctx.fillRect(hx+2+sway, y+14, 4, 6);
  }
}

function drawShopBackground() {
  const t = gameTime;
  const env = getEnvTheme();

  // === BACK WALL (brick pattern) — tinted by environment ===
  ctx.fillStyle = env.wallColor;
  ctx.fillRect(0, 0, W, COUNTER_Y + 20);
  // Environment sky gradient at top (subtle)
  const envSkyGrd = ctx.createLinearGradient(0, 0, 0, 80);
  envSkyGrd.addColorStop(0, env.bgTop);
  envSkyGrd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = envSkyGrd;
  ctx.fillRect(0, 0, W, 80);
  ctx.strokeStyle = P.BG_DARK; ctx.lineWidth = 1;
  for (let y = 0; y < COUNTER_Y + 20; y += 40) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  for (let x = 0; x < W; x += 80) {
    const offset = (Math.floor(x/80) % 2) * 20;
    for (let y = offset; y < COUNTER_Y+20; y += 40) {
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+40); ctx.stroke();
    }
  }

  // === FLOOR TILES ===
  ctx.fillStyle = P.BG_LIGHT;
  ctx.fillRect(0, COUNTER_Y + 20, W, H - COUNTER_Y - 20);
  ctx.strokeStyle = P.BG_MID;
  for (let x = 0; x < W; x += 60) {
    for (let y = COUNTER_Y + 20; y < H; y += 40) {
      ctx.strokeRect(x + ((Math.floor(y/40)%2)*30), y, 60, 40);
    }
  }
  // Floor highlight strip
  ctx.fillStyle = 'rgba(255,220,150,0.03)';
  ctx.fillRect(0, COUNTER_Y+20, W, 8);

  // === ENVIRONMENT-SPECIFIC PROPS ===
  if (env.name === 'Forest Hut') {
    // Vines creeping down left wall
    ctx.strokeStyle = '#447733'; ctx.lineWidth = 2;
    for (let v = 0; v < 3; v++) {
      const vx = 560 + v * 25;
      ctx.beginPath(); ctx.moveTo(vx, 0);
      for (let vy = 0; vy < COUNTER_Y - 20; vy += 12) {
        ctx.lineTo(vx + Math.sin(vy * 0.08 + v) * 8, vy);
      }
      ctx.stroke();
      // Leaves along vines
      ctx.fillStyle = v % 2 === 0 ? P.MOSS_GREEN : '#55aa44';
      for (let vy = 15; vy < COUNTER_Y - 40; vy += 35 + v * 10) {
        const lx = vx + Math.sin(vy * 0.08 + v) * 8;
        ctx.beginPath(); ctx.ellipse(lx + 5, vy, 5, 3, 0.3 + v, 0, Math.PI * 2); ctx.fill();
      }
    }
    // Mushrooms on floor
    const floorY = COUNTER_Y + 28;
    for (let m = 0; m < 3; m++) {
      const mx = 420 + m * 55;
      const sway = Math.sin(t * 0.5 + m * 2) * 0.5;
      ctx.fillStyle = '#776655'; ctx.fillRect(mx + 3, floorY + 4, 3, 6); // stem
      ctx.fillStyle = m % 2 === 0 ? '#cc4444' : '#dd8833';
      ctx.beginPath(); ctx.ellipse(mx + 4 + sway, floorY + 4, 6, 4, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(mx + 2 + sway, floorY + 2, 1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx + 6 + sway, floorY + 1, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  } else if (env.name === 'Mountain Pass') {
    // Rocky outcroppings on right wall
    ctx.fillStyle = '#4a4a5e';
    ctx.beginPath(); ctx.moveTo(580, COUNTER_Y + 20); ctx.lineTo(600, COUNTER_Y + 20);
    ctx.lineTo(600, COUNTER_Y - 30); ctx.lineTo(585, COUNTER_Y - 10);
    ctx.lineTo(570, COUNTER_Y + 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a3a4e';
    ctx.beginPath(); ctx.moveTo(560, COUNTER_Y + 20); ctx.lineTo(580, COUNTER_Y + 20);
    ctx.lineTo(575, COUNTER_Y - 5); ctx.lineTo(555, COUNTER_Y + 20); ctx.closePath(); ctx.fill();
    // Snow patches on rocks
    ctx.fillStyle = '#dde8f0'; ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(590, COUNTER_Y - 25, 8, 3, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(570, COUNTER_Y - 2, 6, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // Icicles hanging from top
    for (let ic = 0; ic < 5; ic++) {
      const ix = 340 + ic * 30 + Math.sin(ic * 7) * 10;
      const ih = 10 + (ic % 3) * 6;
      ctx.fillStyle = '#aaccee'; ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.moveTo(ix - 2, 0); ctx.lineTo(ix + 2, 0);
      ctx.lineTo(ix, ih); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Snowflake particles drifting
    ctx.fillStyle = '#ddeeff';
    for (let sf = 0; sf < 8; sf++) {
      const sx = (sf * 97 + t * 15) % W;
      const sy = (sf * 53 + t * 10 + Math.sin(t + sf) * 20) % (COUNTER_Y + 20);
      ctx.globalAlpha = 0.2 + Math.sin(t * 2 + sf) * 0.1;
      ctx.fillRect(sx, sy, 2, 2);
    }
    ctx.globalAlpha = 1;
  } else if (env.name === 'Dark Cavern') {
    // Stalactites from ceiling
    for (let st = 0; st < 6; st++) {
      const sx = 320 + st * 48 + Math.sin(st * 5) * 15;
      const sh = 18 + (st % 3) * 12 + Math.sin(st * 3) * 5;
      ctx.fillStyle = st % 2 === 0 ? '#3d3055' : '#2d2045';
      ctx.beginPath(); ctx.moveTo(sx - 5, 0); ctx.lineTo(sx + 5, 0);
      ctx.lineTo(sx + 1, sh); ctx.lineTo(sx - 1, sh + 3);
      ctx.closePath(); ctx.fill();
      // Dripping water
      if (st % 2 === 0) {
        const dripY = (sh + 5 + (t * 30 + st * 50) % 60);
        if (dripY < COUNTER_Y) {
          ctx.fillStyle = '#8888cc'; ctx.globalAlpha = 0.4;
          ctx.beginPath(); ctx.ellipse(sx, dripY, 1.5, 2.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }
    // Glowing crystals on floor
    const cFloorY = COUNTER_Y + 30;
    for (let cr = 0; cr < 4; cr++) {
      const cx2 = 400 + cr * 50;
      const cGlow = Math.sin(t * 2 + cr * 1.5) * 0.15 + 0.3;
      const crColor = cr % 2 === 0 ? '#aa55ee' : '#55aaee';
      // Crystal glow
      const cGrd = ctx.createRadialGradient(cx2, cFloorY, 1, cx2, cFloorY, 15);
      cGrd.addColorStop(0, crColor); cGrd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = cGrd; ctx.globalAlpha = cGlow;
      ctx.fillRect(cx2 - 15, cFloorY - 15, 30, 30);
      ctx.globalAlpha = 1;
      // Crystal shape
      ctx.fillStyle = crColor;
      ctx.beginPath();
      ctx.moveTo(cx2 - 3, cFloorY); ctx.lineTo(cx2 - 1, cFloorY - 10 - cr * 2);
      ctx.lineTo(cx2 + 1, cFloorY - 10 - cr * 2); ctx.lineTo(cx2 + 3, cFloorY);
      ctx.closePath(); ctx.fill();
      // Second smaller crystal
      ctx.beginPath();
      ctx.moveTo(cx2 + 4, cFloorY); ctx.lineTo(cx2 + 5, cFloorY - 6);
      ctx.lineTo(cx2 + 7, cFloorY); ctx.closePath(); ctx.fill();
    }
  } else if (env.name === "Dragon's Lair") {
    // Lava pools on floor
    const lFloorY = COUNTER_Y + 30;
    for (let lp = 0; lp < 3; lp++) {
      const lx = 380 + lp * 70;
      const lw = 20 + lp * 8;
      const lPulse = Math.sin(t * 3 + lp * 2) * 0.1;
      // Lava glow
      const lGrd = ctx.createRadialGradient(lx, lFloorY + 3, 2, lx, lFloorY + 3, lw);
      lGrd.addColorStop(0, 'rgba(255,100,20,0.2)'); lGrd.addColorStop(1, 'rgba(255,50,0,0)');
      ctx.fillStyle = lGrd;
      ctx.fillRect(lx - lw, lFloorY - lw + 3, lw * 2, lw * 2);
      // Lava surface
      ctx.fillStyle = `rgba(255,${80 + Math.floor(lPulse * 60)},0,0.7)`;
      ctx.beginPath(); ctx.ellipse(lx, lFloorY + 3, lw / 2, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,200,50,${0.4 + lPulse})`;
      ctx.beginPath(); ctx.ellipse(lx, lFloorY + 3, lw / 4, 2, 0, 0, Math.PI * 2); ctx.fill();
      // Lava bubble
      if (Math.sin(t * 5 + lp * 3) > 0.7) {
        ctx.fillStyle = 'rgba(255,180,40,0.6)';
        ctx.beginPath(); ctx.arc(lx + Math.sin(t * 4 + lp) * 5, lFloorY, 2, 0, Math.PI * 2); ctx.fill();
      }
    }
    // Scorch marks on wall
    for (let sc = 0; sc < 4; sc++) {
      const scx = 340 + sc * 60;
      const scy = 80 + sc * 30;
      ctx.fillStyle = 'rgba(30,10,0,0.3)';
      ctx.beginPath(); ctx.ellipse(scx, scy, 15 + sc * 3, 8, sc * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    // Ember particles rising
    ctx.fillStyle = P.FIRE_1;
    for (let em = 0; em < 6; em++) {
      const ex = 350 + (em * 47 + t * 20) % 220;
      const ey = COUNTER_Y + 20 - (t * 25 + em * 40) % (COUNTER_Y + 20);
      ctx.globalAlpha = 0.3 + Math.sin(t * 3 + em) * 0.2;
      ctx.fillRect(ex, ey, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // === WINDOW — Day/Night Cycle (Task #66) + Weather (Task #65) ===
  const atmos = getAtmosphere(wave);
  ctx.save();
  ctx.beginPath(); ctx.rect(202, 62, 76, 76); ctx.clip();

  // Day/Night cycle: sky gradient shifts based on wave within 5-wave block
  const waveInBlock = (wave - 1) % 5; // 0=dawn, 1=morning, 2=midday, 3=sunset, 4=night
  const dayNightColors = [
    { top: '#2d1a3a', bot: '#cc6633' },   // Dawn: warm orange/pink
    { top: '#5588bb', bot: '#88bbdd' },   // Morning: light blue
    { top: '#3366aa', bot: '#6699cc' },   // Midday: bright blue
    { top: '#3a1a40', bot: '#cc6622' },   // Sunset: orange/purple
    { top: '#060818', bot: '#0a1428' },   // Night: dark blue/black
  ];
  const dnc = dayNightColors[waveInBlock];
  const skyGrd = ctx.createLinearGradient(200, 60, 200, 140);
  skyGrd.addColorStop(0, dnc.top);
  skyGrd.addColorStop(1, dnc.bot);
  ctx.fillStyle = skyGrd;
  ctx.fillRect(200, 60, 80, 80);

  // Stars only visible at night (wave 5 of block) and dawn/sunset (faintly)
  const starVisibility = waveInBlock === 4 ? 1.0 : waveInBlock === 0 ? 0.3 : waveInBlock === 3 ? 0.4 : 0;
  if (starVisibility > 0) {
    for (const star of STARS) {
      const twinkle = Math.sin(t * star.speed + star.x) * 0.5 + 0.5;
      ctx.fillStyle = P.STAR;
      ctx.globalAlpha = star.bri * twinkle * starVisibility;
      ctx.fillRect(202 + star.x, 62 + star.y, 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  }

  // Drifting clouds (visible during day, faint at night)
  const cloudAlpha = waveInBlock === 4 ? 0.15 : 0.35;
  for (const cloud of CLOUDS) {
    const ccx = ((cloud.x + cloudOffset * 0.3) % 120) + 185;
    ctx.fillStyle = waveInBlock <= 2 ? '#aabbcc' : atmos.cloudColor; ctx.globalAlpha = cloudAlpha;
    ctx.beginPath();
    ctx.ellipse(ccx, 62 + cloud.y, cloud.w/2, cloud.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Moon (only at night and sunset)
  if (waveInBlock >= 3) {
    const moonAlpha = waveInBlock === 4 ? 0.8 : 0.4;
    ctx.fillStyle = '#ddeeff'; ctx.globalAlpha = moonAlpha;
    ctx.beginPath(); ctx.arc(260, 78, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = dnc.top; ctx.beginPath(); ctx.arc(263, 76, 7, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // === WEATHER EFFECTS through window (Task #65) ===
  const envName = env.name;
  if (envName === 'Forest Hut') {
    // Gentle rain — vertical lines falling
    ctx.strokeStyle = '#aabbdd'; ctx.lineWidth = 1;
    for (let r = 0; r < 12; r++) {
      const rx = 204 + (r * 7 + t * 15) % 72;
      const ry = (r * 23 + t * 80) % 76;
      ctx.globalAlpha = 0.3 + Math.sin(t + r) * 0.1;
      ctx.beginPath(); ctx.moveTo(rx, 62 + ry); ctx.lineTo(rx - 0.5, 62 + ry + 8); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (envName === 'Mountain Pass') {
    // Snow — small white dots drifting diagonally
    ctx.fillStyle = '#ffffff';
    for (let s = 0; s < 15; s++) {
      const sx = 204 + (s * 11 + t * 8 + Math.sin(t * 0.7 + s * 2) * 10) % 72;
      const sy = 62 + (s * 17 + t * 12) % 76;
      ctx.globalAlpha = 0.4 + Math.sin(t * 1.5 + s) * 0.2;
      ctx.beginPath(); ctx.arc(sx, sy, 1.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (envName === 'Dark Cavern') {
    // Fog — semi-transparent cloud shapes drifting across
    for (let f = 0; f < 3; f++) {
      const fx = 200 + (f * 40 + t * 6) % 100 - 15;
      const fy = 80 + f * 15;
      ctx.fillStyle = '#8877aa'; ctx.globalAlpha = 0.12 + Math.sin(t * 0.5 + f) * 0.05;
      ctx.beginPath(); ctx.ellipse(fx, fy, 25, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(fx + 12, fy - 3, 15, 6, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else if (envName === "Dragon's Lair") {
    // Heat distortion — wavy shimmer lines
    ctx.strokeStyle = 'rgba(255,150,50,0.15)'; ctx.lineWidth = 1;
    for (let h = 0; h < 5; h++) {
      const hy = 65 + h * 15;
      ctx.beginPath();
      for (let hx = 202; hx < 278; hx += 2) {
        const wy = hy + Math.sin(hx * 0.15 + t * 3 + h) * 3;
        if (hx === 202) ctx.moveTo(hx, wy); else ctx.lineTo(hx, wy);
      }
      ctx.stroke();
    }
  }

  ctx.restore();

  // Window frame
  ctx.strokeStyle = P.COUNTER; ctx.lineWidth = 4;
  ctx.strokeRect(200, 60, 80, 80);
  ctx.beginPath(); ctx.moveTo(240,60); ctx.lineTo(240,140); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(200,100); ctx.lineTo(280,100); ctx.stroke();
  // Window sill
  ctx.fillStyle = P.COUNTER;
  ctx.fillRect(196, 140, 88, 6);
  // Tiny pot plant on sill
  ctx.fillStyle = '#664422'; ctx.fillRect(220, 132, 10, 8);
  ctx.fillStyle = P.MOSS_GREEN;
  ctx.beginPath(); ctx.arc(225, 130, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#55aa55';
  ctx.beginPath(); ctx.arc(222, 128, 3, 0, Math.PI*2); ctx.fill();

  // === DOOR with sign ===
  ctx.fillStyle = P.BG_DARK;
  ctx.fillRect(0, 160, 35, COUNTER_Y - 160 + 25);
  ctx.fillStyle = P.COUNTER;
  ctx.fillRect(3, 163, 29, COUNTER_Y - 163 + 19);
  // Door planks
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(13,163); ctx.lineTo(13,COUNTER_Y+19); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(23,163); ctx.lineTo(23,COUNTER_Y+19); ctx.stroke();
  // Door handle
  ctx.fillStyle = P.ACCENT;
  ctx.beginPath(); ctx.arc(26, 260, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ddaa00';
  ctx.beginPath(); ctx.arc(26, 260, 1.5, 0, Math.PI*2); ctx.fill();

  // Shop sign above door
  const signSway = Math.sin(t * 0.8) * 1.5;
  ctx.save(); ctx.translate(17, 148); ctx.rotate(signSway * 0.01);
  // Sign chains
  ctx.strokeStyle = P.STONE_DK; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-5, -10); ctx.lineTo(-3, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(35, -10); ctx.lineTo(33, 0); ctx.stroke();
  // Sign board
  ctx.fillStyle = P.SIGN_BG;
  drawRoundRect(-8, -2, 46, 14, 2, P.SIGN_BG, P.COUNTER);
  ctx.fillStyle = P.ACCENT; ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
  ctx.fillText('OPEN', 15, 9);
  ctx.restore();

  // === SHELVES with bottles ===
  // Shelf brackets
  ctx.fillStyle = P.STONE_DK;
  ctx.fillRect(18, 80, 4, 10); ctx.fillRect(136, 80, 4, 10);
  ctx.fillRect(18, 150, 4, 10); ctx.fillRect(136, 150, 4, 10);
  // Shelf boards
  ctx.fillStyle = P.COUNTER;
  ctx.fillRect(20, 80, 120, 8);
  ctx.fillRect(20, 150, 120, 8);
  // Shelf edge highlight
  ctx.fillStyle = P.COUNTER_LT;
  ctx.fillRect(20, 80, 120, 2);
  ctx.fillRect(20, 150, 120, 2);

  // Top shelf bottles (varied shapes)
  const bottleColors = [P.HERB_RED, P.CRYS_BLUE, P.FLOW_YELLOW, P.MOSS_GREEN, P.MUSH_PURPLE];
  drawBottle(30, 56, 10, 24, bottleColors[0], 0);
  drawBottle(52, 52, 12, 28, bottleColors[1], 1);
  drawBottle(75, 58, 10, 22, bottleColors[2], 2);
  drawBottle(98, 54, 11, 26, bottleColors[3], 0);
  drawBottle(120, 57, 9, 23, P.POTION_GLO, 1);

  // Bottom shelf bottles
  drawBottle(35, 126, 11, 24, bottleColors[2], 2);
  drawBottle(58, 128, 10, 22, bottleColors[4], 0);
  drawBottle(80, 125, 12, 25, '#ee8833', 1);
  drawBottle(104, 127, 10, 23, bottleColors[0], 2);

  // === HANGING HERBS from ceiling ===
  drawHangingHerbs(310, 42, 4);
  drawHangingHerbs(460, 50, 3);

  // === LANTERNS ===
  drawLantern(165, 55);
  drawLantern(500, 48);

  // === COUNTER ===
  ctx.fillStyle = P.COUNTER;
  ctx.fillRect(0, COUNTER_Y, 550, 25);
  ctx.fillStyle = P.COUNTER_LT;
  ctx.fillRect(0, COUNTER_Y, 550, 6);
  // Counter wood grain
  ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
  for (let x = 10; x < 540; x += 35) {
    ctx.beginPath(); ctx.moveTo(x, COUNTER_Y+2); ctx.lineTo(x+20, COUNTER_Y+2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+5, COUNTER_Y+12); ctx.lineTo(x+25, COUNTER_Y+12); ctx.stroke();
  }
  ctx.fillStyle = P.BG_DARK;
  ctx.fillRect(0, COUNTER_Y+25, 550, 3);
  // Counter legs
  ctx.fillStyle = P.COUNTER;
  ctx.fillRect(0, COUNTER_Y+3, 10, 22);
  ctx.fillRect(540, COUNTER_Y+3, 10, 22);

  // === AMBIENT DUST MOTES (varies with atmosphere) ===
  for (let i = 0; i < atmos.dustCount; i++) {
    const dx = (i * 73 + t * (8 + i%3)) % W;
    const dy = (i * 47 + Math.sin(t * 0.7 + i) * 25) % (COUNTER_Y + 20);
    const sz = 1 + (i % 3);
    ctx.fillStyle = P.PARCHMENT;
    ctx.globalAlpha = 0.08 + Math.sin(t + i * 2) * 0.06;
    ctx.beginPath(); ctx.arc(dx, dy, sz * 0.7, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // === LANTERN LIGHT WASH on back wall (scales with atmosphere) ===
  const lm = atmos.lanternMult;
  const glow1 = ctx.createRadialGradient(171, 63, 5, 171, 100, 120 * lm);
  glow1.addColorStop(0, `rgba(255,220,130,${0.08 * lm})`);
  glow1.addColorStop(1, 'rgba(255,220,130,0)');
  ctx.fillStyle = glow1;
  ctx.fillRect(50, 0, 250, 250);
  const glow2 = ctx.createRadialGradient(506, 56, 5, 506, 100, 120 * lm);
  glow2.addColorStop(0, `rgba(255,220,130,${0.06 * lm})`);
  glow2.addColorStop(1, 'rgba(255,220,130,0)');
  ctx.fillStyle = glow2;
  ctx.fillRect(380, 0, 250, 250);

  // Atmosphere tint overlay
  ctx.fillStyle = atmos.tint;
  ctx.fillRect(0, 0, W, COUNTER_Y + 20);
}

function drawCauldronFire() {
  const cx = CAULDRON_X + CAULDRON_W/2;
  const cy = CAULDRON_Y + CAULDRON_H + 8;
  const t = gameTime;

  // Fire glow on floor
  const fireGlow = ctx.createRadialGradient(cx, cy, 5, cx, cy+5, 45);
  fireGlow.addColorStop(0, 'rgba(255,100,30,0.12)');
  fireGlow.addColorStop(1, 'rgba(255,100,30,0)');
  ctx.fillStyle = fireGlow;
  ctx.fillRect(cx-50, cy-10, 100, 60);

  // Logs
  ctx.fillStyle = '#3a2210';
  ctx.save(); ctx.translate(cx-18, cy+4); ctx.rotate(-0.15);
  ctx.fillRect(0, 0, 36, 6); ctx.restore();
  ctx.save(); ctx.translate(cx-15, cy+2); ctx.rotate(0.2);
  ctx.fillRect(0, 0, 32, 5); ctx.restore();
  // Log highlights
  ctx.fillStyle = '#55331a';
  ctx.fillRect(cx-10, cy+3, 8, 2);

  // Animated fire tongues
  for (let i = 0; i < 5; i++) {
    const fx = cx - 14 + i * 7 + Math.sin(t*6+i*2)*2;
    const fh = 12 + Math.sin(t*8+i*3)*5 + Math.sin(t*12+i)*3;
    const fw = 5 + Math.sin(t*5+i)*1.5;
    // Outer flame
    ctx.fillStyle = i%2===0 ? P.FIRE_1 : P.FIRE_2;
    ctx.globalAlpha = 0.7 + Math.sin(t*7+i)*0.2;
    ctx.beginPath();
    ctx.moveTo(fx, cy+2);
    ctx.quadraticCurveTo(fx-fw, cy-fh*0.6, fx, cy-fh);
    ctx.quadraticCurveTo(fx+fw, cy-fh*0.6, fx, cy+2);
    ctx.fill();
    // Inner bright core
    if (i%2 === 0) {
      ctx.fillStyle = P.FIRE_3; ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(fx, cy);
      ctx.quadraticCurveTo(fx-fw*0.4, cy-fh*0.4, fx, cy-fh*0.6);
      ctx.quadraticCurveTo(fx+fw*0.4, cy-fh*0.4, fx, cy);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Sparks rising from fire
  for (const fp of fireParticles) {
    ctx.fillStyle = fp.bright ? P.FIRE_3 : P.EMBER;
    ctx.globalAlpha = fp.life * 0.8;
    ctx.fillRect(fp.x-0.5, fp.y-0.5, 1.5, 1.5);
  }
  ctx.globalAlpha = 1;
}

function getCauldronMixColor() {
  if (cauldron.length === 0) return P.POTION_GLO;
  const colorMap = {
    herb: [60,160,60], crystal: [60,120,220], flower: [220,200,60],
    mushroom: [160,80,200], root: [180,120,60], bone: [220,220,210], ember: [255,100,30],
    moss: [60,170,60]
  };
  let r=0, g=0, b=0;
  for (const id of cauldron) {
    const c = colorMap[id] || [128,128,128];
    r += c[0]; g += c[1]; b += c[2];
  }
  r = Math.floor(r/cauldron.length); g = Math.floor(g/cauldron.length); b = Math.floor(b/cauldron.length);
  return `rgb(${r},${g},${b})`;
}

function drawCauldron() {
  const cx = CAULDRON_X, cy = CAULDRON_Y;

  // Fire underneath (drawn first, behind cauldron)
  drawCauldronFire();

  // Shadow
  ctx.fillStyle = P.SHADOW;
  ctx.beginPath();
  ctx.ellipse(cx + CAULDRON_W/2, cy + CAULDRON_H + 5, CAULDRON_W/2 + 5, 8, 0, 0, Math.PI*2);
  ctx.fill();

  // Cauldron body — outer
  ctx.fillStyle = P.STONE_DK;
  ctx.beginPath();
  ctx.moveTo(cx + 5, cy);
  ctx.lineTo(cx + CAULDRON_W - 5, cy);
  ctx.quadraticCurveTo(cx + CAULDRON_W + 5, cy + CAULDRON_H/2, cx + CAULDRON_W - 10, cy + CAULDRON_H);
  ctx.lineTo(cx + 10, cy + CAULDRON_H);
  ctx.quadraticCurveTo(cx - 5, cy + CAULDRON_H/2, cx + 5, cy);
  ctx.fill();

  // Cauldron body — inner highlight
  ctx.fillStyle = P.STONE;
  ctx.beginPath();
  ctx.moveTo(cx + 8, cy + 3);
  ctx.lineTo(cx + CAULDRON_W - 8, cy + 3);
  ctx.quadraticCurveTo(cx + CAULDRON_W, cy + CAULDRON_H/2, cx + CAULDRON_W - 13, cy + CAULDRON_H - 5);
  ctx.lineTo(cx + 13, cy + CAULDRON_H - 5);
  ctx.quadraticCurveTo(cx, cy + CAULDRON_H/2, cx + 8, cy + 3);
  ctx.fill();

  // Fire glow on cauldron
  const fireReflect = 0.08 + Math.sin(gameTime*6)*0.04;
  ctx.fillStyle = `rgba(255,120,40,${fireReflect})`;
  ctx.beginPath();
  ctx.moveTo(cx + 15, cy + CAULDRON_H*0.5);
  ctx.lineTo(cx + CAULDRON_W - 15, cy + CAULDRON_H*0.5);
  ctx.lineTo(cx + CAULDRON_W - 12, cy + CAULDRON_H - 3);
  ctx.lineTo(cx + 12, cy + CAULDRON_H - 3);
  ctx.closePath(); ctx.fill();

  // Rim — outer
  ctx.fillStyle = P.STONE_DK;
  ctx.beginPath();
  ctx.ellipse(cx + CAULDRON_W/2, cy + 2, CAULDRON_W/2 + 2, 10, 0, 0, Math.PI*2);
  ctx.fill();
  // Rim — inner
  ctx.fillStyle = P.STONE;
  ctx.beginPath();
  ctx.ellipse(cx + CAULDRON_W/2, cy, CAULDRON_W/2, 8, 0, 0, Math.PI*2);
  ctx.fill();

  // Handle arcs
  ctx.strokeStyle = P.STONE_DK; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx-2, cy+20, 8, -0.5, 1.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx+CAULDRON_W+2, cy+20, 8, Math.PI-1.2, Math.PI+0.5); ctx.stroke();

  // Liquid surface with fill level
  if (cauldron.length > 0 || brewFlash > 0) {
    // Blend all ingredient colors for the mix
    let mixR = 0, mixG = 0, mixB = 0;
    if (cauldron.length > 0) {
      for (const cId of cauldron) {
        const ing = INGREDIENTS.find(i => i.id === cId);
        if (ing) {
          const col = ing.color;
          mixR += parseInt(col.slice(1,3),16); mixG += parseInt(col.slice(3,5),16); mixB += parseInt(col.slice(5,7),16);
        }
      }
      mixR = Math.floor(mixR/cauldron.length); mixG = Math.floor(mixG/cauldron.length); mixB = Math.floor(mixB/cauldron.length);
    } else { mixR=100; mixG=200; mixB=100; }
    const mixColor = `rgb(${mixR},${mixG},${mixB})`;
    // Fill level: empty → full based on cauldron slots used
    const fillPct = Math.min(1, cauldron.length / maxCauldronSlots);
    const liquidTop = cy + CAULDRON_H * 0.6 - fillPct * (CAULDRON_H * 0.55);
    const liquidBot = cy + CAULDRON_H - 5;
    // Liquid body
    ctx.fillStyle = mixColor; ctx.globalAlpha = 0.6;
    ctx.beginPath();
    const waveAmp = 1.5 + fillPct * 1.5;
    ctx.moveTo(cx+10, liquidTop);
    for (let px = 0; px <= CAULDRON_W-20; px += 4) {
      const wy = liquidTop + Math.sin(gameTime*4 + px*0.15) * waveAmp;
      ctx.lineTo(cx+10+px, wy);
    }
    ctx.lineTo(cx+CAULDRON_W-10, liquidBot);
    ctx.lineTo(cx+10, liquidBot);
    ctx.closePath(); ctx.fill();
    // Surface sheen
    ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.08;
    ctx.beginPath();
    ctx.moveTo(cx+15, liquidTop+2);
    for (let px = 0; px <= CAULDRON_W-30; px += 4) {
      ctx.lineTo(cx+15+px, liquidTop+2+Math.sin(gameTime*4+px*0.15)*waveAmp);
    }
    ctx.lineTo(cx+CAULDRON_W-15, liquidTop+6);
    ctx.lineTo(cx+15, liquidTop+6);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // Colored steam wisps (based on ingredients)
    for (let i = 0; i < 3; i++) {
      const sx = cx + 25 + i * 20 + Math.sin(gameTime*2+i)*8;
      const sy = cy - 5 - Math.sin(gameTime*3+i*2)*4;
      const smokeColor = cauldron.length > 0 ? (INGREDIENTS.find(ig => ig.id === cauldron[i % cauldron.length])?.color || P.WHITE) : P.WHITE;
      ctx.fillStyle = smokeColor; ctx.globalAlpha = 0.1 + Math.sin(gameTime+i)*0.04;
      ctx.beginPath(); ctx.arc(sx, sy, 6+Math.sin(gameTime+i)*2, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Brew flash
  if (brewFlash > 0) {
    ctx.fillStyle = P.SUCCESS; ctx.globalAlpha = brewFlash * 2;
    ctx.beginPath();
    ctx.ellipse(cx + CAULDRON_W/2, cy, CAULDRON_W/2 + 10, CAULDRON_H/2, 0, 0, Math.PI*2);
    ctx.fill(); ctx.globalAlpha = 1;
  }

  // Cauldron damage visual
  if (cauldronDamaged > 0) {
    ctx.fillStyle = P.EXPLOSIVE; ctx.globalAlpha = 0.15 + Math.sin(gameTime*8)*0.1;
    ctx.beginPath();
    ctx.ellipse(cx + CAULDRON_W/2, cy + CAULDRON_H/2, CAULDRON_W/2+5, CAULDRON_H/2+5, 0, 0, Math.PI*2);
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx+20, cy+15); ctx.lineTo(cx+35, cy+30); ctx.lineTo(cx+28, cy+45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+60, cy+20); ctx.lineTo(cx+70, cy+40); ctx.stroke();
    if (Math.random() < 0.3) {
      particles.push({ x: cx+CAULDRON_W/2+(Math.random()-0.5)*30, y: cy, vx: (Math.random()-0.5)*1, vy: -Math.random()*2-1, life: 0.6, color: '#555', size: 4+Math.random()*4 });
    }
  }

  // Bubbles
  for (const b of bubbles) {
    ctx.fillStyle = P.BUBBLE; ctx.globalAlpha = b.life;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill();
    // Bubble highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(b.x-1, b.y-1, b.size*0.3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Legs
  ctx.fillStyle = P.STONE_DK;
  ctx.fillRect(cx + 12, cy + CAULDRON_H, 6, 10);
  ctx.fillRect(cx + CAULDRON_W - 18, cy + CAULDRON_H, 6, 10);

  // Cauldron contents label
  if (cauldron.length > 0) {
    const labelY = cy + CAULDRON_H + 25;
    ctx.textAlign = 'center'; ctx.font = '11px monospace';
    const contentStr = cauldron.map(id => {
      const ing = INGREDIENTS.find(i => i.id === id);
      return ing ? ing.symbol : '?';
    }).join(' + ');
    ctx.fillStyle = P.PARCHMENT;
    ctx.fillText(contentStr, cx + CAULDRON_W/2, labelY);
  }

  // Brew queue indicator — small potion bottle icons
  if (brewQueue.length > 0) {
    const qx = cx + CAULDRON_W + 12;
    const qy = cy + 10;
    ctx.fillStyle = P.PARCHMENT; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'left';
    ctx.fillText('Q:', qx, qy - 4);
    for (let qi = 0; qi < brewQueue.length; qi++) {
      const bx = qx + 14 + qi * 18;
      const by = qy - 10;
      // Small bottle shape
      ctx.fillStyle = brewQueue[qi].potionColor || P.POTION_GLO;
      ctx.globalAlpha = 0.7 + Math.sin(gameTime*3+qi)*0.15;
      ctx.fillRect(bx+2, by, 4, 3); // neck
      ctx.beginPath();
      ctx.moveTo(bx, by+3); ctx.lineTo(bx+8, by+3);
      ctx.lineTo(bx+7, by+12); ctx.lineTo(bx+1, by+12);
      ctx.closePath(); ctx.fill();
      // Bottle outline
      ctx.strokeStyle = P.WHITE; ctx.lineWidth = 1;
      ctx.strokeRect(bx, by+3, 8, 9);
      ctx.globalAlpha = 1;
    }
  }
}

function drawBoss() {
  if (!boss || !boss.customer || boss.appearTimer > 0) return;
  const bc = boss.customer;
  const bob = Math.sin(gameTime * 2) * 3;
  const x = Math.floor(bc.x), y = Math.floor(bc.y + bob);
  const def = boss.def;

  // Boss glow aura
  if (!boss.defeated) {
    const glowR = 40 + Math.sin(gameTime*3)*10;
    const glow = ctx.createRadialGradient(x+15, y+20, 5, x+15, y+20, glowR);
    glow.addColorStop(0, def.color + '44');
    glow.addColorStop(1, def.color + '00');
    ctx.fillStyle = glow;
    ctx.fillRect(x-30, y-30, 90, 100);
  }

  // Larger body for boss (1.3x scale)
  ctx.save();
  ctx.translate(x+15, y+25);
  ctx.scale(1.3, 1.3);
  ctx.translate(-(x+15), -(y+25));

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x+15, y+50, 16, 4, 0, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.fillStyle = def.color;
  ctx.beginPath();
  ctx.moveTo(x, y+14); ctx.lineTo(x+30, y+14);
  ctx.lineTo(x+28, y+48); ctx.lineTo(x+2, y+48);
  ctx.closePath(); ctx.fill();

  // Head
  ctx.fillStyle = '#cc9966';
  ctx.beginPath(); ctx.arc(x+15, y+6, 14, 0, Math.PI*2); ctx.fill();

  // Boss-specific details
  if (def.id === 'glutton') {
    // Extra wide body, big mouth
    ctx.fillStyle = def.color;
    ctx.fillRect(x-3, y+20, 36, 28);
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(x+15, y+12, 5, 0, Math.PI); ctx.fill(); // open mouth
  } else if (def.id === 'plaguebearer') {
    // Hood
    ctx.fillStyle = '#224422';
    ctx.beginPath(); ctx.arc(x+15, y+4, 16, Math.PI, Math.PI*2); ctx.fill();
    ctx.fillRect(x+1, y+2, 28, 10);
    // Green aura particles
    if (!boss.defeated && Math.random() < 0.3) {
      particles.push({ x: x+15+(Math.random()-0.5)*40, y: y+(Math.random()-0.5)*40, vx:(Math.random()-0.5)*1, vy:-Math.random()*1, life:0.8, color:'#44cc44', size:2 });
    }
  } else if (def.id === 'shapeshifter') {
    // Shifting body color
    const shiftPhase = (gameTime % 4) / 4;
    const hue = shiftPhase * 360;
    ctx.fillStyle = `hsl(${hue}, 60%, 50%)`;
    ctx.fillRect(x+2, y+16, 26, 30);
  } else if (def.id === 'dragon') {
    // Dragon head horns
    ctx.fillStyle = '#aa3300';
    ctx.beginPath(); ctx.moveTo(x+5, y-4); ctx.lineTo(x+2, y-16); ctx.lineTo(x+10, y-2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+25, y-4); ctx.lineTo(x+28, y-16); ctx.lineTo(x+20, y-2); ctx.fill();
    // Snout
    ctx.fillStyle = '#dd6622';
    ctx.beginPath(); ctx.arc(x+15, y+10, 6, 0, Math.PI); ctx.fill();
    // Fire breath between phases
    if (boss.scorchActive) {
      for (let i = 0; i < 3; i++) {
        particles.push({ x: x+15+(Math.random()-0.5)*10, y: y+14, vx:(Math.random()-0.5)*2+2, vy:Math.random()*3+1, life:0.6, color:[P.FIRE_1,P.FIRE_2,P.EMBER][i], size:4+Math.random()*3 });
      }
    }
  }

  // Eyes (menacing, red)
  ctx.fillStyle = '#ff3333';
  ctx.fillRect(x+8, y+3, 4, 4);
  ctx.fillRect(x+18, y+3, 4, 4);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x+9, y+3, 1, 1);
  ctx.fillRect(x+19, y+3, 1, 1);

  ctx.restore();

  // Boss HP bar
  if (!boss.defeated) {
    const hpBarW = 60, hpBarH = 8;
    const hpX = x + 15 - hpBarW/2, hpY = y - 30;
    ctx.fillStyle = '#333';
    drawRoundRect(hpX, hpY, hpBarW, hpBarH, 3, '#333', null);
    const hpFill = (boss.hp / boss.maxHp) * hpBarW;
    drawRoundRect(hpX, hpY, hpFill, hpBarH, 3, P.BOSS_HP, null);
    // HP text
    ctx.fillStyle = P.WHITE; ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`${boss.hp}/${boss.maxHp}`, x+15, hpY + 7);

    // Boss name label
    ctx.fillStyle = def.color; ctx.font = 'bold 9px monospace';
    ctx.fillText(def.name, x+15, hpY - 4);

    // Speech bubble with current ailment
    const ail = boss.ailment;
    ctx.font = 'bold 8px monospace';
    const nameW = ctx.measureText(ail.name).width;
    const bubW = Math.max(40, nameW + 26);
    const bx = x + 30, by = y - 55;
    drawRoundRect(bx, by, bubW, 28, 5, P.WHITE, def.color);
    ctx.fillStyle = P.WHITE;
    ctx.beginPath(); ctx.moveTo(bx+5, by+28); ctx.lineTo(bx, by+36); ctx.lineTo(bx+12, by+28); ctx.fill();
    ctx.fillStyle = ail.color; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
    ctx.fillText(ail.icon, bx+12, by+16);
    ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'left';
    ctx.fillText(ail.name, bx+22, by+16);
    ctx.textAlign = 'center';

    // Patience bar for boss
    const bpRatio = bc.patience / bc.maxPatience;
    const bpW = 50, bpH = 5, bpX = x+15-bpW/2, bpY = y + 58;
    drawRoundRect(bpX, bpY, bpW, bpH, 2, '#333', null);
    let bpR, bpG;
    if (bpRatio > 0.5) { bpR = Math.floor(255*(1-(bpRatio-0.5)*2)); bpG = 200; }
    else { bpR = 220; bpG = Math.floor(200*bpRatio*2); }
    drawRoundRect(bpX, bpY, Math.max(4, bpW*bpRatio), bpH, 2, `rgb(${bpR},${bpG},50)`, null);
  }
}

function drawCustomer(c) {
  if (!c) return;

  // === DEATH ANIMATION RENDERING ===
  if (c.dying && c.deathTimer > 0) {
    const progress = 1 - (c.deathTimer / 1.5); // 0 → 1 over death duration
    const dx = Math.floor(c.x), dy = Math.floor(c.y);
    ctx.save();

    if (c.deathType === 'throb') {
      // Swell up, turn red, then pop
      const swell = 1 + progress * 0.6;
      ctx.translate(dx+15, dy+25); ctx.scale(swell, swell); ctx.translate(-(dx+15), -(dy+25));
      ctx.globalAlpha = 1 - progress * 0.3;
      ctx.fillStyle = `rgba(204,${Math.floor(50*(1-progress))},${Math.floor(50*(1-progress))},${1-progress*0.5})`;
      ctx.fillRect(dx+2, dy+5, 26, 42);
      // Head swelling
      ctx.beginPath(); ctx.arc(dx+15, dy+2, 10*swell, 0, Math.PI*2); ctx.fill();
      // Pain lines radiating out
      ctx.strokeStyle = P.DANGER; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI*2*i)/6 + gameTime*3;
        const r1 = 15 + progress*10, r2 = r1 + 5 + progress*8;
        ctx.beginPath(); ctx.moveTo(dx+15+Math.cos(a)*r1, dy+15+Math.sin(a)*r1);
        ctx.lineTo(dx+15+Math.cos(a)*r2, dy+15+Math.sin(a)*r2); ctx.stroke();
      }
    } else if (c.deathType === 'wobble') {
      // Melt downward, turn green, puddle forms
      const melt = progress * 0.7;
      ctx.translate(dx+15, dy+46); ctx.scale(1 + melt*0.5, 1 - melt); ctx.translate(-(dx+15), -(dy+46));
      ctx.globalAlpha = 1 - progress*0.4;
      ctx.fillStyle = `rgb(${Math.floor(68+progress*30)},${Math.floor(170-progress*50)},${Math.floor(68)})`;
      ctx.fillRect(dx+2, dy+5, 26, 42);
      ctx.beginPath(); ctx.arc(dx+15, dy+2, 10, 0, Math.PI*2); ctx.fill();
      // Green puddle growing beneath
      ctx.fillStyle = 'rgba(68,170,68,0.5)';
      ctx.beginPath(); ctx.ellipse(dx+15, dy+48, 12+progress*10, 3+progress*4, 0, 0, Math.PI*2); ctx.fill();
      // Drip particles
      if (Math.random() < 0.3) {
        particles.push({ x:dx+10+Math.random()*10, y:dy+30+progress*15, vx:0, vy:2, life:0.4, color:'#44aa44', size:2 });
      }
    } else if (c.deathType === 'droop') {
      // Collapse sideways, fade out
      const tilt = progress * 0.8;
      ctx.translate(dx+15, dy+46); ctx.rotate(tilt); ctx.translate(-(dx+15), -(dy+46));
      ctx.globalAlpha = 1 - progress*0.6;
      ctx.fillStyle = `rgba(70,100,170,${1-progress*0.5})`;
      ctx.fillRect(dx+2, dy+5, 26, 42);
      ctx.beginPath(); ctx.arc(dx+15, dy+2, 10, 0, Math.PI*2); ctx.fill();
      // Zzz floating up
      if (progress > 0.3) {
        ctx.fillStyle = P.CRYS_BLUE; ctx.font = `${10+progress*4}px monospace`; ctx.textAlign = 'center';
        ctx.fillText('z', dx+25, dy - progress*20);
        ctx.fillText('Z', dx+30, dy - progress*30 - 5);
      }
    } else if (c.deathType === 'glow') {
      // Catch fire, burn up
      ctx.globalAlpha = 1 - progress*0.5;
      ctx.fillStyle = `rgb(${Math.floor(255-progress*100)},${Math.floor(130-progress*100)},${Math.floor(50)})`;
      ctx.fillRect(dx+2, dy+5, 26, 42);
      ctx.beginPath(); ctx.arc(dx+15, dy+2, 10, 0, Math.PI*2); ctx.fill();
      // Fire particles rising
      for (let f = 0; f < 2; f++) {
        if (Math.random() < 0.5) {
          particles.push({
            x: dx+5+Math.random()*20, y: dy+10+Math.random()*30,
            vx: (Math.random()-0.5)*2, vy: -Math.random()*4-2,
            life: 0.6, color: [P.FIRE_1,P.FIRE_2,P.FIRE_3][Math.floor(Math.random()*3)], size: 3+Math.random()*3
          });
        }
      }
      // Flickering fire overlay
      ctx.fillStyle = `rgba(255,${Math.floor(100+Math.random()*50)},0,${progress*0.4})`;
      ctx.fillRect(dx, dy+5-progress*10, 30, 45);
    } else if (c.deathType === 'spark') {
      // Crack lines appear, then shatter
      ctx.globalAlpha = 1 - progress*0.3;
      ctx.fillStyle = c.ailment.color || P.MUSH_PURPLE;
      ctx.fillRect(dx+2, dy+5, 26, 42);
      ctx.beginPath(); ctx.arc(dx+15, dy+2, 10, 0, Math.PI*2); ctx.fill();
      // Crack lines
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
      const numCracks = Math.floor(progress * 8);
      for (let cr = 0; cr < numCracks; cr++) {
        const cx = dx + 5 + (cr * 3) % 20, cy = dy + 5 + (cr * 7) % 35;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + (Math.random()-0.5)*10, cy + Math.random()*8); ctx.stroke();
      }
      // Pieces breaking off
      if (progress > 0.5 && Math.random() < 0.3) {
        particles.push({
          x: dx+5+Math.random()*20, y: dy+5+Math.random()*35,
          vx: (Math.random()-0.5)*4, vy: -Math.random()*3,
          life: 0.8, color: c.ailment.color || P.MUSH_PURPLE, size: 2+Math.random()*3
        });
      }
    }
    ctx.restore();
    return; // Don't draw normal customer during death
  }

  const bob = Math.sin(c.bobTimer) * 2;
  const breathe = Math.sin(c.bobTimer * 0.8) * 0.5;
  // Ailment animation offsets
  const anim = c.ailment.anim || 'throb';
  let animX = 0, animY = 0;
  if (c.arrived && !c.served && !c.leaving) {
    if (anim === 'wobble') animX = Math.sin(gameTime * 5) * 2;
    else if (anim === 'droop') animY = Math.abs(Math.sin(gameTime * 2)) * 2;
  }
  // Behavior offsets (Feature 2)
  let behaviorOffsetX = 0;
  if (c.behavior === 'pacer' && c.arrived && !c.served && !c.leaving) {
    behaviorOffsetX = Math.sin(gameTime * 3 + c.slot) * 8;
  }
  const x = Math.floor(c.x + animX + behaviorOffsetX), y = Math.floor(c.y + bob + animY);

  // Shadow under feet
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x+15, y+48, 12, 3, 0, 0, Math.PI*2); ctx.fill();

  // Sitter: draw stool/chair (Feature 2)
  if (c.behavior === 'sitter' && c.arrived && !c.served && !c.leaving) {
    ctx.fillStyle = P.COUNTER;
    ctx.fillRect(x+4, y+44, 22, 6); // seat
    ctx.fillStyle = P.COUNTER_LT;
    ctx.fillRect(x+6, y+50, 3, 6); // left leg
    ctx.fillRect(x+21, y+50, 3, 6); // right leg
  }

  // Mutation warning flash (Feature 3A)
  if (c.mutationPending && c.mutationWarnTimer > 0) {
    const flashAlpha = Math.sin(gameTime * 10) * 0.3 + 0.3;
    ctx.fillStyle = P.MUSH_PURPLE; ctx.globalAlpha = flashAlpha;
    ctx.fillRect(x - 2, y - 5, 34, 55);
    ctx.globalAlpha = 1;
  }

  // Body with breathing
  ctx.save();
  ctx.translate(x+15, y+46);
  ctx.scale(1 + breathe*0.015, 1 - breathe*0.01);
  ctx.translate(-(x+15), -(y+46));

  // Torso
  ctx.fillStyle = c.look.cloth;
  ctx.beginPath();
  ctx.moveTo(x+2, y+16);
  ctx.lineTo(x+28, y+16);
  ctx.lineTo(x+26, y+46);
  ctx.lineTo(x+4, y+46);
  ctx.closePath(); ctx.fill();

  // Shirt detail — lighter panel
  ctx.fillStyle = lighten(c.look.cloth, 20);
  ctx.fillRect(x + 3, y + 18, 8, 14);

  // Belt
  ctx.fillStyle = P.TEXT_DARK;
  ctx.fillRect(x+3, y+40, 24, 3);
  ctx.fillStyle = P.ACCENT;
  ctx.fillRect(x+13, y+39, 4, 5); // buckle

  ctx.restore();

  // Head
  ctx.fillStyle = c.look.skin;
  ctx.beginPath(); ctx.arc(x + 15, y + 8, 12, 0, Math.PI*2); ctx.fill();

  // Ears
  ctx.fillStyle = c.look.skin;
  ctx.beginPath(); ctx.arc(x + 3, y + 10, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 27, y + 10, 3, 0, Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle = c.look.hair;
  ctx.beginPath(); ctx.arc(x + 15, y + 3, 12, Math.PI, Math.PI*2); ctx.fill();
  // Side hair
  ctx.fillRect(x+2, y+2, 3, 8);
  ctx.fillRect(x+25, y+2, 3, 8);

  // Hat
  if (c.look.hat === 'wizard') {
    ctx.fillStyle = c.look.cloth;
    ctx.beginPath(); ctx.moveTo(x+6, y-4); ctx.lineTo(x+14, y-16); ctx.lineTo(x+22, y-4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.ACCENT; ctx.fillRect(x+4, y-4, 20, 3);
  } else if (c.look.hat === 'hood') {
    ctx.fillStyle = c.look.cloth; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(x+14, y, 12, Math.PI, 0); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (c.look.hat === 'bandana') {
    ctx.fillStyle = '#cc3333';
    ctx.fillRect(x+6, y-3, 16, 4);
    ctx.fillStyle = '#aa2222';
    ctx.fillRect(x+20, y-2, 6, 2);
  }

  // Eyes with blink and expression
  const blinkCycle = (gameTime + c.bobTimer) % 5;
  const isBlinking = blinkCycle > 4.85;
  const pRatio = c.patience / c.maxPatience;
  if (isBlinking) {
    ctx.strokeStyle = P.TEXT_DARK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x+9, y+8); ctx.lineTo(x+13, y+8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+17, y+8); ctx.lineTo(x+21, y+8); ctx.stroke();
  } else if (c.served) {
    // Happy squint eyes
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x+10, y+7, 2, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+18, y+7, 2, Math.PI, 0); ctx.stroke();
  } else if (pRatio < 0.25) {
    // Angry narrow eyes
    ctx.fillStyle = '#fff'; ctx.fillRect(x+8, y+6, 5, 2); ctx.fillRect(x+16, y+6, 5, 2);
    ctx.fillStyle = '#000'; ctx.fillRect(x+10, y+6, 2, 2); ctx.fillRect(x+18, y+6, 2, 2);
    // Angry eyebrows
    ctx.strokeStyle = c.look.hair; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x+7, y+3); ctx.lineTo(x+13, y+5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+21, y+3); ctx.lineTo(x+15, y+5); ctx.stroke();
  } else if (pRatio < 0.5) {
    // Worried eyes
    ctx.fillStyle = '#fff'; ctx.fillRect(x+8, y+5, 5, 5); ctx.fillRect(x+16, y+5, 5, 5);
    ctx.fillStyle = '#000'; ctx.fillRect(x+10, y+6, 2, 2); ctx.fillRect(x+18, y+6, 2, 2);
    // Raised eyebrows
    ctx.strokeStyle = c.look.hair; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x+8, y+3); ctx.lineTo(x+13, y+4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+20, y+3); ctx.lineTo(x+15, y+4); ctx.stroke();
  } else {
    // Normal eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 9, y + 5, 5, 5);
    ctx.fillRect(x + 17, y + 5, 5, 5);
    ctx.fillStyle = P.TEXT_DARK;
    ctx.fillRect(x + 10, y + 6, 3, 3);
    ctx.fillRect(x + 18, y + 6, 3, 3);
    // Eye shine
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 11, y + 6, 1, 1);
    ctx.fillRect(x + 19, y + 6, 1, 1);
  }

  // Mouth expression
  const patienceRatio = c.patience / c.maxPatience;
  if (c.served) {
    // Happy smile
    ctx.strokeStyle = P.TEXT_DARK; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x+15, y+12, 4, 0.1*Math.PI, 0.9*Math.PI); ctx.stroke();
    // Blush
    ctx.fillStyle = '#dd8888'; ctx.globalAlpha = 0.3;
    ctx.beginPath(); ctx.arc(x+7, y+12, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+23, y+12, 3, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (patienceRatio < 0.3) {
    // Angry frown
    ctx.strokeStyle = P.DANGER; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x+15, y+16, 4, 1.1*Math.PI, 1.9*Math.PI); ctx.stroke();
    // Angry eyebrows
    ctx.strokeStyle = P.TEXT_DARK; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x+9, y+3); ctx.lineTo(x+13, y+5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+21, y+3); ctx.lineTo(x+17, y+5); ctx.stroke();
  } else if (patienceRatio < 0.6) {
    // Worried
    ctx.strokeStyle = P.TEXT_DARK; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x+15, y+15, 3, 1.2*Math.PI, 1.8*Math.PI); ctx.stroke();
  } else {
    // Neutral
    ctx.fillStyle = P.TEXT_DARK; ctx.fillRect(x+12, y+13, 6, 1.5);
  }

  // Speech bubble with ailment
  if (c.arrived && !c.served && !c.leaving) {
    // Measure ailment name for bubble width
    ctx.font = 'bold 8px monospace';
    const nameW = ctx.measureText(c.ailment.name).width;
    const bubW = Math.max(36, nameW + 26);
    const bx = x + 25, by = y - 30;
    // Bubble shadow
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    drawRoundRect(bx+2, by+2, bubW, 32, 5, 'rgba(0,0,0,0.1)', null);
    // Bubble
    drawRoundRect(bx, by, bubW, 32, 5, P.WHITE, P.TEXT_DARK);
    ctx.fillStyle = P.WHITE;
    ctx.beginPath(); ctx.moveTo(bx+5, by+32); ctx.lineTo(bx, by+40); ctx.lineTo(bx+12, by+32); ctx.fill();
    ctx.strokeStyle = P.TEXT_DARK; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(bx+4, by+32); ctx.lineTo(bx, by+40); ctx.lineTo(bx+13, by+32); ctx.stroke();
    // Ailment icon with pulse
    const iconPulse = 1 + Math.sin(gameTime*4)*0.05;
    ctx.save(); ctx.translate(bx+12, by+14); ctx.scale(iconPulse, iconPulse);
    ctx.fillStyle = c.ailment.color;
    ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    ctx.fillText(c.ailment.icon, 0, 3);
    ctx.restore();
    // Ailment name
    ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'left';
    ctx.fillText(c.ailment.name, bx + 22, by + 17);
    // Customer Whisperer: show exact recipe ingredients below name
    if (upgradeLevels.customer_whisperer) {
      const recipe = c.ailment.recipe;
      for (let ri = 0; ri < recipe.length; ri++) {
        const ing = INGREDIENTS.find(ig => ig.id === recipe[ri]);
        if (ing) {
          ctx.fillStyle = ing.color;
          ctx.font = 'bold 7px monospace';
          ctx.fillText(ing.symbol, bx + 22 + ri * 10, by + 26);
        }
      }
    }
    ctx.textAlign = 'center';

    // Patience bar with gradient color
    const barW = 30, barH = 5, barX = x, barY = y + 54;
    drawRoundRect(barX, barY, barW, barH, 2, '#333', null);
    // Smooth green → yellow → orange → red
    let pR, pG, pB;
    if (patienceRatio > 0.66) { const t = (patienceRatio-0.66)/0.34; pR = Math.floor(255*(1-t)); pG = 200; pB = 50; }
    else if (patienceRatio > 0.33) { const t = (patienceRatio-0.33)/0.33; pR = 255; pG = Math.floor(100+100*t); pB = 50; }
    else { const t = patienceRatio/0.33; pR = 220; pG = Math.floor(60*t); pB = 30; }
    const pColor = `rgb(${pR},${pG},${pB})`;
    const filledW = Math.max(4, barW * patienceRatio);
    drawRoundRect(barX, barY, filledW, barH, 2, pColor, null);

    // Urgency flash + pulse when low patience
    if (patienceRatio < 0.25) {
      const pulseSpeed = patienceRatio < 0.1 ? 0.02 : 0.01;
      ctx.globalAlpha = 0.12 + Math.sin(Date.now() * pulseSpeed) * 0.08;
      ctx.fillStyle = P.DANGER;
      ctx.fillRect(x - 2, y - 25, 34, 86);
      ctx.globalAlpha = 1;
      // Pulsing bar
      const pulseW = filledW + Math.sin(Date.now() * 0.015) * 2;
      ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.2;
      drawRoundRect(barX, barY, Math.max(4, pulseW), barH, 2, '#fff', null);
      ctx.globalAlpha = 1;
    }
  }

  // Personality indicators
  if (c.personality === 'generous') {
    ctx.fillStyle = '#ffdd00'; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
    ctx.fillText('$', x+26, y-5 + Math.sin(gameTime*3)*2);
  }
  if (c.personality === 'panicky') {
    for (let sw = 0; sw < 2; sw++) {
      const swx = x + 5 + sw*20, swy = y + 2 + Math.sin(gameTime*4+sw)*3;
      ctx.fillStyle = '#88ccff'; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.ellipse(swx, swy, 1.5, 2.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  if (c.personality === 'contagious') {
    ctx.fillStyle = '#44dd44'; ctx.globalAlpha = 0.15 + Math.sin(gameTime*2)*0.05;
    ctx.beginPath(); ctx.arc(x+15, y+20, 18, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Priority icons
  if (c.priority === 'generous' || (c.personality === 'generous' && c.priority !== 'desperate' && c.priority !== 'stingy')) {
    // Gold coin icon above head
    const coinY = y - 20 + Math.sin(gameTime*2.5)*2;
    ctx.fillStyle = P.ACCENT; ctx.beginPath(); ctx.arc(x+15, coinY, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 6px monospace'; ctx.textAlign = 'center';
    ctx.fillText('$', x+15, coinY+2);
  }
  if (c.priority === 'desperate') {
    // Red exclamation icon
    const exY = y - 22 + Math.sin(gameTime*4)*2;
    ctx.fillStyle = P.DANGER; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
    ctx.globalAlpha = 0.8 + Math.sin(gameTime*5)*0.2;
    ctx.fillText('!', x+15, exY);
    ctx.globalAlpha = 1;
  }
  if (c.priority === 'stingy') {
    // Grey coin icon
    const stY = y - 20 + Math.sin(gameTime*2)*1.5;
    ctx.fillStyle = '#888888'; ctx.beginPath(); ctx.arc(x+15, stY, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#555555'; ctx.font = 'bold 5px monospace'; ctx.textAlign = 'center';
    ctx.fillText('$', x+15, stY+2);
  }

  // VIP customer visuals
  if (c.isVIP) {
    // Gold outline
    ctx.strokeStyle = P.SHOP_GOLD; ctx.lineWidth = 2;
    ctx.globalAlpha = 0.6 + Math.sin(gameTime*3)*0.2;
    ctx.strokeRect(x-2, y-8, 34, 58);
    ctx.globalAlpha = 1;
    // Crown
    ctx.fillStyle = P.SHOP_GOLD;
    ctx.beginPath();
    ctx.moveTo(x+5, y-12); ctx.lineTo(x+8, y-20); ctx.lineTo(x+11, y-14);
    ctx.lineTo(x+15, y-22); ctx.lineTo(x+19, y-14); ctx.lineTo(x+22, y-20);
    ctx.lineTo(x+25, y-12); ctx.closePath(); ctx.fill();
    // Sparkle particles
    if (Math.random() < 0.15) {
      particles.push({ x: x+Math.random()*30, y: y-10+Math.random()*20, vx:(Math.random()-0.5)*1, vy:-Math.random()*1.5, life:0.5, color:P.SHOP_GOLD, size:1.5+Math.random()*1.5 });
    }
  }

  // Rare customer crown
  if (c.rare && !c.isVIP) {
    ctx.fillStyle = P.RARE_GOLD;
    ctx.beginPath();
    ctx.moveTo(x+5, y-10); ctx.lineTo(x+8, y-16); ctx.lineTo(x+11, y-12);
    ctx.lineTo(x+15, y-18); ctx.lineTo(x+19, y-12); ctx.lineTo(x+22, y-16);
    ctx.lineTo(x+25, y-10); ctx.closePath(); ctx.fill();
    ctx.fillStyle = P.RARE_GOLD; ctx.globalAlpha = 0.15 + Math.sin(gameTime*4)*0.1;
    ctx.beginPath(); ctx.arc(x+15, y-5, 18, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Per-ailment illness visual effects on character sprite
  if (c.arrived && !c.served && !c.leaving) {
    const aType = c.ailment.anim;
    if (aType === 'glow') {
      // Feverish / burning glow around body + heat shimmer lines
      ctx.fillStyle = c.ailment.color; ctx.globalAlpha = 0.10 + Math.sin(gameTime*3)*0.06;
      ctx.beginPath(); ctx.arc(x+15, y+20, 24, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      // Rising heat shimmer
      for (let i = 0; i < 3; i++) {
        const sx = x + 5 + i * 10 + Math.sin(gameTime*4 + i*2)*3;
        const sy = y - 5 - Math.sin(gameTime*3 + i)*8;
        ctx.strokeStyle = c.ailment.color; ctx.globalAlpha = 0.3 - (i*0.08); ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sx, sy+8); ctx.quadraticCurveTo(sx+3, sy+4, sx, sy);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (aType === 'spark') {
      // Electric/magical sparks flying off the body
      if (Math.random() < 0.2) {
        particles.push({ x: x+Math.random()*30, y: y+Math.random()*40, vx: (Math.random()-0.5)*3, vy: -Math.random()*3, life: 0.5, color: c.ailment.color, size: 2+Math.random()*2 });
      }
      // Crackling lines
      if (Math.random() < 0.1) {
        const lx = x + 5 + Math.random()*20, ly = y + Math.random()*30;
        ctx.strokeStyle = c.ailment.color; ctx.globalAlpha = 0.6; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(lx, ly);
        ctx.lineTo(lx + (Math.random()-0.5)*12, ly + (Math.random()-0.5)*12);
        ctx.lineTo(lx + (Math.random()-0.5)*16, ly + (Math.random()-0.5)*16);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
    } else if (aType === 'wobble') {
      // Nausea — green face tint + swirl particles + sweat drops
      ctx.fillStyle = '#55cc55'; ctx.globalAlpha = 0.12 + Math.sin(gameTime*4)*0.05;
      ctx.beginPath(); ctx.arc(x+15, y+8, 13, 0, Math.PI*2); ctx.fill(); // green face
      ctx.globalAlpha = 1;
      // Sweat drops
      const sweatDrop = Math.sin(gameTime*3)*4;
      ctx.fillStyle = '#88ccff'; ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(x+4, y+5+sweatDrop, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+26, y+7+sweatDrop*0.7, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      // Spiral dizzy symbol above head
      ctx.strokeStyle = P.PARCHMENT; ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
      const spiralT = gameTime*3;
      ctx.beginPath();
      for (let a = 0; a < Math.PI*3; a += 0.3) {
        const sr = a * 1.2;
        ctx.lineTo(x+15 + Math.cos(a+spiralT)*sr*0.4, y-18 + Math.sin(a+spiralT)*sr*0.4);
      }
      ctx.stroke(); ctx.globalAlpha = 1;
    } else if (aType === 'droop') {
      // Fatigue/weakness — droopy eyes (drawn over), Z's floating up
      // Droopy eyelids
      ctx.fillStyle = c.look.skin; ctx.globalAlpha = 0.7;
      ctx.fillRect(x+9, y+5, 5, 3); // left eyelid half-closed
      ctx.fillRect(x+17, y+5, 5, 3); // right eyelid half-closed
      ctx.globalAlpha = 1;
      // Floating Z's
      for (let i = 0; i < 2; i++) {
        const zTime = gameTime*1.5 + i*1.5;
        const zy = y - 15 - (zTime % 3) * 8;
        const zx = x + 28 + i*8 + Math.sin(zTime)*3;
        const za = Math.max(0, 1 - ((zTime % 3) / 3));
        ctx.fillStyle = P.CRYS_BLUE; ctx.globalAlpha = za * 0.6;
        ctx.font = `bold ${8 + i*3}px monospace`; ctx.textAlign = 'center';
        ctx.fillText('z', zx, zy);
      }
      ctx.globalAlpha = 1;
    } else if (aType === 'throb') {
      // Headache/fracture — pulsing red pain indicator at head + impact lines
      const throb = Math.sin(gameTime*6);
      ctx.fillStyle = P.DANGER; ctx.globalAlpha = 0.15 + throb * 0.1;
      ctx.beginPath(); ctx.arc(x+15, y+8, 14 + throb*2, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      // Pain lines radiating from head
      if (throb > 0.3) {
        ctx.strokeStyle = P.DANGER; ctx.globalAlpha = 0.4; ctx.lineWidth = 1;
        for (let a = 0; a < 6; a++) {
          const angle = (a / 6) * Math.PI * 2 + gameTime*2;
          const innerR = 14, outerR = 18 + throb*3;
          ctx.beginPath();
          ctx.moveTo(x+15 + Math.cos(angle)*innerR, y+8 + Math.sin(angle)*innerR);
          ctx.lineTo(x+15 + Math.cos(angle)*outerR, y+8 + Math.sin(angle)*outerR);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }
  }

  // Behavior visuals (Feature 2)
  if (c.behavior === 'pacer' && c.arrived && !c.served && !c.leaving && !c.dying) {
    // Small motion lines on alternating frames
    if (Math.floor(gameTime * 8) % 2 === 0) {
      ctx.strokeStyle = P.PARCHMENT; ctx.globalAlpha = 0.3; ctx.lineWidth = 1;
      const dir = Math.sin(gameTime * 3 + c.slot) > 0 ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(x - dir*5, y+25); ctx.lineTo(x - dir*10, y+25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - dir*5, y+35); ctx.lineTo(x - dir*10, y+35); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  if (c.behavior === 'arguer' && c.arrived && !c.served && !c.leaving && !c.dying) {
    // Argument symbols cycling above head
    const symbols = ['!', '?', '@', '#', '$'];
    const symIdx = Math.floor(gameTime * 2) % symbols.length;
    ctx.fillStyle = P.DANGER; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.globalAlpha = 0.7;
    ctx.fillText(symbols[symIdx], x + 15, y - 20);
    ctx.globalAlpha = 1;
  }

  // Served animation — coin floating up
  if (c.served && c.serveAnim > 0) {
    const coinY = y - 10 - (1 - c.serveAnim) * 30;
    // Coin with shine
    ctx.fillStyle = P.ACCENT; ctx.globalAlpha = c.serveAnim;
    ctx.beginPath(); ctx.arc(x+15, coinY, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ddaa00';
    ctx.beginPath(); ctx.arc(x+15, coinY, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
    ctx.fillText('$', x+15, coinY+3);
    ctx.globalAlpha = 1;
  }
}

function drawIngredientButtons() {
  const btns = getIngredientBtns();
  // Auto-hint: figure out which ingredients are needed
  let hintIngredients = new Set();
  if (upgradeLevels.auto_hint) {
    for (const c of customers) {
      if (!c.arrived || c.served || c.leaving) continue;
      for (const ingId of c.ailment.recipe) {
        hintIngredients.add(ingId);
      }
    }
  }
  for (const btn of btns) {
    const isHover = hoverBtn === btn.id;
    const inCauldron = cauldron.filter(id => id === btn.id).length;
    const isHinted = hintIngredients.has(btn.id) && inCauldron === 0;
    const bgColor = isHinted ? lighten(P.BG_LIGHT, 30) : (isHover ? lighten(P.BG_LIGHT, 20) : P.BG_LIGHT);
    drawRoundRect(btn.x, btn.y, btn.w, btn.h, 6, bgColor, btn.color);
    ctx.fillStyle = btn.color;
    ctx.beginPath(); ctx.arc(btn.x + btn.w/2, btn.y + 18, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = lighten(btn.color, 40);
    ctx.beginPath(); ctx.arc(btn.x + btn.w/2 - 3, btn.y + 14, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = P.WHITE; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(btn.symbol, btn.x + btn.w/2, btn.y + 22);
    ctx.font = '9px monospace';
    ctx.fillText(btn.name.split(' ')[0], btn.x + btn.w/2, btn.y + btn.h - 6);
    if (inCauldron > 0) {
      ctx.fillStyle = P.ACCENT;
      ctx.beginPath(); ctx.arc(btn.x + btn.w - 8, btn.y + 8, 7, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 10px monospace';
      ctx.fillText(inCauldron, btn.x + btn.w - 8, btn.y + 12);
    }
    // Hint glow pulse
    if (isHinted) {
      ctx.strokeStyle = P.ACCENT; ctx.lineWidth = 2;
      ctx.globalAlpha = 0.3 + Math.sin(gameTime*4)*0.2;
      ctx.strokeRect(btn.x-2, btn.y-2, btn.w+4, btn.h+4);
      ctx.globalAlpha = 1;
    }
  }

  // Keyboard hint
  ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.5;
  ctx.font = '9px monospace'; ctx.textAlign = 'center';
  for (let i = 0; i < btns.length; i++) {
    ctx.fillText(`[${i+1}]`, btns[i].x + btns[i].w/2, btns[i].y + btns[i].h + 12);
  }
  ctx.globalAlpha = 1;
}

}

function drawDoubleDownButton() {

// === LINKED CHAIN DRAWING (Feature 3B) ===
function drawLinkedChains() {
  for (const pair of linkedPairs) {
    if (pair.c1.leaving || pair.c2.leaving || pair.c1.dying || pair.c2.dying) continue;
    if (!pair.c1.arrived || !pair.c2.arrived) continue;
    const x1 = pair.c1.x + 15, y1 = pair.c1.y + 20;
    const x2 = pair.c2.x + 15, y2 = pair.c2.y + 20;
    const midX = (x1 + x2) / 2, midY = Math.max(y1, y2) + 20;
    const chainAlpha = 0.5 + Math.sin(gameTime * 3) * 0.2;
    ctx.save();
    ctx.strokeStyle = P.SHOP_GOLD; ctx.lineWidth = 2; ctx.globalAlpha = chainAlpha;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.quadraticCurveTo(midX, midY, x2, y2);
    ctx.stroke();
    // Chain link dots
    for (let t = 0.1; t <= 0.9; t += 0.2) {
      const px = (1-t)*(1-t)*x1 + 2*(1-t)*t*midX + t*t*x2;
      const py = (1-t)*(1-t)*y1 + 2*(1-t)*t*midY + t*t*y2;
      ctx.fillStyle = P.SHOP_GOLD;
      ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI*2); ctx.fill();
    }
    // Timer display if counting down
    if (pair.serveTimer >= 0 && pair.serveTimer < 5) {
      ctx.fillStyle = pair.serveTimer < 2 ? P.DANGER : P.ACCENT;
      ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
      ctx.globalAlpha = 1;
      ctx.fillText(Math.ceil(pair.serveTimer) + 's', midX, midY + 15);
    }
    ctx.restore();
  }
}

// === MERCHANT OVERLAY (Feature 1) ===
function drawMerchantOverlay() {
  // Dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  const cardW = 200, cardH = 250, gap = 40;
  const totalW = cardW * 2 + gap;
  const cx = W/2 - totalW/2;
  const cy = H/2 - cardH/2;

  // Title
  ctx.fillStyle = P.SHOP_GOLD; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Traveling Merchant!', W/2, cy - 25);
  ctx.fillStyle = P.PARCHMENT; ctx.font = '12px monospace';
  ctx.fillText('Choose a bonus (' + Math.ceil(merchant.timer) + 's)', W/2, cy - 8);

  // Cards
  const options = [merchant.option1, merchant.option2];
  for (let i = 0; i < 2; i++) {
    const opt = options[i];
    const x = cx + i * (cardW + gap);
    const y = cy;
    const hover = hoverBtn === ('merchant_' + i);
    const bg = hover ? lighten(P.SHOP_PANEL, 15) : P.SHOP_PANEL;
    drawRoundRect(x, y, cardW, cardH, 10, bg, P.SHOP_GOLD);

    // Icon
    ctx.font = '40px monospace'; ctx.textAlign = 'center';
    ctx.fillStyle = P.WHITE;
    ctx.fillText(opt.icon, x + cardW/2, y + 60);

    // Name
    ctx.fillStyle = P.SHOP_GOLD; ctx.font = 'bold 14px monospace';
    ctx.fillText(opt.name, x + cardW/2, y + 100);

    // Description (word wrap)
    ctx.fillStyle = P.PARCHMENT; ctx.font = '11px monospace';
    const words = opt.desc.split(' ');
    let line = '', lineY = y + 130;
    for (const word of words) {
      const test = line + word + ' ';
      if (ctx.measureText(test).width > cardW - 20) {
        ctx.fillText(line, x + cardW/2, lineY);
        line = word + ' '; lineY += 15;
      } else { line = test; }
    }
    ctx.fillText(line, x + cardW/2, lineY);
  }
}

function drawRecipeBook() {
  const r = RECIPE_BOOK;
  drawRoundRect(r.x, r.y, r.w, r.h, 5, P.PARCHMENT, P.COUNTER);
  ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('~ Recipe Book ~', r.x + r.w/2, r.y + 16);

  ctx.textAlign = 'left';
  const available = getAvailableAilments();
  let y = r.y + 32;
  for (const a of available) {
    if (y > r.y + r.h - 8) break;
    const tierInfo = POTION_TIERS[a.tier || 1];
    const isHighlighted = recipeHighlight && recipeHighlight.id === a.id && recipeHighlight.timer > 0;

    // Highlight glow for "Almost!" feedback
    if (isHighlighted) {
      const hlAlpha = 0.15 + Math.sin(gameTime * 6) * 0.1;
      ctx.fillStyle = P.FLOW_YELLOW; ctx.globalAlpha = hlAlpha;
      ctx.fillRect(r.x + 2, y - 8, r.w - 4, 22);
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = tierInfo.color;
    ctx.beginPath(); ctx.arc(r.x + 8, y - 3, 3, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = a.color; ctx.font = 'bold 9px monospace';
    ctx.fillText(a.icon, r.x + 15, y);
    ctx.fillStyle = P.TEXT_DARK; ctx.font = '8px monospace';
    const suffix = a.ordered ? ' [ORD]' : '';
    ctx.fillText(a.name + suffix + ':', r.x + 26, y);
    y += 11;
    let xOff = r.x + 26;
    for (let i = 0; i < a.recipe.length; i++) {
      const ing = INGREDIENTS.find(ig => ig.id === a.recipe[i]);
      if (i > 0) { ctx.fillStyle = P.TEXT_DARK; ctx.fillText(a.ordered ? '>' : '+', xOff, y); xOff += 9; }
      if (ing) {
        ctx.fillStyle = ing.color; ctx.font = 'bold 8px monospace';
        ctx.fillText(ing.name.split(' ')[0], xOff, y);
        xOff += ctx.measureText(ing.name.split(' ')[0]).width + 3;
      }
    }
    ctx.font = '8px monospace';
    y += 13;
  }
}

function drawBrewerChar(agent, isAssistant) {
  const t = gameTime;
  const bx = agent.x;
  const by = agent.y;
  const bob = Math.sin(t * 2 + (isAssistant ? 1 : 0)) * 1.5;
  const isWalking = agent.state === 'walking_to' || agent.state === 'walking_back';
  const isSad = agent.state === 'sad';
  const facingRight = agent.state === 'walking_to' && agent.target && agent.target.x + 15 > agent.x;
  const facingLeft = agent.state === 'walking_to' && agent.target && agent.target.x + 15 < agent.x;

  // Walk animation: leg cycle
  const legOffset = isWalking ? Math.sin(agent.walkFrame * 8) * 3 : 0;

  ctx.save();
  // Flip for facing direction
  if (facingLeft) {
    ctx.translate(bx, 0);
    ctx.scale(-1, 1);
    ctx.translate(-bx, 0);
  }

  // Legs
  ctx.fillStyle = isAssistant ? '#445566' : '#554433';
  ctx.fillRect(bx - 5, by + 18 + bob, 4, 10 + legOffset);
  ctx.fillRect(bx + 2, by + 18 + bob, 4, 10 - legOffset);

  // Shoes
  ctx.fillStyle = '#332211';
  ctx.fillRect(bx - 6, by + 27 + bob + (isWalking ? legOffset : 0), 6, 3);
  ctx.fillRect(bx + 1, by + 27 + bob - (isWalking ? legOffset : 0), 6, 3);

  // Body
  ctx.fillStyle = isAssistant ? '#446688' : '#886644';
  ctx.fillRect(bx - 7, by + 4 + bob, 15, 16);

  // Apron
  ctx.fillStyle = isAssistant ? '#5588bb' : '#aa8855';
  ctx.fillRect(bx - 5, by + 8 + bob, 11, 10);
  // Apron pocket
  ctx.fillStyle = isAssistant ? '#4477aa' : '#997744';
  ctx.fillRect(bx - 2, by + 12 + bob, 5, 4);

  // Head
  ctx.fillStyle = isAssistant ? '#ddb088' : '#eec8a0';
  ctx.beginPath(); ctx.arc(bx + 1, by + bob, 7, 0, Math.PI*2); ctx.fill();

  // Hair
  ctx.fillStyle = isAssistant ? '#554433' : '#885522';
  ctx.beginPath();
  ctx.arc(bx + 1, by - 3 + bob, 7, Math.PI, 0);
  ctx.fill();

  // Eyes
  ctx.fillStyle = P.TEXT_DARK;
  if (isSad) {
    // Sad eyes (looking down)
    ctx.fillRect(bx - 3, by + 2 + bob, 2, 1);
    ctx.fillRect(bx + 2, by + 2 + bob, 2, 1);
  } else {
    ctx.fillRect(bx - 3, by + bob, 2, 2);
    ctx.fillRect(bx + 2, by + bob, 2, 2);
  }

  // Mouth
  if (isSad) {
    ctx.strokeStyle = P.TEXT_DARK; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(bx + 1, by + 6 + bob, 2, 0, Math.PI, true);
    ctx.stroke();
  }

  // Hat/headband
  if (isAssistant) {
    // Blue bandana
    ctx.fillStyle = '#3366aa';
    ctx.fillRect(bx - 7, by - 5 + bob, 16, 3);
  } else {
    // Chef-style hat
    ctx.fillStyle = '#fff8ee';
    ctx.fillRect(bx - 5, by - 8 + bob, 12, 6);
    ctx.fillRect(bx - 3, by - 12 + bob, 8, 5);
  }

  // Carrying potion bottle
  if (agent.potion && (agent.state === 'walking_to' || agent.state === 'delivering')) {
    const potionColor = agent.potion.potionColor || '#88ff88';
    // Small bottle
    ctx.fillStyle = '#aabbcc'; // glass
    ctx.fillRect(bx + 8, by + 6 + bob, 6, 10);
    ctx.fillStyle = potionColor;
    ctx.fillRect(bx + 9, by + 9 + bob, 4, 6);
    // Bottle cap
    ctx.fillStyle = '#776655';
    ctx.fillRect(bx + 9, by + 5 + bob, 4, 2);
    // Glow
    ctx.fillStyle = potionColor; ctx.globalAlpha = 0.3 + Math.sin(t * 6) * 0.1;
    ctx.beginPath(); ctx.arc(bx + 11, by + 12 + bob, 5, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Arms
  ctx.strokeStyle = isAssistant ? '#ddb088' : '#eec8a0';
  ctx.lineWidth = 2;
  if (agent.potion && agent.state === 'walking_to') {
    // Arm holding potion forward
    ctx.beginPath();
    ctx.moveTo(bx + 7, by + 8 + bob);
    ctx.lineTo(bx + 10, by + 10 + bob);
    ctx.stroke();
  } else {
    // Arms at sides, slight swing when walking
    const armSwing = isWalking ? Math.sin(agent.walkFrame * 8) * 4 : 0;
    ctx.beginPath();
    ctx.moveTo(bx - 7, by + 8 + bob);
    ctx.lineTo(bx - 9, by + 16 + bob + armSwing);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx + 8, by + 8 + bob);
    ctx.lineTo(bx + 10, by + 16 + bob - armSwing);
    ctx.stroke();
  }

  ctx.restore();
}

function drawBrewers() {
  // Draw player brewer
  drawBrewerChar(brewer, false);
  // Draw assistant brewer if active
  if ((upgradeLevels.assistant || 0) >= 1) {
    drawBrewerChar(assistantBrewerChar, true);
  }

  // Draw delivery queue indicators near cauldron
  if (deliveryQueue.length > 0) {
    ctx.fillStyle = P.PARCHMENT; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`Queue: ${deliveryQueue.length}`, CAULDRON_X + CAULDRON_W/2, CAULDRON_Y - 10);
    // Small potion dots showing queue
    for (let i = 0; i < Math.min(deliveryQueue.length, 5); i++) {
      ctx.fillStyle = deliveryQueue[i].potionColor || '#88ff88';
      ctx.beginPath();
      ctx.arc(CAULDRON_X + CAULDRON_W/2 - 12 + i * 6, CAULDRON_Y - 2, 2, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function drawAssistant() {
  const assistLvl = upgradeLevels.assistant || 0;
  if (assistLvl === 0) return;

  // Position: to the right of the cauldron
  const ax = CAULDRON_X + CAULDRON_W + 30;
  const ay = CAULDRON_Y + 10;
  const t = gameTime;

  // Body bob
  const bob = Math.sin(t * 2) * 1.5;

  // Small brewing table
  ctx.fillStyle = P.COUNTER;
  ctx.fillRect(ax - 8, ay + 32, 36, 6);
  ctx.fillStyle = P.COUNTER_LT;
  ctx.fillRect(ax - 8, ay + 32, 36, 2);
  // Table legs
  ctx.fillStyle = P.COUNTER;
  ctx.fillRect(ax - 5, ay + 38, 4, 12);
  ctx.fillRect(ax + 21, ay + 38, 4, 12);

  // Mini cauldron on table
  ctx.fillStyle = P.STONE_DK;
  ctx.beginPath();
  ctx.moveTo(ax + 2, ay + 22);
  ctx.lineTo(ax + 18, ay + 22);
  ctx.quadraticCurveTo(ax + 22, ay + 28, ax + 17, ay + 32);
  ctx.lineTo(ax + 3, ay + 32);
  ctx.quadraticCurveTo(ax - 2, ay + 28, ax + 2, ay + 22);
  ctx.fill();

  // Brewing animation (bubbling if active)
  if (assistantTarget && assistantServesLeft > 0) {
    const brewProg = 1 - (assistantBrewTimer / 6);
    // Mini liquid
    ctx.fillStyle = assistantTarget.ailment.color; ctx.globalAlpha = 0.6;
    ctx.fillRect(ax + 4, ay + 25, 12, 5);
    ctx.globalAlpha = 1;
    // Mini bubbles
    for (let i = 0; i < 3; i++) {
      const bx = ax + 6 + i * 4 + Math.sin(t * 5 + i) * 2;
      const by = ay + 22 - Math.abs(Math.sin(t * 4 + i * 2)) * 4;
      ctx.fillStyle = P.BUBBLE; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.arc(bx, by, 1.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Progress bar under table
    ctx.fillStyle = '#333';
    ctx.fillRect(ax - 4, ay + 52, 28, 3);
    ctx.fillStyle = P.POTION_GLO;
    ctx.fillRect(ax - 4, ay + 52, 28 * Math.min(1, brewProg), 3);
  }

  // Assistant body
  ctx.fillStyle = '#665588'; // purple robe
  ctx.fillRect(ax - 14, ay + 8 + bob, 14, 22);
  // Head
  ctx.fillStyle = P.SKIN2;
  ctx.beginPath(); ctx.arc(ax - 7, ay + 4 + bob, 7, 0, Math.PI*2); ctx.fill();
  // Hat (pointy wizard)
  ctx.fillStyle = '#554488';
  ctx.beginPath();
  ctx.moveTo(ax - 14, ay + bob - 2);
  ctx.lineTo(ax - 7, ay - 14 + bob);
  ctx.lineTo(ax, ay + bob - 2);
  ctx.closePath(); ctx.fill();
  // Hat brim
  ctx.fillStyle = '#443377';
  ctx.fillRect(ax - 16, ay - 2 + bob, 18, 3);
  // Eyes
  ctx.fillStyle = P.TEXT_DARK;
  ctx.fillRect(ax - 10, ay + 2 + bob, 2, 2);
  ctx.fillRect(ax - 5, ay + 2 + bob, 2, 2);

  // Arms (stirring animation)
  ctx.strokeStyle = P.SKIN2; ctx.lineWidth = 2;
  const armAngle = Math.sin(t * 3) * 0.3;
  ctx.beginPath();
  ctx.moveTo(ax - 7, ay + 14 + bob);
  ctx.lineTo(ax + 5 + Math.cos(armAngle) * 4, ay + 24 + bob);
  ctx.stroke();

  // Level indicator stars
  for (let i = 0; i < assistLvl; i++) {
    ctx.fillStyle = P.SHOP_GOLD; ctx.globalAlpha = 0.7;
    ctx.font = '8px monospace'; ctx.textAlign = 'center';
    ctx.fillText('★', ax - 14 + i * 10, ay + 42);
  }
  ctx.globalAlpha = 1;

  // Target indicator — line to the customer they're serving
  if (assistantTarget && customers.includes(assistantTarget) && !assistantTarget.served && !assistantTarget.leaving) {
    ctx.strokeStyle = P.POTION_GLO; ctx.lineWidth = 1;
    ctx.globalAlpha = 0.4 + Math.sin(t * 4) * 0.2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(ax + 10, ay + 26);
    ctx.lineTo(assistantTarget.x + 15, assistantTarget.y + 20);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    // Small icon above target customer
    ctx.fillStyle = P.POTION_GLO; ctx.font = '10px monospace'; ctx.textAlign = 'center';
    ctx.globalAlpha = 0.6 + Math.sin(t * 3) * 0.3;
    ctx.fillText('@', assistantTarget.x + 15, assistantTarget.y - 35);
    ctx.globalAlpha = 1;
  }
}

function drawHUD() {
  ctx.fillStyle = P.ACCENT; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`Score: ${score}`, 15, 25);
  ctx.fillText(`Gold: ${gold}`, 15, 47);
  ctx.fillStyle = P.WHITE; ctx.font = '13px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`Wave ${wave}`, W/2 - 50, 25);

  // Difficulty badge
  ctx.fillStyle = diffConfig.color; ctx.font = '10px monospace';
  ctx.fillText(diffConfig.label.toUpperCase() + (endlessMode ? ' - ENDLESS' : ''), W/2 - 50, 42);

  // Rush hour indicator
  if (isRushHour) {
    ctx.fillStyle = P.RUSH_RED; ctx.globalAlpha = 0.7 + Math.sin(gameTime*6)*0.3;
    ctx.font = 'bold 11px monospace';
    ctx.fillText('RUSH HOUR! x1.5', W/2 - 50, 55);
    ctx.globalAlpha = 1;
  } else if (waveCustomersLeft > 0) {
    ctx.fillStyle = P.PARCHMENT; ctx.font = '11px monospace';
    ctx.fillText(`${waveCustomersLeft} more coming`, W/2 - 50, 55);
  }

  // Customer queue preview — show next 2-3 incoming as silhouettes at right edge
  if (upcomingCustomers.length > 0 && waveCustomersLeft > 0) {
    const previewCount = Math.min(3, upcomingCustomers.length);
    for (let pi = 0; pi < previewCount; pi++) {
      const px = W - 35 - pi * 28;
      const py = 80;
      // Dark silhouette
      ctx.fillStyle = P.TEXT_DARK; ctx.globalAlpha = 0.3;
      // Body
      ctx.fillRect(px+4, py+12, 16, 22);
      // Head
      ctx.beginPath(); ctx.arc(px+12, py+8, 7, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      // Ailment color dot
      const previewAil = upcomingCustomers[pi];
      if (previewAil) {
        ctx.fillStyle = previewAil.color; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.arc(px+12, py+2, 3, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    // Label
    ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.4;
    ctx.font = '7px monospace'; ctx.textAlign = 'right';
    ctx.fillText('NEXT', W - 8, 75);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }

  // Rush Mode indicator
  if (rushModeActive) {
    ctx.save();
    ctx.fillStyle = '#ff4444'; ctx.globalAlpha = 0.7 + Math.sin(gameTime*6)*0.3;
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('RUSH MODE x2', W/2, 42);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Overflow Vial display
  if (upgradeLevels.overflow_vial && overflowVials.length > 0) {
    ctx.fillStyle = P.PARCHMENT; ctx.font = '7px monospace'; ctx.textAlign = 'right';
    ctx.fillText('VIALS:', W - 10, 55);
    for (let vi = 0; vi < overflowVials.length; vi++) {
      ctx.fillStyle = overflowVials[vi].color;
      ctx.beginPath(); ctx.arc(W - 8 - vi * 14, 62, 4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.5; ctx.stroke();
    }
  }

  // Reputation meter
  const repBarX = 15, repBarY = 58, repBarW = 80, repBarH = 8;
  ctx.fillStyle = '#333'; ctx.fillRect(repBarX, repBarY, repBarW, repBarH);
  const repFill = Math.min(1, (reputation - 0.5) / 2.5);
  const repColor = reputation >= 2.0 ? P.REP_HIGH : reputation >= 1.0 ? P.ACCENT : P.REP_LOW;
  ctx.fillStyle = repColor; ctx.fillRect(repBarX, repBarY, repBarW * repFill, repBarH);
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.strokeRect(repBarX, repBarY, repBarW, repBarH);
  ctx.fillStyle = P.PARCHMENT; ctx.font = '8px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`Rep: ${reputation.toFixed(1)}x`, repBarX, repBarY + repBarH + 9);
  const repTier = reputation >= 2.5 ? 'LEGENDARY' : reputation >= 2.0 ? 'FAMOUS' : reputation >= 1.5 ? 'KNOWN' : '';
  if (repTier) {
    ctx.fillStyle = reputation >= 2.5 ? P.ACHIEVEMENT : reputation >= 2.0 ? P.RARE_GOLD : P.ACCENT;
    ctx.font = 'bold 8px monospace';
    ctx.fillText(repTier, repBarX + 55, repBarY + repBarH + 9);
  }

  // Lives (3 base per wave + any extra hearts from consumable)
  const maxLives = Math.max(lives, LIVES_PER_WAVE);
  for (let i = 0; i < maxLives; i++) {
    const hx = W - 30 - (maxLives - i) * 25;
    if (i < lives) drawHeart(hx, 12, 10, P.HEART);
    else drawHeart(hx, 12, 10, '#444');
  }

  // Wave modifier indicator
  if (currentModifier) {
    ctx.fillStyle = currentModifier.color; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.globalAlpha = 0.8;
