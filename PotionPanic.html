//       victory screen (wave 20), persistent high scores, environment themes per 5 waves
// ============================================================

const ctx = canvas.getContext('2d');

};

// === DIFFICULTY PRESETS ===
const DIFFICULTIES = {
  easy:   { label: 'Easy',   desc: 'Relaxed pace, forgiving patience',       color: P.SUCCESS,   patienceMult: 1.6, spawnMult: 1.5, waveCountMult: 0.7 },
  normal: { label: 'Normal', desc: 'Balanced challenge for most brewers',     color: P.ACCENT,    patienceMult: 1.0, spawnMult: 1.0, waveCountMult: 1.0 },
  hard:   { label: 'Hard',   desc: 'Fast customers, short fuses',            color: P.DANGER,    patienceMult: 0.6, spawnMult: 0.6, waveCountMult: 1.4 },
};
const LIVES_PER_WAVE = 3;
let selectedDifficulty = 'normal';
let diffConfig = DIFFICULTIES.normal;

// === GAME CONFIG ===
const BASE_W = 800;
const BASE_H = 600;
let scale = 1;
let W = BASE_W, H = BASE_H;

function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  scale = Math.min(sw / BASE_W, sh / BASE_H);
  W = BASE_W; H = BASE_H;
  canvas.width = W; canvas.height = H;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

// === AUDIO ENGINE ===
let audioCtx = null;
let masterVol = 0.25;
let sfxOn = true;
let musicOn = true;
let musicGain = null;
let musicPlaying = false;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = musicOn ? 0.04 : 0;
    musicGain.connect(audioCtx.destination);
  }
}

// Background ambient music — a slow, looping chord drone
let ambientNodes = [];
function startMusic() {
  if (!audioCtx || musicPlaying) return;
  musicPlaying = true;
  const chords = [261.6, 329.6, 392.0, 523.3]; // C major spread
  chords.forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = i < 2 ? 'sine' : 'triangle';
    o.frequency.value = freq * (i >= 2 ? 0.5 : 1);
    // Slow LFO for movement
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 0.15 + i * 0.05;
    lfoGain.gain.value = 2 + i;
    lfo.connect(lfoGain);
    lfoGain.connect(o.frequency);
    lfo.start();
    g.gain.value = 0.15 - i * 0.02;
    o.connect(g);
    g.connect(musicGain);
    o.start();
    ambientNodes.push({ o, g, lfo, lfoGain });
  });
}

function stopMusic() {
  ambientNodes.forEach(n => { try { n.o.stop(); n.lfo.stop(); } catch(e){} });
  ambientNodes = [];
  musicPlaying = false;
}

function setMusicVolume(on) {
  musicOn = on;
  if (musicGain) musicGain.gain.value = on ? 0.04 : 0;
}

function playSound(type, param, panX) {
  if (!audioCtx || !sfxOn) return;
  const now = audioCtx.currentTime;
  const master = audioCtx.createGain();
  master.gain.value = masterVol;
  // Spatial audio panning (Task #68)
  if (panX !== undefined && typeof panX === 'number' && audioCtx.createStereoPanner) {
    const panner = audioCtx.createStereoPanner();
    panner.pan.value = Math.max(-1, Math.min(1, (panX / 400) - 1));
    master.connect(panner);
    panner.connect(audioCtx.destination);
  } else {
    master.connect(audioCtx.destination);
  }

  if (type === 'click') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 600 + Math.random()*100;
    g.gain.setValueAtTime(0.3,now); g.gain.linearRampToValueAtTime(0.001,now+0.08);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.08);
  }
  else if (type === 'hover') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 500;
    g.gain.setValueAtTime(0.08,now); g.gain.linearRampToValueAtTime(0.001,now+0.04);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.04);
  }
  else if (type === 'add' || type.startsWith('add_')) {
    // Ingredient splash — two layered tones + noise burst
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    const g2 = audioCtx.createGain();
    const ingPitches = { herb: 380, crystal: 700, flower: 550, mushroom: 260, root: 320, bone: 620, ember: 360 };
    const ingId = type.length > 3 ? type.slice(4) : '';
    const basePitch = ingPitches[ingId] || 350;
    const pitch = basePitch + cauldron.length * 50 + Math.random()*20;
    o1.type = 'sine'; o1.frequency.value = pitch;
    o1.frequency.linearRampToValueAtTime(pitch * 1.8, now+0.12);
    o2.type = 'triangle'; o2.frequency.value = pitch * 1.5;
    o2.frequency.linearRampToValueAtTime(pitch * 0.8, now+0.15);
    g1.gain.setValueAtTime(0.3,now); g1.gain.linearRampToValueAtTime(0.001,now+0.15);
    g2.gain.setValueAtTime(0.15,now); g2.gain.linearRampToValueAtTime(0.001,now+0.12);
    o1.connect(g1); g1.connect(master); o1.start(now); o1.stop(now+0.15);
    o2.connect(g2); g2.connect(master); o2.start(now); o2.stop(now+0.15);
    // Liquid splash noise
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/data.length*5);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const nf = audioCtx.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 2000; nf.Q.value = 1;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.15,now); ng.gain.linearRampToValueAtTime(0.001,now+0.08);
    noise.connect(nf); nf.connect(ng); ng.connect(master); noise.start(now); noise.stop(now+0.08);
  }
  else if (type === 'brew_good') {
    [0,0.08,0.16].forEach((t,i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = [523,659,784][i];
      g.gain.setValueAtTime(0.3,now+t); g.gain.linearRampToValueAtTime(0.001,now+t+0.2);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.2);
    });
  }
  else if (type === 'brew_bad') {
    // Dissonant buzz + descending tone
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const g1 = audioCtx.createGain();
    const g2 = audioCtx.createGain();
    o1.type = 'sawtooth'; o1.frequency.value = 200;
    o1.frequency.linearRampToValueAtTime(90, now+0.35);
    o2.type = 'square'; o2.frequency.value = 205;
    o2.frequency.linearRampToValueAtTime(85, now+0.35);
    g1.gain.setValueAtTime(0.2,now); g1.gain.linearRampToValueAtTime(0.001,now+0.35);
    g2.gain.setValueAtTime(0.08,now); g2.gain.linearRampToValueAtTime(0.001,now+0.3);
    o1.connect(g1); g1.connect(master); o1.start(now); o1.stop(now+0.35);
    o2.connect(g2); g2.connect(master); o2.start(now); o2.stop(now+0.35);
  }
  else if (type === 'serve') {
    // Triumphant arpeggio + shimmer
    const comboPitch = 1 + (param || 0) * 0.08;
    [0,0.06,0.12,0.18].forEach((t,i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = i < 3 ? 'sine' : 'triangle';
      o.frequency.value = [523,659,784,1047][i] * comboPitch;
      g.gain.setValueAtTime(0.25,now+t); g.gain.linearRampToValueAtTime(0.001,now+t+0.2);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.2);
    });
    // Shimmer overlay
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 2093;
    g.gain.setValueAtTime(0.05,now+0.2); g.gain.linearRampToValueAtTime(0.001,now+0.5);
    o.connect(g); g.connect(master); o.start(now+0.2); o.stop(now+0.5);
  }
  else if (type === 'leave') {
    // Sad descending + door thud
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle'; o.frequency.value = 350;
    o.frequency.linearRampToValueAtTime(120, now+0.5);
    g.gain.setValueAtTime(0.2,now); g.gain.linearRampToValueAtTime(0.001,now+0.5);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.5);
    // Thud
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'sine'; o2.frequency.value = 60;
    g2.gain.setValueAtTime(0.3,now+0.15); g2.gain.linearRampToValueAtTime(0.001,now+0.25);
    o2.connect(g2); g2.connect(master); o2.start(now+0.15); o2.stop(now+0.25);
  }
  else if (type === 'doorbell') {
    // Customer arrives — two-tone chime
    [0, 0.12].forEach((t,i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = [880, 1100][i];
      g.gain.setValueAtTime(0.12,now+t); g.gain.linearRampToValueAtTime(0.001,now+t+0.3);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.3);
    });
  }
  else if (type === 'warning') {
    // Low patience tick
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 440;
    g.gain.setValueAtTime(0.08,now); g.gain.linearRampToValueAtTime(0.001,now+0.05);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.05);
  }
  else if (type === 'wave') {
    [0,0.1,0.2,0.3,0.4].forEach((t,i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = [392,494,587,659,784][i];
      g.gain.setValueAtTime(0.2,now+t); g.gain.linearRampToValueAtTime(0.001,now+t+0.25);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.25);
    });
  }
  else if (type === 'gameover') {
    [0,0.2,0.4,0.6].forEach((t,i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = [392,350,330,262][i];
      g.gain.setValueAtTime(0.2,now+t); g.gain.linearRampToValueAtTime(0.001,now+t+0.35);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.35);
    });
  }
  else if (type === 'coin') {
    const o = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const g2 = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 1200 + Math.random()*200;
    o2.type = 'sine'; o2.frequency.value = 1500 + Math.random()*200;
    g.gain.setValueAtTime(0.12,now); g.gain.linearRampToValueAtTime(0.001,now+0.15);
    g2.gain.setValueAtTime(0.08,now+0.05); g2.gain.linearRampToValueAtTime(0.001,now+0.12);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.15);
    o2.connect(g2); g2.connect(master); o2.start(now+0.05); o2.stop(now+0.12);
  }
  else if (type === 'pause') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 660;
    o.frequency.linearRampToValueAtTime(440, now+0.15);
    g.gain.setValueAtTime(0.15,now); g.gain.linearRampToValueAtTime(0.001,now+0.15);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.15);
  }
  else if (type === 'unpause') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 440;
    o.frequency.linearRampToValueAtTime(660, now+0.15);
    g.gain.setValueAtTime(0.15,now); g.gain.linearRampToValueAtTime(0.001,now+0.15);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.15);
  }
  else if (type === 'shop_buy') {
    // Ka-ching! purchase sound
    [0,0.06,0.12].forEach((t,i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = [800,1200,1600][i];
      g.gain.setValueAtTime(0.2,now+t); g.gain.linearRampToValueAtTime(0.001,now+t+0.15);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.15);
    });
  }
  else if (type === 'shop_deny') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 200;
    g.gain.setValueAtTime(0.1,now); g.gain.linearRampToValueAtTime(0.001,now+0.15);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.15);
  }
  else if (type === 'shop_open') {
    // Warm chime ascending
    [0,0.08,0.16,0.24].forEach((t,i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = [330,440,550,660][i];
      g.gain.setValueAtTime(0.15,now+t); g.gain.linearRampToValueAtTime(0.001,now+t+0.25);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.25);
    });
  }
  else if (type === 'explosion') {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 120;
    g.gain.setValueAtTime(0.35,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.4);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.4);
    const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    o2.type = 'square'; o2.frequency.value = 60;
    g2.gain.setValueAtTime(0.25,now); g2.gain.exponentialRampToValueAtTime(0.001,now+0.5);
    o2.connect(g2); g2.connect(master); o2.start(now); o2.stop(now+0.5);
  }
  else if (type === 'rare_ding') {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880,now);
    o.frequency.setValueAtTime(1100,now+0.1);
    g.gain.setValueAtTime(0.15,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.4);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.4);
  }
  else if (type === 'undo') {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(500,now);
    o.frequency.linearRampToValueAtTime(350,now+0.1);
    g.gain.setValueAtTime(0.12,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.15);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.15);
  }
  else if (type === 'rush') {
    [0,0.08,0.16].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'square'; o.frequency.value = [200,400,600][i];
      g.gain.setValueAtTime(0.15,now+t); g.gain.exponentialRampToValueAtTime(0.001,now+t+0.15);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.15);
    });
  }
  else if (type === 'transition') {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = 300;
    o.frequency.linearRampToValueAtTime(600, now+0.3);
    g.gain.setValueAtTime(0.08,now); g.gain.linearRampToValueAtTime(0.001,now+0.3);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.3);
  }
  else if (type === 'boss_appear') {
    // Deep rumble + horn
    [0,0.1,0.2].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = i===2?'sawtooth':'square'; o.frequency.value = [60,80,120][i];
      g.gain.setValueAtTime(0.2,now+t); g.gain.exponentialRampToValueAtTime(0.001,now+t+0.4);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.4);
    });
  }
  else if (type === 'boss_hit') {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 150;
    o.frequency.linearRampToValueAtTime(80, now+0.2);
    g.gain.setValueAtTime(0.2,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.3);
  }
  else if (type === 'boss_defeat') {
    [0,0.1,0.2,0.3,0.4].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = [200,300,400,500,800][i];
      g.gain.setValueAtTime(0.15,now+t); g.gain.exponentialRampToValueAtTime(0.001,now+t+0.3);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.3);
    });
  }
  else if (type === 'boss_scorch') {
    const o = audioCtx.createOscillator(); const n = audioCtx.createOscillator();
    const g = audioCtx.createGain(); const g2 = audioCtx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 100; o.frequency.linearRampToValueAtTime(300,now+0.3);
    g.gain.setValueAtTime(0.18,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.5);
    n.type = 'square'; n.frequency.value = 40;
    g2.gain.setValueAtTime(0.1,now); g2.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    o.connect(g); g.connect(master); n.connect(g2); g2.connect(master);
    o.start(now); o.stop(now+0.5); n.start(now); n.stop(now+0.3);
  }
  else if (type === 'victory') {
    [0,0.12,0.24,0.36,0.48,0.6].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = [262,330,392,523,659,784][i];
      g.gain.setValueAtTime(0.15,now+t); g.gain.exponentialRampToValueAtTime(0.001,now+t+0.5);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.5);
    });
  }
  else if (type === 'tip') {
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(600,now); o.frequency.setValueAtTime(900,now+0.08);
    g.gain.setValueAtTime(0.1,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.2);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.2);
  }
  else if (type === 'almost') {
    // Close but not quite — descending two-note
    [0, 0.12].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = [500, 380][i];
      g.gain.setValueAtTime(0.2,now+t); g.gain.linearRampToValueAtTime(0.001,now+t+0.2);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.2);
    });
  }
  else if (type === 'vip_fanfare') {
    // Ascending arpeggio C-E-G-C (523-659-784-1047)
    [0, 0.08, 0.16, 0.24].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = i < 3 ? 'triangle' : 'sine';
      o.frequency.value = [523, 659, 784, 1047][i];
      g.gain.setValueAtTime(0.25, now+t); g.gain.linearRampToValueAtTime(0.001, now+t+0.3);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.3);
    });
    // Shimmer overlay for VIP
    const sh = audioCtx.createOscillator(); const sg = audioCtx.createGain();
    sh.type = 'sine'; sh.frequency.value = 2093;
    sg.gain.setValueAtTime(0.06, now+0.3); sg.gain.linearRampToValueAtTime(0.001, now+0.7);
    sh.connect(sg); sg.connect(master); sh.start(now+0.3); sh.stop(now+0.7);
  }
  else if (type === 'merchant_arrive') {
    // Wind chime — high sine arpeggio descending
    [0, 0.1, 0.2, 0.3].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = [1200, 1000, 800, 1400][i];
      g.gain.setValueAtTime(0.12, now+t); g.gain.linearRampToValueAtTime(0.001, now+t+0.4);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.4);
    });
  }
  else if (type === 'merchant_choose') {
    // Sparkle confirmation
    [0, 0.06, 0.12].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = [800, 1000, 1200][i];
      g.gain.setValueAtTime(0.15, now+t); g.gain.linearRampToValueAtTime(0.001, now+t+0.25);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.25);
    });
  }
  else if (type === 'mutation') {
    // Eerie wobble
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 200;
    o.frequency.linearRampToValueAtTime(400, now+0.15);
    o.frequency.linearRampToValueAtTime(150, now+0.3);
    g.gain.setValueAtTime(0.15, now); g.gain.linearRampToValueAtTime(0.001, now+0.4);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.4);
  }
  else if (type === 'linked_spawn') {
    // Chain clink — two metallic hits
    [0, 0.08].forEach((t,i) => {
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type = 'triangle'; o.frequency.value = [900, 1100][i];
      g.gain.setValueAtTime(0.12, now+t); g.gain.linearRampToValueAtTime(0.001, now+t+0.15);
      o.connect(g); g.connect(master); o.start(now+t); o.stop(now+t+0.15);
    });
  }
  else if (type === 'bad_bet') {
    // Punishing low rumble + high screech
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = 'sawtooth'; o.frequency.value = 80;
    g.gain.setValueAtTime(0.2, now); g.gain.linearRampToValueAtTime(0.001, now+0.4);
    o.connect(g); g.connect(master); o.start(now); o.stop(now+0.4);
    const o2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    o2.type = 'square'; o2.frequency.value = 300;
    o2.frequency.linearRampToValueAtTime(100, now+0.3);
    g2.gain.setValueAtTime(0.1, now); g2.gain.linearRampToValueAtTime(0.001, now+0.3);
    o2.connect(g2); g2.connect(master); o2.start(now); o2.stop(now+0.3);
  }
}

let ambientSource = null;
let ambientGain = null;
function updateAmbientSound() {
  if (!audioCtx || !sfxOn) return;
  const env = getEnvTheme();
  if (ambientSource) { try { ambientSource.stop(); } catch(e){} }
  const dur = 2;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  const envFreqs = {
    'Forest Hut': { base: 200, high: 3000, vol: 0.02 },
    'Mountain Pass': { base: 80, high: 800, vol: 0.03 },
    'Dark Cavern': { base: 60, high: 400, vol: 0.02 },
    "Dragon's Lair": { base: 100, high: 2000, vol: 0.025 },
  };
  const cfg = envFreqs[env.name] || envFreqs['Forest Hut'];
  for (let i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * 0.5;
  }
  ambientSource = audioCtx.createBufferSource();
  ambientSource.buffer = buf; ambientSource.loop = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass'; filter.frequency.value = cfg.base; filter.Q.value = 0.5;
  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = cfg.vol * masterVol;
  ambientSource.connect(filter); filter.connect(ambientGain); ambientGain.connect(audioCtx.destination);
  ambientSource.start();
}

// === ADAPTIVE MUSIC LAYERS (Task #67) ===
function startMusicLayer(layerName) {
  if (!audioCtx || !musicOn) return;
  if (musicLayers[layerName] && musicLayers[layerName].active) return;
  const now = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.001, now);
  g.gain.linearRampToValueAtTime(0.03, now + 0.5);
  g.connect(audioCtx.destination);
  let nodes = [];

  if (layerName === 'tension') {
    // Pulsing low bass note
    const o = audioCtx.createOscillator();
    o.type = 'sine'; o.frequency.value = 55;
    const lfo = audioCtx.createOscillator();
    const lfoGain = audioCtx.createGain();
    lfo.frequency.value = 2; lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain); lfoGain.connect(g.gain);
    o.connect(g); lfo.start(); o.start();
    nodes = [o, lfo];
  } else if (layerName === 'rush') {
    // Fast rhythmic noise bursts (hi-hat style)
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    const rate = audioCtx.sampleRate;
    for (let i = 0; i < data.length; i++) {
      const beatPos = (i % Math.floor(rate * 0.15)); // 150ms cycle
      data[i] = beatPos < rate * 0.02 ? (Math.random() * 2 - 1) * 0.6 : 0;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = 6000;
    src.connect(filt); filt.connect(g); src.start();
    nodes = [src];
  } else if (layerName === 'boss') {
    // Dramatic low strings (sawtooth)
    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    o1.type = 'sawtooth'; o1.frequency.value = 65;
    o2.type = 'sawtooth'; o2.frequency.value = 98;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 300;
    o1.connect(filt); o2.connect(filt); filt.connect(g);
    o1.start(); o2.start();
    nodes = [o1, o2];
  }
  musicLayers[layerName] = { nodes, gain: g, active: true };
}

function stopMusicLayer(layerName) {
  const layer = musicLayers[layerName];
  if (!layer || !layer.active) return;
  if (audioCtx) {
    const now = audioCtx.currentTime;
    layer.gain.gain.linearRampToValueAtTime(0.001, now + 0.5);
    setTimeout(() => {
      layer.nodes.forEach(n => { try { n.stop(); } catch(e){} });
      try { layer.gain.disconnect(); } catch(e){}
    }, 600);
  }
  musicLayers[layerName] = null;
}

function stopMusicLayers() {
  ['tension', 'rush', 'boss'].forEach(l => stopMusicLayer(l));
}

function updateMusicLayers() {
  if (!audioCtx || !musicOn || state !== 'playing') {
    stopMusicLayers();
    return;
  }
  // Tension: any customer patience < 30%
  const hasTension = customers.some(c => c.arrived && !c.served && !c.leaving && (c.patience / c.maxPatience) < 0.3);
  if (hasTension) startMusicLayer('tension'); else stopMusicLayer('tension');

  // Rush: 3+ customers waiting
  const waitingCount = customers.filter(c => c.arrived && !c.served && !c.leaving).length;
  if (waitingCount >= 3) startMusicLayer('rush'); else stopMusicLayer('rush');

  // Boss: during boss fights
  if (bossActive && boss && !boss.defeated) startMusicLayer('boss'); else stopMusicLayer('boss');
}

function getAtmosphere(w) {
  if (w <= 3) {
    // Warm evening
    return { skyTop: '#0b1a2e', skyBot: '#1a3050', cloudColor: '#223355', starBri: 0.7, lanternMult: 1.0, dustCount: 20, tint: 'rgba(255,180,100,0.02)', label: 'Evening' };
  } else if (w <= 6) {
    // Deep night
    const t = (w - 3) / 3;
    return { skyTop: lerpColor('#0b1a2e','#050a18',t), skyBot: lerpColor('#1a3050','#0a1828',t), cloudColor: '#1a2844', starBri: 1.0, lanternMult: 1.4, dustCount: 15, tint: 'rgba(100,140,200,0.02)', label: 'Night' };
  } else {
    // Stormy
    const t = Math.min(1, (w - 6) / 4);
    return { skyTop: lerpColor('#050a18', P.STORM_TOP, t), skyBot: lerpColor('#0a1828', P.STORM_BOT, t), cloudColor: P.STORM_CLOUD, starBri: 0.3, lanternMult: 1.8, dustCount: 10, tint: 'rgba(80,60,120,0.03)', label: 'Storm' };
  }
}
function lerpColor(a, b, t) {
  const ra = parseInt(a.slice(1,3),16), ga = parseInt(a.slice(3,5),16), ba = parseInt(a.slice(5,7),16);
  const rb = parseInt(b.slice(1,3),16), gb = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
  const r = Math.round(ra + (rb-ra)*t), g = Math.round(ga + (gb-ga)*t), bl = Math.round(ba + (bb-ba)*t);
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${bl.toString(16).padStart(2,'0')}`;
}

// === CUSTOMER CREATION ===
function createCustomer() {
  const available = getAvailableAilments();
  let ailment;
  // Group Order modifier: 2-3 customers share the same ailment
  if (currentModifier && currentModifier.id === 'group_order' && customers.length > 0 && Math.random() < 0.6) {
    ailment = customers[0].ailment;
  } else if (upcomingCustomers.length > 0) {
    ailment = upcomingCustomers.shift(); // use pre-generated ailment for preview consistency
  } else {
    ailment = available[Math.floor(Math.random() * available.length)];
  }
  const look = CUSTOMER_LOOKS[Math.floor(Math.random() * CUSTOMER_LOOKS.length)];
  const usedSlots = customers.map(c => c.slot);
  let slot = -1;
  for (let i = 0; i < MAX_CUSTOMERS; i++) {
    if (!usedSlots.includes(i)) { slot = i; break; }
  }
  if (slot === -1) return null;

  const basePat = Math.max(6, (14 - wave * 0.8) * 1.5); // 1.5x patience for delivery walk time
  const modPatienceMult = currentModifier && currentModifier.patienceMult ? currentModifier.patienceMult : 1.0;
  const repBonus = reputation >= 2.5 ? 1.15 : reputation >= 2.0 ? 1.1 : reputation >= 1.5 ? 1.05 : 1.0;
  let patience = (basePat + Math.random() * 3) * diffConfig.patienceMult * modPatienceMult * repBonus;

  // Rare customer (VIP) chance
  const rareChance = Math.min(0.15, 0.05 + wave * 0.005);
  const repRareBoost = reputation >= 2.0 ? 0.05 : 0;
  const isRare = Math.random() < (rareChance + repRareBoost) && (ailment.tier || 1) >= 2;
  const baseGold = ailment.recipe.length * 5 + wave;

  // Personality types — Tip Jar increases generous chance
  const tipJarBonus = (upgradeLevels.tip_jar || 0) * 0.10;
  let personality = null;
  if (Math.random() < 0.08 + tipJarBonus) personality = 'generous';
  else if (Math.random() < 0.08) personality = 'panicky';
  else if (Math.random() < 0.08) personality = 'contagious';

  // Customer priority system
  let priority = 'normal';
  const priRoll = Math.random();
  if (personality === 'generous') priority = 'generous';
  else if (priRoll < 0.15) { priority = 'desperate'; patience *= 0.6; }
  else if (priRoll < 0.25) { priority = 'stingy'; patience *= 1.5; }

  let goldReward = isRare ? baseGold * 2 : baseGold;
  if (personality === 'generous') goldReward *= 2;
  if (personality === 'panicky') patience *= 0.7;
  if (isRare) patience *= 1.3;

  // Behavior variety (Feature 2)
  let behavior = 'normal';
  const behRoll = Math.random();
  if (behRoll < 0.20) behavior = 'pacer';
  else if (behRoll < 0.35) behavior = 'sitter';
  else if (behRoll < 0.50) behavior = 'arguer';
  // Sitter drains patience 20% slower (applied as multiplier in update)

  return {
    ailment, look, slot,
    x: -40,
    targetX: CUSTOMER_SLOTS[slot].x,
    y: CUSTOMER_SLOTS[slot].y,
    patience: patience,
    maxPatience: patience,
    arrived: false,
    leaving: false,
    served: false,
    serveAnim: 0,
    angryAnim: 0,
    bobTimer: Math.random() * Math.PI * 2,
    goldReward: goldReward,
    warningPlayed: false,
    rare: isRare,
    priority: priority,
    personality: personality,
    reserved: false,
    behavior: behavior,
    arguerSwapTimer: 4 + Math.random() * 2,
    arguerLerpT: 0, // 0 = not swapping, >0 = in swap animation
    linkedTo: null,
    linkedServeTimer: -1, // -1 = inactive, >=0 = counting down
    mutationPending: false,
    mutationWarnTimer: 0,
  };
}

  assistantTarget = null;
  assistantBrewTimer = 0;

  servedAilments = {};
  patienceFreezeTimer = 0;
  undoStack = [];
  magnetTimer = 0; magnetTarget = null;
  recycledIngredient = null; recycledTimer = 0;
  runStats.waveLivesLost = 0;

  // Merchant resets (Feature 1)
  merchant = null;
  merchantExtraSlotActive = false;
  merchantGoldMult = 1;
  merchantGoldUses = 0;
  merchantSpeedBoost = 1;
  merchantSpeedTimer = 0;
  comboShieldTimer = 0;
  if (merchantCooldown > 0) merchantCooldown--;
  doubleDown = false;
  mutationPending = null;
  linkedPairs = [];

  // Rush hour: every 3rd wave from wave 3+
  isRushHour = n >= 3 && n % 3 === 0;
  rushHourBonusMult = isRushHour ? 1.5 : 1.0;
  maxCauldronSlots = 4 + (upgradeLevels.big_cauldron || 0);
  brewCooldownTimer = 0;

  // Boss waves — in endless mode, bosses repeat every 5 waves with scaled HP
  boss = null; bossActive = false;
  const isBossWave = BOSS_WAVES.includes(n) || (endlessMode && n > 20 && n % 5 === 0);

  // Wave modifier (random, starting wave 3, frequency ramps with wave number)
  const modChance = Math.min(0.6, 0.2 + (n - 3) * 0.04); // 20% at wave 3, ~60% cap at wave 13+
  if (n >= 3 && !isBossWave && Math.random() < modChance) {
    currentModifier = WAVE_MODIFIERS[Math.floor(Math.random() * WAVE_MODIFIERS.length)];
  } else {
    currentModifier = null;
  }
  if (isBossWave) {
    bossActive = true;
    // Boss spawns after a short delay, handled in updateGame
  }

  const rushMult = isRushHour ? 1.4 : 1.0;
  const modSpawnMult = currentModifier && currentModifier.spawnMult ? currentModifier.spawnMult : 1.0;
  const count = Math.min(Math.floor((3 + Math.floor(n * 1.5)) * diffConfig.waveCountMult * rushMult), 30);
  waveCustomersLeft = isBossWave ? Math.max(2, Math.floor(count * 0.5)) : count; // fewer regular customers on boss waves
  spawnTimer = isRushHour ? 1.0 : 1.5;
  waveIntroTimer = 2.0;

  // Pre-generate upcoming customer ailments for queue preview
  upcomingCustomers = [];
  const previewAilments = getAvailableAilments();
  for (let i = 0; i < waveCustomersLeft; i++) {
    upcomingCustomers.push(previewAilments[Math.floor(Math.random() * previewAilments.length)]);
  }
  state = 'waveIntro';

  const newRecipe = AILMENTS.find(a => a.wave === n);
  if (newRecipe) {
    newRecipeShown = newRecipe;
    waveIntroTimer = 3.5;
  } else {
    newRecipeShown = null;
  }

  // Micro-event: 20% chance per non-boss wave (Task #56)
  microEvent = null;
  if (!isBossWave && Math.random() < 0.20) {
    const eventTypes = ['merchant', 'inspector', 'ingredient_bonus'];
    const type = eventTypes[Math.floor(Math.random() * eventTypes.length)];
    if (type === 'merchant') {
      microEvent = { type: 'merchant', timer: 8, data: { triggered: false, delay: 3 + Math.random() * 5 } };
    } else if (type === 'inspector') {
      microEvent = { type: 'inspector', timer: 10, data: { triggered: false, delay: 2 + Math.random() * 4 } };
    } else {
      const availIng = getAvailableIngredients();
      const enchantedIng = availIng[Math.floor(Math.random() * availIng.length)];
      microEvent = { type: 'ingredient_bonus', timer: 15, data: { triggered: false, delay: 2 + Math.random() * 3, ingredientId: enchantedIng.id, ingredientName: enchantedIng.name } };
    }
  }

  if (isRushHour) playSound('rush');
  playSound('wave');
  runStats.maxWave = Math.max(runStats.maxWave, n);
  updateAmbientSound();
}

// === BOSS CREATION ===
function createBoss(waveNum) {
  // In endless mode, cycle through boss types with scaling HP
  let def = BOSS_DEFS[waveNum];
  if (!def && endlessMode && waveNum > 20) {
    const bossKeys = [5, 10, 15, 20];
    const bossIdx = ((waveNum / 5 - 1) % 4);
    const baseDef = BOSS_DEFS[bossKeys[Math.floor(bossIdx)]];
    const hpScale = 1 + Math.floor((waveNum - 20) / 20); // +1 HP per full cycle
    def = { ...baseDef, hp: baseDef.hp + hpScale };
  }
  if (!def) return null;

  // Pick ailment based on tier requirement
  const available = getAvailableAilments().filter(a => (a.tier || 1) >= def.tierReq);
  const ailment = available[Math.floor(Math.random() * available.length)] || getAvailableAilments()[0];

  // For Shapeshifter, pick 3 different ailments
  let shiftAilments = null;
  if (def.shifting) {
    const pool = getAvailableAilments().filter(a => (a.tier||1) >= 1);
    shiftAilments = [];
    while (shiftAilments.length < 3 && pool.length > 0) {
      const idx = Math.floor(Math.random() * pool.length);
      shiftAilments.push(pool.splice(idx, 1)[0]);
    }
  }

  // Dragon phases: tier 2, 3, 4
  let dragonPhaseAilments = null;
  if (def.dragon) {
    const t2 = getAvailableAilments().filter(a => a.tier === 2);
    const t3 = getAvailableAilments().filter(a => a.tier === 3);
    const t4 = getAvailableAilments().filter(a => a.tier === 4);
    dragonPhaseAilments = [
      t2[Math.floor(Math.random()*t2.length)] || ailment,
      t3.length > 0 ? t3[Math.floor(Math.random()*t3.length)] : ailment,
      t4.length > 0 ? t4[Math.floor(Math.random()*t4.length)] : ailment,
    ];
  }

  boss = {
    def,
    hp: def.hp,
    maxHp: def.hp,
    phase: 0,
    shiftTimer: 0,
    scorchTimer: 0,
    scorchActive: false,
    ailment: def.dragon ? dragonPhaseAilments[0] : (def.shifting ? shiftAilments[0] : ailment),
    shiftAilments,
    dragonPhaseAilments,
    defeated: false,
    customer: {
      ailment: def.dragon ? dragonPhaseAilments[0] : (def.shifting ? shiftAilments[0] : ailment),
      look: { cloth: def.color, skin: '#cc9966', hair: '#222' },
      slot: 2, // center-ish slot
      x: -60,
      targetX: CUSTOMER_SLOTS[2].x,
      y: CUSTOMER_SLOTS[2].y - 10, // slightly elevated
      patience: (25 + waveNum * 1.5) * diffConfig.patienceMult,
      maxPatience: (25 + waveNum * 1.5) * diffConfig.patienceMult,
      arrived: false,
      leaving: false,
      served: false,
      serveAnim: 0,
      angryAnim: 0,
      bobTimer: 0,
      goldReward: waveNum * 10,
      warningPlayed: false,
      rare: false,
      isBoss: true,
      reserved: false,
    },
    appearTimer: 3.0, // delay before boss appears
  };
  return boss;
}

function spawnCustomer() {
  if (waveCustomersLeft <= 0) return;
  if (customers.length >= MAX_CUSTOMERS) return;

  // Linked customers (Feature 3B) — wave 4+, 15% chance, need 2 open slots
  if (wave >= 4 && Math.random() < 0.15 && customers.length <= MAX_CUSTOMERS - 2 && waveCustomersLeft >= 2) {
    const c1 = createCustomer();
    if (c1) {
      customers.push(c1);
      waveCustomersLeft--;
      const c2 = createCustomer();
      if (c2) {
        customers.push(c2);
        waveCustomersLeft--;
        c1.linkedTo = c2;
        c2.linkedTo = c1;
        linkedPairs.push({ c1, c2, serveTimer: -1, served1: false, served2: false });
        playSound('linked_spawn');
        floatTexts.push({ x: (c1.targetX + c2.targetX) / 2 + 15, y: COUNTER_Y - 120, text: 'LINKED!', life: 2.0, color: P.SHOP_GOLD });
      }
    }
    return;
  }

  const c = createCustomer();
  if (c) {
    customers.push(c);
    waveCustomersLeft--;
    playSound('doorbell', null, c.targetX);
  }
}

// === DELIVERY SERVE LOGIC ===
// Extracted serve logic — called when a brewer arrives at the customer
// brewData: { match, reward, cauldronSnapshot, isAssistant }
function executeServe(customer, brewData) {
  const match = brewData.match;

  customer.served = true;
  customer.serveAnim = 1;
  const reward = customer.goldReward;

  servedAilments[customer.ailment.id] = (servedAilments[customer.ailment.id] || 0) + 1;

  const speedBonus = customer.patience / customer.maxPatience;
  reputation = Math.min(3.0, reputation + 0.05 + speedBonus * 0.1);
  if (customer.personality === 'panicky') reputation = Math.min(3.0, reputation + 0.15);
  runStats.maxRep = Math.max(runStats.maxRep, reputation);

  comboCount++;
  runStats.maxCombo = Math.max(runStats.maxCombo, comboCount);
  comboTimer = 3;
  const comboBonus = comboCount > 1 ? comboCount * 5 : 0;
  const modGoldMult = currentModifier && currentModifier.goldMult ? currentModifier.goldMult : 1.0;
  const inspectorMult = (microEvent && microEvent.type === 'inspector' && microEvent.data.triggered && microEvent.timer > 0) ? 1.5 : 1.0;
  const cauldronSnap = brewData.cauldronSnapshot || [];
  const ingredientBonusMult = (microEvent && microEvent.type === 'ingredient_bonus' && microEvent.data.triggered && microEvent.timer > 0 && cauldronSnap.includes(microEvent.data.ingredientId)) ? 1.3 : 1.0;
  const ddMult = (doubleDown && brewData.doubleDownActive) ? 2.0 : 1.0;
  const mGoldMult2 = merchantGoldMult;
  const rushModeMult = rushModeActive ? 2.0 : 1.0;
  const goldMult = reputation * rushHourBonusMult * modGoldMult * inspectorMult * ingredientBonusMult * ddMult * mGoldMult2 * rushModeMult;

  // Splash Cure: filling adjacent customers' patience
  if (upgradeLevels.splash_cure) {
    const splashAmount = 3 * (upgradeLevels.splash_cure);
    const slot = customer.slot;
    for (const c of customers) {
      if (c !== customer && !c.served && !c.leaving && !c.dying && Math.abs(c.slot - slot) <= 1) {
        c.patience = Math.min(c.maxPatience, c.patience + splashAmount);
        floatTexts.push({ x: c.x+15, y: c.y-10, text: '+' + splashAmount + 's', life: 0.8, color: '#44ddff' });
        for (let i = 0; i < 4; i++) {
          particles.push({ x: c.x+15+(Math.random()-0.5)*20, y: c.y+10, vx:(Math.random()-0.5)*2, vy:-Math.random()*2-1, life:0.5, color:'#44ddff', size:2+Math.random()*2 });
        }
      }
    }
  }
  let totalReward = Math.floor((reward + comboBonus) * goldMult);
  // Decrement merchant gold uses
  if (merchantGoldMult > 1 && merchantGoldUses > 0) {
    merchantGoldUses--;
    if (merchantGoldUses <= 0) { merchantGoldMult = 1; }
  }

  const patienceRatio = customer.patience / customer.maxPatience;
  let tipAmount = 0;
  if (patienceRatio >= tipThreshold) {
    tipAmount = Math.floor(totalReward * 0.3);
    totalReward += tipAmount;
  }

  // Ingredient combo bonus: check if current + last brew share a combo pair
  const currentIngredients = brewData.cauldronSnapshot || [];
  let comboHit = null;
  if (lastBrewIngredients.length > 0 && currentIngredients.length > 0) {
    for (const combo of INGREDIENT_COMBOS) {
      const bothInCurrent = combo.pair.every(p => currentIngredients.includes(p));
      const bothInLast = combo.pair.every(p => lastBrewIngredients.includes(p));
      const crossMatch = combo.pair.some(p => currentIngredients.includes(p)) && combo.pair.some(p => lastBrewIngredients.includes(p));
      if (bothInCurrent || bothInLast || crossMatch) {
        comboHit = combo; break;
      }
    }
  }
  if (comboHit) {
    const comboGold = Math.floor(totalReward * comboHit.goldBonus);
    totalReward += comboGold;
    floatTexts.push({ x: customer.x+15, y: customer.y-65, text: `${comboHit.name}! +${Math.round(comboHit.goldBonus*100)}%`, life: 2.0, color: P.POTION_GLO });
    playSound('click');
  }
  lastBrewIngredients = [...currentIngredients];

  // Customer priority gold multiplier
  if (customer.priority === 'desperate') totalReward = Math.floor(totalReward * 2.0);
  else if (customer.priority === 'stingy') totalReward = Math.floor(totalReward * 0.5);

  // Linked customer bonus (Feature 3B)
  if (customer.linkedTo) {
    const pair = linkedPairs.find(lp => lp.c1 === customer || lp.c2 === customer);
    if (pair) {
      const other = pair.c1 === customer ? pair.c2 : pair.c1;
      if (other.served || other.leaving) {
        totalReward = Math.floor(totalReward * 1.5);
        floatTexts.push({ x: customer.x + 15, y: customer.y - 55, text: 'LINK BONUS!', life: 1.5, color: P.SHOP_GOLD });
      }
    }
  }

  score += totalReward;
  gold += totalReward;
  runStats.totalServed++;
  runStats.totalGold += totalReward;
  if (customer.rare) runStats.rareServed++;

  if (upgradeLevels.speed_potion) {
    patienceFreezeTimer = 1.5 + (upgradeLevels.speed_potion) * 0.5;
  }

  for (let i = 0; i < 15; i++) {
    particles.push({
      x: customer.x + 15, y: customer.y - 10,
      vx: (Math.random()-0.5)*4, vy: -Math.random()*5 - 2,
      life: 1, color: customer.rare ? P.RARE_GOLD : P.ACCENT, size: 2 + Math.random()*3,
    });
  }

  if (comboCount > 1) floatTexts.push({ x: customer.x+15, y: customer.y-40, text: `COMBO x${comboCount}!`, life: 1.5, color: P.ACCENT });
  if (customer.rare) floatTexts.push({ x: customer.x+15, y: customer.y-55, text: 'VIP!', life: 1.5, color: P.RARE_GOLD });
  if (tipAmount > 0) {
    floatTexts.push({ x: customer.x+35, y: customer.y-35, text: `TIP +${tipAmount}!`, life: 1.5, color: P.TIP_GOLD });
    for (let i = 0; i < 6; i++) {
      particles.push({ x: customer.x+15+(Math.random()-0.5)*20, y: customer.y-10, vx:(Math.random()-0.5)*3, vy:-Math.random()*4-1, life:1, color:P.TIP_GOLD, size:2+Math.random()*2 });
    }
    setTimeout(() => playSound('tip'), 150);
  }
  floatTexts.push({ x: customer.x+15, y: customer.y-20, text: `+${totalReward}`, life: 1.2, color: P.ACCENT });

  servePulse = { active: true, x: customer.x+15, y: customer.y+20, radius: 5, color: match.color, life: 0.6 };
  if (comboCount >= 3) {
    for (let i = 0; i < comboCount * 2; i++) {
      particles.push({ x: customer.x+15+(Math.random()-0.5)*20, y: customer.y, vx:(Math.random()-0.5)*4, vy:-Math.random()*5-2, life:0.8, color:[P.ACCENT,P.SUCCESS,P.ACHIEVEMENT][Math.floor(Math.random()*3)], size:2+Math.random()*3 });
    }
  }
  playSound('serve', comboCount, customer.x);
  if (customer.rare) setTimeout(() => playSound('rare_ding', null, customer.x), 100);
  setTimeout(() => playSound('coin', null, customer.x), 200);
  brewFlash = 0.3;

  // Cauldron Momentum
  if (!brewData.isAssistant) {
    perfectServeStreak++;
    if (perfectServeStreak >= 3) {
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-60, text: 'MOMENTUM!', life: 1.5, color: P.POTION_GLO });
      brewCooldownTimer = 0;
      perfectServeStreak = 0;
      for (let i = 0; i < 8; i++) {
        particles.push({ x: CAULDRON_X+CAULDRON_W/2+(Math.random()-0.5)*50, y: CAULDRON_Y-10, vx:(Math.random()-0.5)*3, vy:-Math.random()*3-1, life:0.8, color:P.POTION_GLO, size:2+Math.random()*3 });
      }
    }
  }

  // Chain Reactions / Multi-Serve
  const custSlot = customer.slot;
  if (custSlot !== undefined) {
    const adjacentSlotNums = [custSlot - 1, custSlot + 1];
    for (const adjSlot of adjacentSlotNums) {
      const adj = customers.find(c => c.slot === adjSlot && !c.served && !c.leaving && !c.dying && c.arrived && !c.reserved && c.ailment.id === customer.ailment.id);
      if (adj) {
        adj.served = true; adj.serveAnim = 1;
        const chainReward = Math.floor(adj.goldReward * 0.5);
        score += chainReward; gold += chainReward;
        floatTexts.push({ x: adj.x+15, y: adj.y-30, text: 'CHAIN!', life: 1.5, color: P.POTION_GLO });
        floatTexts.push({ x: adj.x+15, y: adj.y-15, text: `+${chainReward}`, life: 1.2, color: P.ACCENT });
        playSound('serve', 0, adj.x);
        for (let i = 0; i < 10; i++) {
          particles.push({ x: adj.x+15+(Math.random()-0.5)*20, y: adj.y-10, vx:(Math.random()-0.5)*4, vy:-Math.random()*4-2, life:1, color:[P.POTION_GLO,P.SUCCESS,P.ACCENT][Math.floor(Math.random()*3)], size:2+Math.random()*3 });
        }
        const chainAdj = adj;
        setTimeout(() => { customers = customers.filter(c2 => c2 !== chainAdj); }, 800);
      }
    }
  }

  // Achievement checks
  unlockAchievement('first_brew');
  if (comboCount >= 5) unlockAchievement('combo_5');
  if (comboCount >= 10) unlockAchievement('combo_10');
  if (tipAmount > 0) { runTipCount++; if (runTipCount >= 10) unlockAchievement('tip_master'); }
  if (currentModifier && currentModifier.brewCooldown) brewCooldownTimer = currentModifier.brewCooldown;

  const brewDelay = 600;
  setTimeout(() => { customers = customers.filter(c => c !== customer); }, brewDelay);
}

// === DELIVERY SYSTEM UPDATE ===
function updateDeliverySystem(dt) {
  // Update player brewer
  updateBrewerAgent(brewer, dt, false);
  // Update assistant brewer
  if ((upgradeLevels.assistant || 0) >= 1 && assistantBrewerChar.deliveriesLeft > 0) {
    updateBrewerAgent(assistantBrewerChar, dt, true);
  }

  // Clean dead/leaving customers from deliveryQueue
  for (let i = deliveryQueue.length - 1; i >= 0; i--) {
    const item = deliveryQueue[i];
    const isInvalid = item.isBoss
      ? (!boss || boss.defeated || item.customer.leaving)
      : (!customers.includes(item.customer) || item.customer.leaving || item.customer.dying);
    if (isInvalid) {
      if (item.customer) item.customer.reserved = false;
      deliveryQueue.splice(i, 1);
    }
  }

  // Process brew queue: match queued brews to newly arrived customers
  for (let i = brewQueue.length - 1; i >= 0; i--) {
    const queued = brewQueue[i];
    const customer = customers.find(c => c.ailment.id === queued.ailmentId && c.arrived && !c.leaving && !c.served && !c.dying && !c.reserved);
    if (customer) {
      customer.reserved = true;
      deliveryQueue.push({
        potionColor: queued.potionColor,
        ailmentId: queued.ailmentId,
        customer: customer,
        isBoss: false,
        matchData: queued.matchData,
      });
      brewQueue.splice(i, 1);
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-40, text: 'QUEUE MATCHED!', life: 1.2, color: P.SUCCESS });
      playSound('click');
    }
  }
}

function updateBrewerAgent(agent, dt, isAssistant) {
  if (agent.state === 'idle') {
    if (deliveryQueue.length > 0 && (!isAssistant || agent.deliveriesLeft > 0)) {
      const item = deliveryQueue.shift();
      // Verify customer is still valid (boss customers are in boss.customer, not in customers array)
      const isBossDelivery = item.isBoss;
      const customerValid = isBossDelivery
        ? (boss && !boss.defeated && boss.customer === item.customer && !item.customer.leaving)
        : (customers.includes(item.customer) && !item.customer.served && !item.customer.leaving && !item.customer.dying);
      if (!item.customer || !customerValid) {
        if (item.customer) item.customer.reserved = false;
        return; // skip, try again next frame
      }
      agent.state = 'walking_to';
      agent.target = item.customer;
      agent.potion = item;
    }
  } else if (agent.state === 'walking_to') {
    // Check if target customer died while walking
    const isBossDel = agent.potion && agent.potion.isBoss;
    const targetGone = isBossDel
      ? (!boss || boss.defeated || agent.target.leaving)
      : (!customers.includes(agent.target) || agent.target.leaving || agent.target.dying);
    if (!agent.target || targetGone) {
      // Customer gone — brewer looks sad, walks back
      if (agent.target) agent.target.reserved = false;
      floatTexts.push({ x: agent.x, y: agent.y - 30, text: 'Wasted!', life: 1.0, color: P.DANGER });
      agent.state = 'sad';
      agent.deliverTimer = 0.5;
      agent.target = null;
      agent.potion = null;
      return;
    }
    const targetX = agent.target.x + 15;
    const dir = targetX > agent.x ? 1 : -1;
    const effectiveSpeed = agent.speed * Math.max(0.4, 1 - (agent.fatigue || 0) * 0.05) * merchantSpeedBoost;
    agent.x += dir * effectiveSpeed * dt;
    agent.walkFrame += dt;
    // Sweat drop particles when fatigued
    if ((agent.fatigue || 0) > 3 && Math.random() < 0.08) {
      particles.push({ x: agent.x + (Math.random()-0.5)*6, y: agent.y - 10, vx: (Math.random()-0.5)*0.5, vy: 1.5, life: 0.5, color: '#88ccff', size: 2 });
    }
    if (Math.abs(agent.x - targetX) < 5) {
      agent.x = targetX;
      // Arrived — execute serve
      const item = agent.potion;
      if (item.isBoss && boss && !boss.defeated) {
        executeBossHit(boss, item.matchData);
      } else {
        executeServe(agent.target, item.matchData);
      }
      if (isAssistant) agent.deliveriesLeft--;
      agent.state = 'delivering';
      agent.deliverTimer = 0.3;
    }
  } else if (agent.state === 'delivering') {
    agent.deliverTimer -= dt;
    if (agent.deliverTimer <= 0) {
      agent.fatigue = (agent.fatigue || 0) + 1; // Brewer exhaustion
      agent.state = 'walking_back';
      agent.target = null;
      agent.potion = null;
    }
  } else if (agent.state === 'walking_back') {
    const dir = agent.homeX > agent.x ? 1 : -1;
    const effectiveSpeedBack = agent.speed * Math.max(0.4, 1 - (agent.fatigue || 0) * 0.05) * merchantSpeedBoost;
    agent.x += dir * effectiveSpeedBack * dt;
    agent.walkFrame += dt;
    if (Math.abs(agent.x - agent.homeX) < 5) {
      agent.x = agent.homeX;
      agent.state = 'idle';
    }
  } else if (agent.state === 'sad') {
    agent.deliverTimer -= dt;
    if (agent.deliverTimer <= 0) {
      agent.state = 'walking_back';
    }
  }
}

// === BREWING ===
function tryCauldronBrew() {
  if (cauldron.length === 0) return;

  // Travelling Merchant: auto-sell whatever is in cauldron for 2x base gold (Task #56)
  if (microEvent && microEvent.type === 'merchant' && microEvent.data.triggered && microEvent.timer > 0) {
    const merchantGold = Math.floor(cauldron.length * 15 * 2);
    score += merchantGold; gold += merchantGold;
    floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-30, text: 'SOLD!', life: 1.5, color: P.SHOP_GOLD });
    floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-50, text: `+${merchantGold}`, life: 1.2, color: P.ACCENT });
    playSound('coin');
    for (let i = 0; i < 12; i++) {
      particles.push({ x: CAULDRON_X+CAULDRON_W/2+(Math.random()-0.5)*40, y: CAULDRON_Y, vx:(Math.random()-0.5)*3, vy:-Math.random()*4-1, life:1, color:P.SHOP_GOLD, size:3+Math.random()*3 });
    }
    cauldron = []; undoStack = [];
    brewFlash = 0.3;
    microEvent = null; // merchant leaves after selling
    return;
  }

  if (cauldronDamaged > 0) {
    floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-20, text: 'Cauldron damaged!', life: 1.5, color: P.DANGER });
    playSound('shop_deny'); return;
  }
  // Potion Fumes modifier: brew cooldown
  if (brewCooldownTimer > 0) {
    floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-20, text: 'Fumes! Wait...', life: 1.0, color: P.MUSH_PURPLE });
    playSound('shop_deny'); return;
  }

  const sorted = [...cauldron].sort();
  let match = null;

  for (const ailment of getAvailableAilments()) {
    if (ailment.ordered && !upgradeLevels.enchanted) {
      if (cauldron.length === ailment.recipe.length && cauldron.every((v,i) => v === ailment.recipe[i])) {
        match = ailment; break;
      }
    } else {
      const recipeSorted = [...ailment.recipe].sort();
      if (sorted.length === recipeSorted.length && sorted.every((v,i) => v === recipeSorted[i])) {
        match = ailment; break;
      }
    }
  }

  if (!match && upgradeLevels.lucky_charm && Math.random() < 0.10) {
    const luckyCustomer = customers.find(c => c.arrived && !c.leaving && !c.served && !c.reserved);
    if (luckyCustomer) match = luckyCustomer.ailment;
  }

  if (match) {
    const ddActive = doubleDown; // capture current doubleDown state
    if (doubleDown) doubleDown = false; // reset after any successful brew attempt
    const customer = customers.find(c => c.ailment.id === match.id && c.arrived && !c.leaving && !c.served && !c.dying && !c.reserved);
    // Check boss first
    if (!customer && boss && !boss.defeated && boss.customer.arrived && !boss.customer.leaving && boss.ailment.id === match.id) {
      // Boss hit — queue for delivery
      boss.customer.reserved = true;
      const cauldronSnap = [...cauldron];
      deliveryQueue.push({
        potionColor: match.color,
        ailmentId: match.id,
        customer: boss.customer,
        isBoss: true,
        matchData: { match, cauldronSnapshot: cauldronSnap, doubleDownActive: ddActive },
      });
      playSound('brew_good');
      // Cauldron brew particles
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: CAULDRON_X + CAULDRON_W/2 + (Math.random()-0.5)*40,
          y: CAULDRON_Y + (Math.random()-0.5)*20,
          vx: (Math.random()-0.5)*3, vy: -Math.random()*4 - 1,
          life: 0.8, color: P.SUCCESS, size: 3 + Math.random()*3,
        });
      }
      lastBrewedRecipe = [...cauldron]; // Potion Memory
      cauldron = []; undoStack = [];
      if (currentModifier && currentModifier.brewCooldown) brewCooldownTimer = currentModifier.brewCooldown;
      brewFlash = 0.3;
      return;
    }

    if (customer) {
      // Queue potion for delivery instead of instant serve
      customer.reserved = true;
      const cauldronSnap = [...cauldron];
      deliveryQueue.push({
        potionColor: match.color,
        ailmentId: match.id,
        customer: customer,
        isBoss: false,
        matchData: { match, cauldronSnapshot: cauldronSnap, isAssistant: false, doubleDownActive: ddActive },
      });
      playSound('brew_good');
      // Cauldron brew particles
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: CAULDRON_X + CAULDRON_W/2 + (Math.random()-0.5)*40,
          y: CAULDRON_Y + (Math.random()-0.5)*20,
          vx: (Math.random()-0.5)*3, vy: -Math.random()*4 - 1,
          life: 0.8, color: P.SUCCESS, size: 3 + Math.random()*3,
        });
      }
      lastBrewedRecipe = [...cauldron]; // Potion Memory
      cauldron = []; undoStack = [];
      if (currentModifier && currentModifier.brewCooldown) brewCooldownTimer = currentModifier.brewCooldown;
      brewFlash = 0.3;

    } else if (brewQueue.length < 2) {
      // No matching customer yet — queue the brew for later
      const cauldronSnap = [...cauldron];
      brewQueue.push({
        potionColor: match.color,
        ailmentId: match.id,
        recipe: [...cauldron],
        matchData: { match, cauldronSnapshot: cauldronSnap, isAssistant: false, doubleDownActive: ddActive },
      });
      playSound('brew_good');
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-30, text: 'QUEUED!', life: 1.5, color: P.POTION_GLO });
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: CAULDRON_X + CAULDRON_W/2 + (Math.random()-0.5)*40,
          y: CAULDRON_Y + (Math.random()-0.5)*20,
          vx: (Math.random()-0.5)*2, vy: -Math.random()*3 - 1,
          life: 0.6, color: P.POTION_GLO, size: 2 + Math.random()*2,
        });
      }
      cauldron = []; undoStack = [];
      if (currentModifier && currentModifier.brewCooldown) brewCooldownTimer = currentModifier.brewCooldown;
      brewFlash = 0.2;

    } else if (upgradeLevels.overflow_vial && overflowVials.length < (upgradeLevels.overflow_vial || 0)) {
      // Overflow Vial: store the potion for later
      overflowVials.push({ ailmentId: match.id, color: match.color, name: match.name });
      playSound('brew_good');
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-30, text: 'STORED!', life: 1.5, color: '#aa88ff' });
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: CAULDRON_X + CAULDRON_W/2 + (Math.random()-0.5)*30, y: CAULDRON_Y,
          vx: (Math.random()-0.5)*2, vy: -Math.random()*3 - 1,
          life: 0.7, color: '#aa88ff', size: 2 + Math.random()*3,
        });
      }
      lastBrewedRecipe = [...cauldron];
      cauldron = []; undoStack = [];
      if (currentModifier && currentModifier.brewCooldown) brewCooldownTimer = currentModifier.brewCooldown;
      brewFlash = 0.2;
    } else {
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-20, text: 'No patient!', life: 1.5, color: P.DANGER });
      playSound('brew_bad'); brewFlash = 0.2; shakeTimer = 0.15; shakeIntensity = 3;
    }
  } else {
    // Double-down penalty: bad brew costs a life (Feature 4)
    if (doubleDown) {
      doubleDown = false;
      lives--;
      shakeTimer = 0.4; shakeIntensity = 8; brewFlash = 0.4;
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-40, text: 'BAD BET!', life: 2.0, color: P.DANGER });
      playSound('bad_bet');
      for (let i = 0; i < 12; i++) {
        particles.push({ x: CAULDRON_X+CAULDRON_W/2+(Math.random()-0.5)*40, y: CAULDRON_Y, vx:(Math.random()-0.5)*4, vy:-Math.random()*4-2, life:1, color:P.DANGER, size:3+Math.random()*3 });
      }
      if (lives <= 0 && !transition.active) {
        if (score > highScores[selectedDifficulty]) { highScores[selectedDifficulty] = score; saveHighScores(); }
        playSound('gameover');
        clearSaveGame(); startTransition(() => { state = 'gameover'; }, 0.5);
        cauldron = []; undoStack = []; return;
      }
    }
    const hasDupes = cauldron.length >= 3 && new Set(cauldron).size < cauldron.length;
    if (hasDupes && Math.random() < 0.4) {
      playSound('explosion');
      runExplosionCount++;
      perfectServeStreak = 0; // Reset momentum on explosion (Task #64)
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-30, text: 'EXPLOSION!', life: 2.0, color: P.EXPLOSIVE });
      shakeTimer = 0.5; shakeIntensity = 12; brewFlash = 0.5;
      cauldronDamaged = 3.0; lives--;
      reputation = Math.max(0.5, reputation - 0.2);
      for (let i = 0; i < 25; i++) {
        particles.push({
          x: CAULDRON_X + CAULDRON_W/2 + (Math.random()-0.5)*30, y: CAULDRON_Y + 10,
          vx: (Math.random()-0.5)*8, vy: -Math.random()*8 - 3,
          life: 1.2, color: [P.FIRE_1, P.FIRE_2, P.EMBER, '#333'][Math.floor(Math.random()*4)], size: 4 + Math.random()*6,
        });
      }
      if (lives <= 0 && !transition.active) {
        if (score > highScores[selectedDifficulty]) { highScores[selectedDifficulty] = score; saveHighScores(); }
        playSound('gameover');
        clearSaveGame(); startTransition(() => { state = 'gameover'; }, 0.5);
        cauldron = []; undoStack = []; return;
      }
    } else if (upgradeLevels.apprentice) {
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-20, text: 'Apprentice saved it!', life: 1.5, color: P.POTION_GLO });
      playSound('click'); brewFlash = 0.1;
    } else {
      // Wild potion: chance to cure a random customer instead of exploding
      const wildChance = 0.15 + (upgradeLevels.chaos_brewer || 0) * 0.10;
      const wildTarget = customers.find(c => c.arrived && !c.served && !c.leaving && !c.dying && !c.reserved);
      if (wildTarget && Math.random() < wildChance) {
        perfectServeStreak = 0; // Wild potions don't count as perfect (Task #64)
        wildTarget.served = true; wildTarget.serveAnim = 1;
        const reward = Math.floor(wildTarget.goldReward * 0.5);
        score += reward; gold += reward;
        floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-30, text: 'WILD POTION!', life: 2, color: '#ff44ff' });
        floatTexts.push({ x: wildTarget.x+15, y: wildTarget.y-20, text: `+${reward}`, life: 1.2, color: '#ff44ff' });
        playSound('brew_good');
        for (let i = 0; i < 15; i++) {
          particles.push({ x: CAULDRON_X+CAULDRON_W/2+(Math.random()-0.5)*40, y: CAULDRON_Y, vx:(Math.random()-0.5)*6, vy:-Math.random()*6-2, life:1, color:['#ff44ff','#ff88ff','#cc44cc','#ffaaff'][Math.floor(Math.random()*4)], size:3+Math.random()*4 });
        }
        cauldron = []; undoStack = [];
        if (currentModifier && currentModifier.brewCooldown) brewCooldownTimer = currentModifier.brewCooldown;
        brewFlash = 0.3;
        setTimeout(() => { customers = customers.filter(c2 => c2 !== wildTarget); }, 600);
        return;
      }
      // Check for "Almost!" — 1 ingredient off from a valid recipe
      let closestMatch = null;
      const sorted = [...cauldron].sort();
      for (const ail of getAvailableAilments()) {
        const rSorted = [...ail.recipe].sort();
        if (Math.abs(sorted.length - rSorted.length) <= 1) {
          let diff = 0;
          const longer = sorted.length >= rSorted.length ? sorted : rSorted;
          const shorter = sorted.length < rSorted.length ? sorted : rSorted;
          const used = new Array(shorter.length).fill(false);
          for (const s of longer) { const idx = shorter.findIndex((v,i) => v === s && !used[i]); if (idx >= 0) used[idx] = true; else diff++; }
          if (diff <= 1) { closestMatch = ail; break; }
        }
      }
      if (closestMatch) {
        floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-20, text: 'Almost!', life: 1.5, color: P.FLOW_YELLOW });
        recipeHighlight = { id: closestMatch.id, timer: 3.0 };
        playSound('almost');
      } else {
        floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-20, text: 'Bad potion!', life: 1.5, color: P.DANGER });
        playSound('brew_bad');
      }
      shakeTimer = 0.2; shakeIntensity = 5; brewFlash = 0.2;
      const inspectorRepPenalty = (microEvent && microEvent.type === 'inspector' && microEvent.data.triggered && microEvent.timer > 0) ? 0.2 : 0.1;
      reputation = Math.max(0.5, reputation - inspectorRepPenalty);
      perfectServeStreak = 0; // Reset momentum on bad brew (Task #64)
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: CAULDRON_X + CAULDRON_W/2 + (Math.random()-0.5)*30, y: CAULDRON_Y,
          vx: (Math.random()-0.5)*2, vy: -Math.random()*3 - 1,
          life: 0.8, color: '#666', size: 4 + Math.random()*4,
        });
      }
      if (comboShieldTimer <= 0) comboCount = 0;
    }
  }
  // Potion Recycler: return 1 ingredient on bad brew (not explosions or wild)
  if (upgradeLevels.potion_recycler && cauldron.length > 0 && !match) {
    const returnCount = Math.min(upgradeLevels.potion_recycler, cauldron.length);
    const returned = cauldron.slice(0, returnCount);
    recycledIngredient = returned[0];
    recycledTimer = 2.0;
    floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y+30, text: 'Recycled ' + returnCount + '!', life: 1.2, color: '#44ff88' });
    // Auto-add recycled ingredient back to cauldron after clearing
    setTimeout(() => {
      if (cauldron.length < maxCauldronSlots) {
        for (const ing of returned) cauldron.push(ing);
      }
    }, 100);
  }
  cauldron = []; undoStack = [];
}

// === TRAVELING MERCHANT EFFECT (Feature 1) ===
function applyMerchantOffer(offer) {
  playSound('merchant_choose');
  floatTexts.push({ x: W/2, y: H/2 - 60, text: offer.name + '!', life: 2.0, color: P.SHOP_GOLD });
  // Sparkle particles
  for (let i = 0; i < 15; i++) {
    particles.push({ x: W/2+(Math.random()-0.5)*100, y: H/2+(Math.random()-0.5)*60, vx:(Math.random()-0.5)*4, vy:-Math.random()*4-1, life:1, color:P.SHOP_GOLD, size:3+Math.random()*3 });
  }
  switch (offer.effect) {
    case 'patience_boost':
      for (const c of customers) {
        if (!c.served && !c.leaving && !c.dying) {
          c.patience += 3;
          c.maxPatience += 3;
        }
      }
      break;
    case 'gold_mult':
      merchantGoldMult = 2;
      merchantGoldUses = offer.uses || 3;
      break;
    case 'speed_boost':
      merchantSpeedBoost = 1.5;
      merchantSpeedTimer = offer.duration || 30;
      break;
    case 'extra_slot':
      maxCauldronSlots++;
      merchantExtraSlotActive = true;
      break;
    case 'heal':
      lives = Math.min(lives + 1, LIVES_PER_WAVE);
      break;
    case 'combo_shield':
      comboShieldTimer = offer.duration || 20;
      break;
  }
}
