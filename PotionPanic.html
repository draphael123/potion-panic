    ctx.fillText(`${currentModifier.icon} ${currentModifier.name}`, W/2 + 60, 25);
    ctx.globalAlpha = 1;
  }

  // Micro-event HUD indicator (Task #56)
  if (microEvent && microEvent.data.triggered && microEvent.timer > 0) {
    const mePulse = 0.7 + Math.sin(gameTime * 5) * 0.3;
    ctx.globalAlpha = mePulse;
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    if (microEvent.type === 'merchant') {
      ctx.fillStyle = P.SHOP_GOLD;
      ctx.fillText(`$ MERCHANT (${microEvent.timer.toFixed(1)}s) $`, W/2, 80);
    } else if (microEvent.type === 'inspector') {
      ctx.fillStyle = P.ACCENT;
      ctx.fillText(`* INSPECTION +50% Gold (${microEvent.timer.toFixed(1)}s) *`, W/2, 80);
    } else if (microEvent.type === 'ingredient_bonus') {
      ctx.fillStyle = P.POTION_GLO;
      ctx.fillText(`~ ${microEvent.data.ingredientName} ENCHANTED +30% (${microEvent.timer.toFixed(1)}s) ~`, W/2, 80);
    }
    ctx.globalAlpha = 1;
  }

  // Momentum streak indicator (Task #64)
  if (perfectServeStreak > 0 && perfectServeStreak < 3) {
    ctx.fillStyle = P.POTION_GLO; ctx.font = '9px monospace'; ctx.textAlign = 'center';
    ctx.globalAlpha = 0.6;
    ctx.fillText(`Momentum: ${perfectServeStreak}/3`, CAULDRON_X + CAULDRON_W/2, CAULDRON_Y + CAULDRON_H + 15);
    ctx.globalAlpha = 1;
  }

  // Brew cooldown indicator
  if (brewCooldownTimer > 0) {
    ctx.fillStyle = P.MUSH_PURPLE; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.globalAlpha = 0.7 + Math.sin(gameTime*8)*0.3;
    ctx.fillText(`Fumes: ${brewCooldownTimer.toFixed(1)}s`, CAULDRON_X + CAULDRON_W/2, CAULDRON_Y - 40);
    ctx.globalAlpha = 1;
  }

  // Patience freeze indicator
  if (patienceFreezeTimer > 0) {
    ctx.fillStyle = P.CRYS_BLUE; ctx.globalAlpha = 0.6 + Math.sin(gameTime * 8) * 0.3;
    ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('* TIME FREEZE *', W/2 - 50, 90);
    ctx.globalAlpha = 1;
  }

  // Assistant serves remaining
  if (assistantServesLeft > 0) {
    ctx.fillStyle = P.POTION_GLO; ctx.font = '10px monospace'; ctx.textAlign = 'right';
    ctx.fillText(`Asst: ${assistantServesLeft}`, W - 15, 55);
  }

  // Combo with escalating visuals
  if (comboCount > 1 && comboTimer > 0) {
    ctx.globalAlpha = Math.min(1, comboTimer);
    const comboShake = comboCount >= 5 ? Math.sin(gameTime * 20) * (comboCount * 0.5) : 0;
    const comboSize = Math.min(36, 18 + comboCount * 2);
    const comboColor = comboCount >= 10 ? P.EXPLOSIVE : comboCount >= 5 ? P.RARE_GOLD : comboCount >= 3 ? P.ACHIEVEMENT : P.ACCENT;
    const comboScale = 1 + Math.sin(gameTime * 6) * 0.05 * comboCount;
    ctx.save();
    ctx.translate(W/2 - 50, 75);
    ctx.scale(comboScale, comboScale);
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.font = `bold ${comboSize}px monospace`; ctx.textAlign = 'center';
    ctx.fillText(`COMBO x${comboCount}!`, 2 + comboShake, 2);
    // Main text
    ctx.fillStyle = comboColor;
    ctx.fillText(`COMBO x${comboCount}!`, comboShake, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Active upgrades display
  const activeUps = UPGRADES.filter(u => upgradeLevels[u.id]);
  if (activeUps.length > 0) {
    ctx.textAlign = 'left'; ctx.font = '10px monospace';
    let ux = 15;
    for (const u of activeUps) {
      const lvl = upgradeLevels[u.id];
      ctx.fillStyle = P.SHOP_GOLD; ctx.globalAlpha = 0.6;
      ctx.fillText(`${u.icon}${'I'.repeat(lvl)}`, ux, 65);
      ux += ctx.measureText(`${u.icon}${'I'.repeat(lvl)}`).width + 8;
    }
    ctx.globalAlpha = 1;
  }

  // Pause hint
  ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.4;
  ctx.font = '10px monospace'; ctx.textAlign = 'right';
  ctx.fillText('[ESC] Pause', W - 15, H - 10);
  ctx.globalAlpha = 1;
}

function drawHeart(x, y, size, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + size/4);
  ctx.quadraticCurveTo(x, y, x + size/4, y);
  ctx.quadraticCurveTo(x + size/2, y, x + size/2, y + size/4);
  ctx.quadraticCurveTo(x + size/2, y, x + size*3/4, y);
  ctx.quadraticCurveTo(x + size, y, x + size, y + size/4);
  ctx.quadraticCurveTo(x + size, y + size/2, x + size/2, y + size*3/4);
  ctx.quadraticCurveTo(x, y + size/2, x, y + size/4);
  ctx.fill();
}

function drawParticles() {
  // Game particles
  for (const p of particles) {
    ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // Ambient sparkles (magical dust)
  for (const s of ambientSparkles) {
    const fadeIn = Math.min(1, (s.maxLife - s.life) * 2);
    const fadeOut = Math.min(1, s.life);
    const alpha = fadeIn * fadeOut * 0.5;
    ctx.fillStyle = s.color; ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
    // Tiny glow halo
    ctx.globalAlpha = alpha * 0.3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size*2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Boss death shockwave ring
  if (bossDeathRing.active) {
    const r = bossDeathRing;
    const alpha = r.life * 0.6;
    ctx.strokeStyle = r.color; ctx.lineWidth = 4 * r.life;
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.stroke();
    // Inner bright ring
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 * r.life;
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.radius * 0.8, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Serve pulse ring
  if (servePulse.active) {
    ctx.strokeStyle = servePulse.color; ctx.lineWidth = 2 * servePulse.life;
    ctx.globalAlpha = servePulse.life * 0.4;
    ctx.beginPath(); ctx.arc(servePulse.x, servePulse.y, servePulse.radius, 0, Math.PI*2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Float texts with shadow
  for (const f of floatTexts) {
    const alpha = Math.max(0, Math.min(1, f.life));
    ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    // Text shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.globalAlpha = alpha;
    ctx.fillText(f.text, f.x+1, f.y+1);
    // Text
    ctx.fillStyle = f.color; ctx.globalAlpha = alpha;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// === TRANSITION EFFECT ===
function drawTransition() {
  if (!transition.active) return;
  const p = transition.progress;
  const cx = W/2, cy = H/2;
  const maxR = Math.sqrt(cx*cx + cy*cy);
  let radius;
  if (transition.phase === 'out') {
    radius = maxR * (1 - p); // shrink to zero
  } else {
    radius = maxR * p; // expand from zero
  }
  // Draw black with circular cutout
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.rect(0,0,W,H);
  ctx.arc(cx, cy, Math.max(0, radius), 0, Math.PI*2, true);
  ctx.fill();
}

// === SHOP SCREEN ===
function getShopLayout() {
  // Compact 3-column layout for 13 upgrades
  const cardW = 245, cardH = 60, gap = 8;
  const cols = 3;
  const totalW = cols * cardW + (cols-1) * gap;
  const startX = (W - totalW) / 2;
  const startY = 108 - shopScrollY;
  const btnW = 220, btnH = 45;
  // Continue button position (fixed at bottom)
  const btnX = W/2 - btnW/2, btnY = H - 60;
  // Max visible area for cards
  const maxCardY = btnY - 18;
  return { cardW, cardH, gap, cols, startX, startY, btnW, btnH, btnX, btnY, maxCardY };
}

function getShopMaxScroll() {
  const lay = getShopLayout();
  const totalRows = Math.ceil(UPGRADES.length / lay.cols);
  const totalHeight = totalRows * (lay.cardH + lay.gap);
  const viewHeight = lay.btnY - 108;
  return Math.max(0, totalHeight - viewHeight);
}

function drawShop() {
  // Dark warm background
  const bgGrd = ctx.createLinearGradient(0,0,0,H);
  bgGrd.addColorStop(0, P.SHOP_BG);
  bgGrd.addColorStop(1, '#0d0806');
  ctx.fillStyle = bgGrd; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = 'rgba(255,200,100,0.03)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = P.SHOP_GOLD; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
  ctx.fillText('UPGRADE SHOP', W/2, 36);
  ctx.fillStyle = P.PARCHMENT; ctx.font = '12px monospace';
  ctx.fillText(`Wave ${wave} Complete!  •  Gold: ${gold}  •  Score: ${score}`, W/2, 58);

  // Hearts remaining
  ctx.fillStyle = P.WHITE; ctx.font = '11px monospace';
  const heartsText = `Hearts: ${lives}/${LIVES_PER_WAVE}`;
  ctx.fillText(heartsText, W/2, 76);

  // Foresight: preview next wave ailments — BUGFIX: show only what's new or notable
  if (upgradeLevels.foresight) {
    const newAilments = AILMENTS.filter(a => a.wave === wave + 1);
    const nextWaveBoss = BOSS_WAVES.includes(wave + 1) ? BOSS_DEFS[wave + 1] : null;
    ctx.fillStyle = P.POTION_GLO; ctx.font = '10px monospace';
    let fText = 'Next: ';
    if (newAilments.length > 0) fText += `NEW: ${newAilments.map(a => a.name).join(', ')}`;
    else fText += 'No new recipes';
    if (nextWaveBoss) fText += ` | BOSS: ${nextWaveBoss.name}`;
    ctx.fillText(fText, W/2, 92);
  }

  const lay = getShopLayout();

  // Clip region for scrollable cards area
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 96, W, lay.btnY - 102);
  ctx.clip();

  UPGRADES.forEach((up, i) => {
    const col = i % lay.cols, row = Math.floor(i / lay.cols);
    const cx = lay.startX + col * (lay.cardW + lay.gap);
    const cy = lay.startY + row * (lay.cardH + lay.gap);

    // Skip if off-screen
    if (cy + lay.cardH < 96 || cy > lay.btnY - 6) return;

    const level = upgradeLevels[up.id] || 0;
    const maxed = level >= up.maxLevel;
    const cost = getUpgradeCost(up);
    const canAfford = gold >= cost && !maxed;
    const isHover = hoverBtn === `shop_${up.id}`;

    // Card background
    const bg = maxed ? '#222218' : (isHover && canAfford ? lighten(P.SHOP_PANEL, 15) : P.SHOP_PANEL);
    const border = maxed ? '#555540' : (canAfford ? P.SHOP_GOLD : '#554433');
    drawRoundRect(cx, cy, lay.cardW, lay.cardH, 6, bg, border);

    // Icon circle
    const iconR = 16;
    ctx.fillStyle = maxed ? '#333' : 'rgba(255,215,0,0.12)';
    ctx.beginPath(); ctx.arc(cx + 22, cy + lay.cardH/2, iconR, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = maxed ? '#666' : P.SHOP_GOLD; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText(up.icon, cx + 22, cy + lay.cardH/2 + 6);

    // Name
    ctx.textAlign = 'left';
    ctx.fillStyle = maxed ? '#888' : P.WHITE; ctx.font = 'bold 11px monospace';
    ctx.fillText(up.name, cx + 44, cy + 18);

    // Desc (truncate if needed)
    ctx.fillStyle = maxed ? '#555' : P.PARCHMENT; ctx.font = '9px monospace';
    let desc = up.desc;
    if (ctx.measureText(desc).width > lay.cardW - 56) {
      while (ctx.measureText(desc + '...').width > lay.cardW - 56 && desc.length > 10) desc = desc.slice(0,-1);
      desc += '...';
    }
    ctx.fillText(desc, cx + 44, cy + 32);

    // Level pips (compact)
    const maxPips = Math.min(up.maxLevel, 5);
    for (let l = 0; l < maxPips; l++) {
      ctx.fillStyle = l < level ? P.SHOP_GOLD : '#444';
      ctx.beginPath(); ctx.arc(cx + 44 + l * 11, cy + 47, 3, 0, Math.PI*2); ctx.fill();
    }
    if (up.maxLevel > 5) {
      ctx.fillStyle = P.PARCHMENT; ctx.font = '8px monospace'; ctx.textAlign = 'left';
      ctx.fillText(`${level}/${up.maxLevel}`, cx + 44 + maxPips * 11, cy + 50);
    }

    // Cost or MAXED
    ctx.textAlign = 'right';
    if (maxed) {
      ctx.fillStyle = '#888'; ctx.font = 'bold 10px monospace';
      ctx.fillText('MAX', cx + lay.cardW - 8, cy + 48);
    } else {
      ctx.fillStyle = canAfford ? P.SHOP_GOLD : P.DANGER; ctx.font = 'bold 12px monospace';
      ctx.fillText(`${cost}g`, cx + lay.cardW - 8, cy + 48);
    }
  });

  ctx.restore();

  // Scroll indicators
  const totalRows = Math.ceil(UPGRADES.length / lay.cols);
  const totalHeight = totalRows * (lay.cardH + lay.gap);
  const viewHeight = lay.btnY - 102 - lay.gap;
  if (totalHeight > viewHeight) {
    if (shopScrollY > 0) {
      ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.5; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText('▲ scroll up', W/2, 106);
      ctx.globalAlpha = 1;
    }
    if (shopScrollY < totalHeight - viewHeight) {
      ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.5; ctx.font = '12px monospace'; ctx.textAlign = 'center';
      ctx.fillText('▼ scroll down', W/2, lay.btnY - 8);
      ctx.globalAlpha = 1;
    }
  }

  // Continue button (fixed position)
  const isHover = hoverBtn === 'shop_continue';
  drawRoundRect(lay.btnX, lay.btnY, lay.btnW, lay.btnH, 10, isHover ? lighten(P.SUCCESS, 20) : P.SUCCESS, '#44bb66');
  ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
  ctx.fillText('NEXT WAVE →', W/2, lay.btnY + lay.btnH/2 + 6);

  // Keyboard hint
  ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.4; ctx.font = '10px monospace';
  ctx.fillText('[Enter] continue  [↑↓] scroll', W/2, lay.btnY + lay.btnH + 14);
  ctx.globalAlpha = 1;
}

// === TITLE SCREEN ===
function drawTitle() {
  // Dark gradient background
  const bgGrd = ctx.createLinearGradient(0, 0, 0, H);
  bgGrd.addColorStop(0, '#0d0805');
  bgGrd.addColorStop(0.5, P.BG_DARK);
  bgGrd.addColorStop(1, '#120a06');
  ctx.fillStyle = bgGrd;
  ctx.fillRect(0,0,W,H);

  const t = Date.now() * 0.002;

  // Floating potion bottles (animated, varied shapes)
  for (let i = 0; i < 20; i++) {
    const bx = (i * 97 + t * 5) % (W + 40) - 20;
    const by = 100 + Math.sin(t + i * 0.7) * 30 + (i % 5) * 80;
    const col = [P.HERB_RED, P.CRYS_BLUE, P.FLOW_YELLOW, P.MOSS_GREEN, P.MUSH_PURPLE][i%5];
    ctx.globalAlpha = 0.12;
    drawBottle(bx, by, 10, 22, col, i%3);
    ctx.globalAlpha = 1;
  }

  // Background glow behind title
  const titleGlow = ctx.createRadialGradient(W/2, 140, 10, W/2, 140, 220);
  titleGlow.addColorStop(0, 'rgba(255,204,0,0.08)');
  titleGlow.addColorStop(1, 'rgba(255,204,0,0)');
  ctx.fillStyle = titleGlow;
  ctx.fillRect(0, 0, W, 300);

  // Animated sparkles around title
  for (let i = 0; i < 8; i++) {
    const sx = W/2 - 200 + i * 55 + Math.sin(t*1.5+i*1.3)*20;
    const sy = 120 + Math.cos(t*1.2+i*0.9)*25;
    const twinkle = Math.sin(t*3+i*2)*0.5+0.5;
    ctx.fillStyle = P.ACCENT; ctx.globalAlpha = twinkle * 0.4;
    ctx.beginPath(); ctx.arc(sx, sy, 1.5+twinkle, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  titlePulse += 0.03;

  // Title text with shadow
  const ts = 1 + Math.sin(titlePulse) * 0.02;
  ctx.save(); ctx.translate(W/2, 160); ctx.scale(ts, ts);
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.font = 'bold 52px monospace'; ctx.textAlign = 'center';
  ctx.fillText('POTION PANIC!', 2, 2);
  // Main title
  ctx.fillStyle = P.ACCENT;
  ctx.fillText('POTION PANIC!', 0, 0);
  // Subtle highlight on top
  ctx.fillStyle = 'rgba(255,255,220,0.15)';
  ctx.fillText('POTION PANIC!', 0, -1);
  ctx.restore();

  ctx.fillStyle = P.PARCHMENT; ctx.font = '15px monospace'; ctx.textAlign = 'center';
  ctx.fillText('Brew potions. Cure customers. Don\'t panic.', W/2, 200);

  // === DIFFICULTY BUTTONS ===
  const diffKeys = ['easy','normal','hard'];
  const btnW = 180, btnH = 70, gap = 20;
  const totalW = diffKeys.length * btnW + (diffKeys.length - 1) * gap;
  const startX = (W - totalW) / 2;

  ctx.fillStyle = P.WHITE; ctx.font = 'bold 16px monospace';
  ctx.fillText('Choose Difficulty', W/2, 250);

  diffKeys.forEach((key, i) => {
    const d = DIFFICULTIES[key];
    const bx = startX + i * (btnW + gap);
    const by = 270;
    const isHover = hoverBtn === `diff_${key}`;
    const isSelected = selectedDifficulty === key;
    const bg = isHover ? lighten(d.color, 30) : d.color;
    drawRoundRect(bx, by, btnW, btnH, 8, bg, isSelected ? P.WHITE : lighten(d.color, -30));
    if (isSelected) {
      ctx.strokeStyle = P.WHITE; ctx.lineWidth = 3;
      ctx.strokeRect(bx-2, by-2, btnW+4, btnH+4);
    }
    ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText(d.label, bx + btnW/2, by + 28);
    ctx.font = '9px monospace'; ctx.fillStyle = '#333';
    // Word wrap description
    const words = d.desc.split(' ');
    let line1 = '', line2 = '';
    for (const w of words) {      if (ctx.measureText(line1 + ' ' + w).width < btnW - 16) line1 += (line1 ? ' ' : '') + w;
      else line2 += (line2 ? ' ' : '') + w;
    }
    ctx.fillText(line1, bx + btnW/2, by + 45);
    if (line2) ctx.fillText(line2, bx + btnW/2, by + 57);
  });

  // START button
  const sBtnW = 220, sBtnH = 55;
  const sBtnX = W/2 - sBtnW/2, sBtnY = 370;
  const startHover = hoverBtn === 'start';
  const selColor = DIFFICULTIES[selectedDifficulty].color;
  drawRoundRect(sBtnX, sBtnY, sBtnW, sBtnH, 10, startHover ? lighten(selColor, 30) : selColor, lighten(selColor, -20));
  ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
  ctx.fillText('START', W/2, sBtnY + sBtnH/2 + 9);

  // Resume button (if saved game exists)
  const savedGame = loadGameState();
  if (savedGame) {
    const rBtnW = 220, rBtnH = 40;
    const rBtnX = W/2 - rBtnW/2, rBtnY = 430;
    const rHover = hoverBtn === 'resume_save';
    drawRoundRect(rBtnX, rBtnY, rBtnW, rBtnH, 8, rHover ? lighten(P.SUCCESS, 25) : P.SUCCESS, lighten(P.SUCCESS, -30));
    ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`RESUME (Wave ${savedGame.wave})`, W/2, rBtnY + rBtnH/2 + 5);
  }

  // High score
  const hs = highScores[selectedDifficulty];
  if (hs > 0) {
    ctx.fillStyle = P.ACCENT; ctx.font = '14px monospace';
    ctx.fillText(`Best (${DIFFICULTIES[selectedDifficulty].label}): ${hs}`, W/2, savedGame ? 490 : 460);
  }

  // Tutorial button
  const tBtnW = 160, tBtnH = 40;
  const tBtnX = W/2 - tBtnW/2, tBtnY = savedGame ? 480 : 440;
  const tutHover = hoverBtn === 'tutorial';
  drawRoundRect(tBtnX, tBtnY, tBtnW, tBtnH, 8, tutHover ? lighten(P.BG_LIGHT, 25) : P.BG_LIGHT, P.COUNTER);
  ctx.fillStyle = P.PARCHMENT; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
  ctx.fillText('HOW TO PLAY', W/2, tBtnY + tBtnH/2 + 6);

  // Achievement badges
  const achCount = Object.keys(unlockedAchievements).length;
  if (achCount > 0) {
    ctx.fillStyle = P.ACHIEVEMENT; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`Achievements: ${achCount}/${ACHIEVEMENTS.length}`, W/2, savedGame ? 515 : 495);
    // Show badge icons
    ctx.font = 'bold 14px monospace';
    const achStartX = W/2 - (ACHIEVEMENTS.length * 18) / 2;
    ACHIEVEMENTS.forEach((a, i) => {
      const unlocked = unlockedAchievements[a.id];
      ctx.fillStyle = unlocked ? P.ACHIEVEMENT : '#333';
      ctx.globalAlpha = unlocked ? 0.9 : 0.3;
      ctx.textAlign = 'center';
      ctx.fillText(a.icon, achStartX + i * 18 + 9, savedGame ? 532 : 512);
    });
    ctx.globalAlpha = 1;
  }

  // Controls hint
  ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.5; ctx.font = '10px monospace'; ctx.textAlign = 'center';
  ctx.fillText('[1-7] ingredients  [Space] brew  [Z] undo  [ESC] pause', W/2, savedGame ? 550 : 530);
  ctx.globalAlpha = 1;
}

// === TUTORIAL ===
function drawTutorial() {
  const bgGrd = ctx.createLinearGradient(0, 0, 0, H);
  bgGrd.addColorStop(0, '#0d0805'); bgGrd.addColorStop(1, P.BG_DARK);
  ctx.fillStyle = bgGrd; ctx.fillRect(0,0,W,H);

  const pages = [
    {
      title: 'The Basics',
      lines: [
        'Customers arrive with ailments shown in speech bubbles.',
        'Match their ailment to a recipe in your Recipe Book (right side).',
        'Click ingredients at the bottom to add them to your cauldron.',
        'When the recipe is complete, click BREW to serve the potion!',
        'Serve customers before their patience bar runs out.',
        'If they leave angry, you lose a life. Lose all lives = game over.'
      ],
      icons: ['🧪', '📖', '🧪']
    },
    {
      title: 'Recipes & Ingredients',
      lines: [
        'Each ailment requires a specific combination of ingredients.',
        'Recipes are shown in the Recipe Book on the right side.',
        'Tier 1-2 recipes: ingredient ORDER does not matter.',
        'Tier 3-4 recipes marked [ORD]: ingredients must be added in order!',
        'The Enchanted Cauldron upgrade removes ordering requirements.',
        'Watch for duplicate ingredients — they can cause explosions!'
      ],
      icons: ['🌿', '💎', '🍄']
    },
    {
      title: 'Scoring & Combos',
      lines: [
        'Earn gold for each customer served — faster service = more gold.',
        'Serve multiple customers quickly to build a COMBO multiplier!',
        'Your Reputation meter affects gold earned (0.5x to 3.0x).',
        'Good service raises reputation, bad brews lower it.',
        'VIP customers (gold crown) pay double — prioritize them!',
        'Every 3rd wave is RUSH HOUR — more customers, 1.5x gold!'
      ],
      icons: ['💰', '⚡', '👑']
    },
    {
      title: 'Upgrades & Controls',
      lines: [
        'Between waves, visit the shop to spend gold on upgrades.',
        'Upgrades boost brewing speed, gold earn, combo time, and more.',
        '',
        'CONTROLS:',
        '[1-7] Add ingredient  |  [Space/Enter] Brew  |  [Z] Undo',
        '[Backspace] Clear cauldron  |  [ESC] Pause'
      ],
      icons: ['🛒', '⬆️', '🎮']
    }
  ];

  const page = pages[Math.min(tutorialPage, pages.length - 1)];
  const totalPages = pages.length;

  // Panel
  drawRoundRect(60, 40, W-120, H-80, 12, P.BG_MID, P.COUNTER);

  // Title
  ctx.fillStyle = P.ACCENT; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
  ctx.fillText(page.title, W/2, 90);

  // Page indicator
  ctx.fillStyle = P.PARCHMENT; ctx.font = '12px monospace';
  ctx.fillText(`Page ${tutorialPage + 1} / ${totalPages}`, W/2, 115);

  // Page dots
  for (let i = 0; i < totalPages; i++) {
    ctx.fillStyle = i === tutorialPage ? P.ACCENT : '#555';
    ctx.beginPath(); ctx.arc(W/2 - (totalPages*8) + i*16 + 8, 130, 4, 0, Math.PI*2); ctx.fill();
  }

  // Content lines
  ctx.textAlign = 'left'; ctx.font = '13px monospace';
  for (let i = 0; i < page.lines.length; i++) {
    const ly = 165 + i * 32;
    if (page.lines[i] === '') continue;
    const isHeader = page.lines[i].startsWith('CONTROLS');
    ctx.fillStyle = isHeader ? P.ACCENT : P.PARCHMENT;
    ctx.font = isHeader ? 'bold 14px monospace' : '13px monospace';
    // Bullet
    if (!isHeader && page.lines[i].length > 0) {
      ctx.fillStyle = P.ACCENT; ctx.fillText('>', 90, ly);
    }
    ctx.fillStyle = isHeader ? P.ACCENT : P.PARCHMENT;
    ctx.fillText(page.lines[i], 108, ly);
  }

  // Navigation buttons
  const navY = H - 100;
  // Back button
  if (tutorialPage > 0) {
    const backHover = hoverBtn === 'tut_back';
    drawRoundRect(100, navY, 120, 40, 8, backHover ? lighten(P.BG_LIGHT, 20) : P.BG_LIGHT, P.STONE);
    ctx.fillStyle = P.PARCHMENT; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
    ctx.fillText('< BACK', 160, navY + 26);
  }
  // Next / Done button
  const isLast = tutorialPage >= totalPages - 1;
  const nextHover = hoverBtn === 'tut_next';
  const nextColor = isLast ? P.SUCCESS : P.ACCENT;
  drawRoundRect(W - 220, navY, 120, 40, 8, nextHover ? lighten(nextColor, 20) : nextColor, lighten(nextColor, -30));
  ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText(isLast ? 'DONE' : 'NEXT >', W - 160, navY + 26);
}

// === PAUSE SCREEN ===
function drawPause() {
  pauseAnim = Math.min(1, pauseAnim + 0.06);
  ctx.fillStyle = `rgba(0,0,0,${0.65 * pauseAnim})`;
  ctx.fillRect(0,0,W,H);

  const centerY = -30 * (1 - pauseAnim);
  ctx.save();
  ctx.translate(0, centerY);

  // Panel
  drawRoundRect(240, 140, 320, 360, 12, P.BG_MID, P.COUNTER);

  ctx.fillStyle = P.ACCENT; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
  ctx.fillText('PAUSED', 400, 195);

  // Current stats
  ctx.fillStyle = P.PARCHMENT; ctx.font = '13px monospace';
  ctx.fillText(`Wave ${wave}  |  Score ${score}  |  ${diffConfig.label}`, 400, 225);

  // Resume button
  const r = PAUSE_BTNS.resume;
  const rHover = hoverBtn === 'resume';
  drawRoundRect(r.x, r.y, r.w, r.h, 8, rHover ? lighten(P.SUCCESS, 20) : P.SUCCESS, '#44bb66');
  ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 18px monospace';
  ctx.fillText('RESUME', r.x + r.w/2, r.y + r.h/2 + 7);

  // SFX toggle
  const s = PAUSE_BTNS.sfx;
  const sHover = hoverBtn === 'sfx_toggle';
  drawRoundRect(s.x, s.y, s.w, s.h, 6, sHover ? lighten(P.BG_LIGHT, 15) : P.BG_LIGHT, P.STONE);
  ctx.fillStyle = P.WHITE; ctx.font = '13px monospace';
  ctx.fillText(`Sound FX: ${sfxOn ? 'ON' : 'OFF'}`, s.x + s.w/2, s.y + s.h/2 + 5);

  // Music toggle
  const m = PAUSE_BTNS.music;
  const mHover = hoverBtn === 'music_toggle';
  drawRoundRect(m.x, m.y, m.w, m.h, 6, mHover ? lighten(P.BG_LIGHT, 15) : P.BG_LIGHT, P.STONE);
  ctx.fillStyle = P.WHITE; ctx.font = '13px monospace';
  ctx.fillText(`Music: ${musicOn ? 'ON' : 'OFF'}`, m.x + m.w/2, m.y + m.h/2 + 5);

  // Quit button
  const q = PAUSE_BTNS.quit;
  const qHover = hoverBtn === 'quit';
  drawRoundRect(q.x, q.y, q.w, q.h, 8, qHover ? '#aa5555' : P.DANGER, '#882222');
  ctx.fillStyle = P.WHITE; ctx.font = 'bold 16px monospace';
  ctx.fillText('QUIT TO MENU', q.x + q.w/2, q.y + q.h/2 + 6);

  ctx.restore();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = P.DANGER; ctx.font = 'bold 44px monospace'; ctx.textAlign = 'center';
  ctx.fillText('SHOP CLOSED!', W/2, 100);

  ctx.fillStyle = P.WHITE; ctx.font = '15px monospace';
  ctx.fillText(`Score: ${score}  |  Gold: ${runStats.totalGold}  |  Waves: ${wave}`, W/2, 145);
  ctx.fillText(`Difficulty: ${diffConfig.label}  |  Max Combo: ${runStats.maxCombo}x`, W/2, 170);

  ctx.font = '12px monospace'; ctx.fillStyle = P.PARCHMENT;
  ctx.fillText(`Customers Served: ${runStats.totalServed}`, W/2, 200);
  ctx.fillText(`VIPs Served: ${runStats.rareServed}  |  Peak Rep: ${runStats.maxRep.toFixed(1)}x`, W/2, 220);

  const hs = highScores[selectedDifficulty];
  if (score >= hs && score > 0) {
    ctx.fillStyle = P.ACCENT; ctx.font = 'bold 16px monospace';
    ctx.fillText(`NEW ${diffConfig.label.toUpperCase()} HIGH SCORE!`, W/2, 255);
  }

  if (runStats.perfectWaves > 0) {
    ctx.fillStyle = P.ACHIEVEMENT; ctx.font = '13px monospace';
    ctx.fillText(`Perfect Waves (no lives lost): ${runStats.perfectWaves}`, W/2, 280);
  }

  const btnW = 200, btnH = 55;
  const btnX = W/2 - btnW/2, btnY = 310;
  const btnHover = hoverBtn === 'retry';
  drawRoundRect(btnX, btnY, btnW, btnH, 10, btnHover ? lighten(P.SUCCESS, 30) : P.SUCCESS, '#44bb66');
  ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 20px monospace';
  ctx.fillText('TRY AGAIN', W/2, btnY + btnH/2 + 7);

  const mBtnY = btnY + btnH + 15;
  const mHover = hoverBtn === 'tomenu';
  drawRoundRect(btnX, mBtnY, btnW, 40, 8, mHover ? lighten(P.BG_LIGHT, 20) : P.BG_LIGHT, P.STONE);
  ctx.fillStyle = P.WHITE; ctx.font = '14px monospace';
  ctx.fillText('MAIN MENU', W/2, mBtnY + 25);
}

function drawWaveIntro() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = P.ACCENT; ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center';
  ctx.fillText(`Wave ${wave}`, W/2, 180);

  if (isRushHour) {
    ctx.fillStyle = P.RUSH_RED; ctx.font = 'bold 20px monospace';
    ctx.globalAlpha = 0.8 + Math.sin(gameTime*8)*0.2;
    ctx.fillText('RUSH HOUR!', W/2, 215);
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.PARCHMENT; ctx.font = '13px monospace';
    ctx.fillText('More customers, faster spawns, 1.5x gold!', W/2, 235);
  }

  const rushMult = isRushHour ? 1.4 : 1.0;
  let count = Math.min(Math.floor((3 + Math.floor(wave * 1.5)) * diffConfig.waveCountMult * rushMult), 30);
  const introIsBoss = BOSS_WAVES.includes(wave) || (endlessMode && wave > 20 && wave % 5 === 0);
  if (introIsBoss) count = Math.max(2, Math.floor(count * 0.5));
  ctx.fillStyle = P.PARCHMENT; ctx.font = '16px monospace';
  ctx.fillText(`${count} customers incoming!`, W/2, isRushHour ? 260 : 230);

  // Wave modifier display
  if (currentModifier) {
    const modY = isRushHour ? 270 : 245;
    ctx.fillStyle = currentModifier.color; ctx.font = 'bold 16px monospace';
    ctx.fillText(`${currentModifier.icon} ${currentModifier.name} ${currentModifier.icon}`, W/2, modY);
    ctx.fillStyle = P.PARCHMENT; ctx.font = '12px monospace';
    ctx.fillText(currentModifier.desc, W/2, modY + 18);
  }

  // Boss wave announcement
  if (bossActive) {
    // Get boss def (may be a cloned/scaled one for endless mode)
    let bDef = BOSS_DEFS[wave];
    if (!bDef && endlessMode && wave > 20) {
      const bossKeys = [5, 10, 15, 20];
      bDef = BOSS_DEFS[bossKeys[Math.floor(((wave / 5 - 1) % 4))]];
    }
    if (bDef) {
    const bossY = currentModifier ? (isRushHour ? 310 : 285) : (isRushHour ? 275 : 260);
    ctx.fillStyle = bDef.color; ctx.font = 'bold 22px monospace';
    ctx.globalAlpha = 0.8 + Math.sin(gameTime*6)*0.2;
    ctx.fillText(`BOSS: ${bDef.name}`, W/2, bossY);
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.PARCHMENT; ctx.font = '13px monospace';
    ctx.fillText(bDef.desc, W/2, bossY + 22);
    }
  }

  // Environment theme name
  const envTheme = getEnvTheme();
  ctx.fillStyle = envTheme.accent; ctx.font = '11px monospace'; ctx.globalAlpha = 0.6;
  ctx.fillText(envTheme.name, W/2, H - 30);
  ctx.globalAlpha = 1;

  if (newRecipeShown) {
    const bossOffset = bossActive ? 50 : 0; // BUGFIX: push recipe text down when boss announcement is also showing
    const baseY = (isRushHour ? 290 : 280) + bossOffset;
    const tierInfo = POTION_TIERS[newRecipeShown.tier || 1];
    ctx.fillStyle = P.ACCENT; ctx.font = 'bold 20px monospace';
    ctx.fillText('NEW RECIPE UNLOCKED!', W/2, baseY);
    ctx.fillStyle = tierInfo.color; ctx.font = '12px monospace';
    ctx.fillText(`[${tierInfo.name} Tier${newRecipeShown.ordered ? ' - ORDERED' : ''}]`, W/2, baseY + 20);
    ctx.fillStyle = newRecipeShown.color; ctx.font = 'bold 24px monospace';
    ctx.fillText(`${newRecipeShown.icon} ${newRecipeShown.name}`, W/2, baseY + 50);
    const sep = newRecipeShown.ordered ? ' > ' : ' + ';
    const recipeStr = newRecipeShown.recipe.map(id => {
      const ing = INGREDIENTS.find(i => i.id === id);
      return ing ? ing.name : '?';
    }).join(sep);
    ctx.fillStyle = P.WHITE; ctx.font = '16px monospace';
    ctx.fillText(recipeStr, W/2, baseY + 80);
    if (newRecipeShown.ordered) {
      ctx.fillStyle = P.TIER3; ctx.font = '13px monospace';
      ctx.fillText('Order matters! Add ingredients in sequence.', W/2, baseY + 105);
    }
    if (newRecipeShown.id === 'rash' || newRecipeShown.id === 'plague') {
      ctx.fillStyle = P.MUSH_PURPLE; ctx.font = '14px monospace';
      ctx.fillText('Purple Mushroom now available!', W/2, baseY + (newRecipeShown.ordered ? 125 : 105));
    }
    if (newRecipeShown.id === 'fracture') {
      ctx.fillStyle = P.BONE_WHITE; ctx.font = '14px monospace';
      ctx.fillText('White Bone now available!', W/2, baseY + (newRecipeShown.ordered ? 125 : 105));
    }
    if (newRecipeShown.id === 'burnwound') {
      ctx.fillStyle = P.EMBER_ORANGE; ctx.font = '14px monospace';
      ctx.fillText('Fire Ember now available!', W/2, baseY + (newRecipeShown.ordered ? 125 : 105));
    }
  }
}

// === VICTORY SCREEN ===
function drawVictory() {
  const bgGrd = ctx.createLinearGradient(0, 0, 0, H);
  bgGrd.addColorStop(0, '#1a0e00');
  bgGrd.addColorStop(0.3, '#2d1f08');
  bgGrd.addColorStop(1, '#0a0600');
  ctx.fillStyle = bgGrd; ctx.fillRect(0,0,W,H);

  const t = gameTime;

  // Celebratory particles
  for (let i = 0; i < 30; i++) {
    const px = (i * 73 + t * 20) % W;
    const py = (i * 47 + Math.sin(t + i) * 40) % H;
    const twinkle = Math.sin(t*2+i)*0.5+0.5;
    ctx.fillStyle = [P.ACCENT, P.ACHIEVEMENT, P.SUCCESS, P.RARE_GOLD, P.TIP_GOLD][i%5];
    ctx.globalAlpha = twinkle * 0.5;
    ctx.beginPath(); ctx.arc(px, py, 1+twinkle*2, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Title glow
  const glow = ctx.createRadialGradient(W/2, 100, 10, W/2, 100, 200);
  glow.addColorStop(0, 'rgba(255,204,0,0.15)');
  glow.addColorStop(1, 'rgba(255,204,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,250);

  // Crown
  ctx.fillStyle = P.ACCENT;
  const crX = W/2, crY = 55;
  ctx.beginPath();
  ctx.moveTo(crX-35, crY+20); ctx.lineTo(crX-30, crY); ctx.lineTo(crX-15, crY+12);
  ctx.lineTo(crX, crY-10); ctx.lineTo(crX+15, crY+12);
  ctx.lineTo(crX+30, crY); ctx.lineTo(crX+35, crY+20);
  ctx.closePath(); ctx.fill();
  // Gems on crown
  ctx.fillStyle = P.DANGER; ctx.beginPath(); ctx.arc(crX, crY+2, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.CRYS_BLUE; ctx.beginPath(); ctx.arc(crX-18, crY+12, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = P.MUSH_PURPLE; ctx.beginPath(); ctx.arc(crX+18, crY+12, 3, 0, Math.PI*2); ctx.fill();

  // Title
  const ts = 1 + Math.sin(t*2) * 0.02;
  ctx.save(); ctx.translate(W/2, 110); ctx.scale(ts, ts);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.font = 'bold 36px monospace'; ctx.textAlign = 'center';
  ctx.fillText('POTION MASTER!', 2, 2);
  ctx.fillStyle = P.ACCENT;
  ctx.fillText('POTION MASTER!', 0, 0);
  ctx.restore();

  ctx.fillStyle = P.PARCHMENT; ctx.font = '15px monospace'; ctx.textAlign = 'center';
  ctx.fillText('You conquered all 20 waves and defeated the Dragon!', W/2, 145);

  // Stats
  const statsY = 175;
  ctx.fillStyle = P.ACCENT; ctx.font = 'bold 18px monospace';
  ctx.fillText('FINAL STATS', W/2, statsY);

  ctx.font = '14px monospace'; ctx.fillStyle = P.PARCHMENT;
  const stats = [
    `Final Score: ${score}`,
    `Total Gold Earned: ${runStats.totalGold}`,
    `Customers Served: ${runStats.totalServed}`,
    `Max Combo: ${runStats.maxCombo}x`,
    `Perfect Waves: ${runStats.perfectWaves}`,
    `VIP Customers: ${runStats.rareServed}`,
    `Peak Reputation: ${runStats.maxRep.toFixed(1)}x`,
    `Difficulty: ${diffConfig.label}`,
  ];
  stats.forEach((s, i) => {
    ctx.fillStyle = i % 2 === 0 ? P.PARCHMENT : P.WHITE;
    ctx.fillText(s, W/2, statsY + 25 + i * 22);
  });

  // High score
  ctx.fillStyle = P.ACHIEVEMENT; ctx.font = 'bold 16px monospace';
  if (score >= highScores[selectedDifficulty]) {
    ctx.fillText('NEW HIGH SCORE!', W/2, statsY + 25 + stats.length * 22 + 10);
  }

  // Endless Mode button
  const eBtnW = 220, eBtnH = 45;
  const eBtnX = W/2 - eBtnW/2, eBtnY = H - 145;
  const eHover = hoverBtn === 'victory_endless';
  drawRoundRect(eBtnX, eBtnY, eBtnW, eBtnH, 10, eHover ? lighten(P.TIER3, 30) : P.TIER3, '#882288');
  ctx.fillStyle = P.WHITE; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center';
  ctx.fillText('ENDLESS MODE', W/2, eBtnY + eBtnH/2 + 6);
  ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.6; ctx.font = '9px monospace';
  ctx.fillText('Keep going — waves scale forever!', W/2, eBtnY + eBtnH + 14);
  ctx.globalAlpha = 1;

  // Play Again button
  const btnW = 220, btnH = 45;
  const btnX = W/2 - btnW/2, btnY = H - 70;
  const isHover = hoverBtn === 'victory_restart';
  drawRoundRect(btnX, btnY, btnW, btnH, 10, isHover ? lighten(P.ACCENT, 30) : P.ACCENT, '#ccaa00');
  ctx.fillStyle = P.TEXT_DARK; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
  ctx.fillText('PLAY AGAIN', W/2, btnY + btnH/2 + 6);

  ctx.fillStyle = P.PARCHMENT; ctx.globalAlpha = 0.5; ctx.font = '11px monospace';
  ctx.fillText('[Enter] new game  [E] endless mode', W/2, H - 15);
  ctx.globalAlpha = 1;
}

// === INPUT HANDLING ===
function hitTest(mx, my, btn) {
  return mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h;
}

canvas.addEventListener('click', (e) => {
  initAudio();
  if (!musicPlaying) startMusic();
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / scale;
  const my = (e.clientY - rect.top) / scale;

  if (state === 'title') {
    // Difficulty buttons
    const diffKeys = ['easy','normal','hard'];
    const btnW = 180, btnH = 70, gap = 20;
    const totalW = diffKeys.length * btnW + (diffKeys.length - 1) * gap;
    const startX = (W - totalW) / 2;
    diffKeys.forEach((key, i) => {
      const bx = startX + i * (btnW + gap), by = 270;
      if (mx >= bx && mx <= bx+btnW && my >= by && my <= by+btnH) {
        selectedDifficulty = key;
        diffConfig = DIFFICULTIES[key];
        playSound('click');
      }
    });
    // Start button
    const sBtnW = 220, sBtnH = 55;
    const sBtnX = W/2 - sBtnW/2, sBtnY = 370;
    if (mx >= sBtnX && mx <= sBtnX+sBtnW && my >= sBtnY && my <= sBtnY+sBtnH) {
      playSound('click');
      clearSaveGame(); // new game clears any save
      startGame();
    }
    // Resume button
    const savedGame = loadGameState();
    if (savedGame) {
      const rBtnW = 220, rBtnH = 40;
      const rBtnX = W/2 - rBtnW/2, rBtnY = 430;
      if (mx >= rBtnX && mx <= rBtnX+rBtnW && my >= rBtnY && my <= rBtnY+rBtnH) {
        playSound('click'); resumeGame(savedGame);
      }
    }
    // Tutorial button
    const tBtnW = 160, tBtnH = 40;
    const tBtnX = W/2 - tBtnW/2, tBtnY = savedGame ? 480 : 440;
    if (mx >= tBtnX && mx <= tBtnX+tBtnW && my >= tBtnY && my <= tBtnY+tBtnH) {
      playSound('click'); tutorialPage = 0; state = 'tutorial';
    }
    return;
  }

  if (state === 'tutorial') {
    const navY = H - 100;
    if (tutorialPage > 0 && mx >= 100 && mx <= 220 && my >= navY && my <= navY+40) {
      playSound('click'); tutorialPage--;
    }
    if (mx >= W-220 && mx <= W-100 && my >= navY && my <= navY+40) {
      playSound('click');
      if (tutorialPage >= 3) { state = 'title'; } else { tutorialPage++; }
    }
    return;
  }

  if (state === 'paused') {
    // Adjust for animation offset
    if (hitTest(mx, my, PAUSE_BTNS.resume)) {
      togglePause();
    } else if (hitTest(mx, my, PAUSE_BTNS.sfx)) {
      sfxOn = !sfxOn;
      playSound('click');
    } else if (hitTest(mx, my, PAUSE_BTNS.music)) {
      musicOn = !musicOn;
      setMusicVolume(musicOn);
      playSound('click');
    } else if (hitTest(mx, my, PAUSE_BTNS.quit)) {
      playSound('click');
      startTransition(() => { state = 'title'; stopMusic(); musicPlaying = false; }, 0.4);
    }
    return;
  }

  if (state === 'victory') {
    // Endless button
    const eBtnW = 220, eBtnH = 45;
    const eBtnX = W/2 - eBtnW/2, eBtnY = H - 145;
    if (mx >= eBtnX && mx <= eBtnX+eBtnW && my >= eBtnY && my <= eBtnY+eBtnH) {
      playSound('click');
      endlessMode = true;
      startTransition(() => { openShop(); }, 0.4);
      playSound('transition');
    }
    // Play Again button
    const btnW = 220, btnH = 45;
    const btnX = W/2 - btnW/2, btnY = H - 70;
    if (mx >= btnX && mx <= btnX+btnW && my >= btnY && my <= btnY+btnH) {
      playSound('click'); startGame();
    }
    return;
  }

  if (state === 'gameover') {
    const btnW = 200, btnH = 55;
    const btnX = W/2 - btnW/2, btnY = 310;
    if (mx >= btnX && mx <= btnX+btnW && my >= btnY && my <= btnY+btnH) {
      playSound('click'); startGame();
    }
    // Menu button
    const mBtnY = btnY + btnH + 15;
    if (mx >= btnX && mx <= btnX+btnW && my >= mBtnY && my <= mBtnY+40) {
      playSound('click');
      startTransition(() => { state = 'title'; }, 0.4);
    }
    return;
  }

  if (state === 'waveIntro') return;

  if (state === 'shop') {
    const lay = getShopLayout();
    // Upgrade cards
    UPGRADES.forEach((up, i) => {
      const col = i % lay.cols, row = Math.floor(i / lay.cols);
      const cxS = lay.startX + col * (lay.cardW + lay.gap);
      const cyS = lay.startY + row * (lay.cardH + lay.gap);
      if (cyS + lay.cardH < 96 || cyS > lay.btnY - 6) return; // off-screen
      if (mx >= cxS && mx <= cxS+lay.cardW && my >= cyS && my <= cyS+lay.cardH) {
        const cost = getUpgradeCost(up);
        const level = upgradeLevels[up.id] || 0;
        if (level >= up.maxLevel) { playSound('shop_deny'); return; }
        if (gold < cost) { playSound('shop_deny'); return; }
        gold -= cost;
        upgradeLevels[up.id] = level + 1;
        playSound('shop_buy');
      }
    });
    // Continue button
    if (mx >= lay.btnX && mx <= lay.btnX+lay.btnW && my >= lay.btnY && my <= lay.btnY+lay.btnH) {
      playSound('click');
      startTransition(() => { startWave(wave + 1); }, 0.4);
      playSound('transition');
    }
    return;
  }

  if (state === 'playing') {
    // Merchant overlay click handling (Feature 1)
    if (merchant && merchant.active && !merchant.chosen) {
      const cardW = 200, cardH = 250, gap = 40;
      const totalW = cardW * 2 + gap;
      const cx = W/2 - totalW/2;
      const cy = H/2 - cardH/2;
      // Option 1
      if (mx >= cx && mx <= cx + cardW && my >= cy && my <= cy + cardH) {
        applyMerchantOffer(merchant.option1);
        merchant.chosen = true;
        merchant = null;
        return;
      }
      // Option 2
      if (mx >= cx + cardW + gap && mx <= cx + cardW + gap + cardW && my >= cy && my <= cy + cardH) {
        applyMerchantOffer(merchant.option2);
        merchant.chosen = true;
        merchant = null;
        return;
      }
      return; // Block other clicks while merchant is active
    }

    const btns = getIngredientBtns();
    for (const btn of btns) {
      if (mx >= btn.x && mx <= btn.x+btn.w && my >= btn.y && my <= btn.y+btn.h) {
        if (cauldron.length < maxCauldronSlots) {
          undoStack.push([...cauldron]);
          cauldron.push(btn.id);
          playSound('add_' + btn.id);
          for (let i = 0; i < 5; i++) {
            particles.push({
              x: btn.x + btn.w/2, y: btn.y,
              vx: (CAULDRON_X + CAULDRON_W/2 - btn.x - btn.w/2) * 0.05 + (Math.random()-0.5)*2,
              vy: (CAULDRON_Y - btn.y) * 0.05 - Math.random()*2,
              life: 0.5, color: btn.color, size: 4,
            });
          }
        }
        return;
      }
    }
    if (hitTest(mx, my, BREW_BTN)) {
      if (cauldron.length >= 2) tryCauldronBrew();
      return;
    }
    // Double-down toggle (Feature 4)
    if (hitTest(mx, my, DOUBLE_DOWN_BTN)) {
      doubleDown = !doubleDown;
      playSound('click');
      return;
    }
    if (cauldron.length > 0 && hitTest(mx, my, CLEAR_BTN)) {
      undoStack.push([...cauldron]);
      cauldron = [];
      playSound('click');
      return;
    }
    if (hitTest(mx, my, UNDO_BTN) && undoStack.length > 0) {
      cauldron = undoStack.pop();
      playSound('undo');
      return;
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / scale;
  const my = (e.clientY - rect.top) / scale;

  prevHoverBtn = hoverBtn;
  hoverBtn = null;

  if (state === 'title') {
    const diffKeys = ['easy','normal','hard'];
    const btnW = 180, btnH = 70, gap = 20;
    const totalW = diffKeys.length * btnW + (diffKeys.length - 1) * gap;
    const startX = (W - totalW) / 2;
    diffKeys.forEach((key, i) => {
      const bx = startX + i * (btnW + gap), by = 270;
      if (mx >= bx && mx <= bx+btnW && my >= by && my <= by+btnH) hoverBtn = `diff_${key}`;
    });
    const sBtnW = 220, sBtnH = 55;
    const sBtnX = W/2 - sBtnW/2, sBtnY = 370;
    if (mx >= sBtnX && mx <= sBtnX+sBtnW && my >= sBtnY && my <= sBtnY+sBtnH) hoverBtn = 'start';
    // Resume button hover
    const rSave = loadGameState();
    if (rSave) {
      const rBtnW = 220, rBtnH = 40, rBtnX = W/2 - rBtnW/2, rBtnY = 430;
      if (mx >= rBtnX && mx <= rBtnX+rBtnW && my >= rBtnY && my <= rBtnY+rBtnH) hoverBtn = 'resume_save';
    }
    const tBtnW = 160, tBtnH = 40, tBtnX = W/2 - tBtnW/2, tBtnY = rSave ? 480 : 440;
    if (mx >= tBtnX && mx <= tBtnX+tBtnW && my >= tBtnY && my <= tBtnY+tBtnH) hoverBtn = 'tutorial';
    return;
  }

  if (state === 'tutorial') {
    const navY = H - 100;
    if (tutorialPage > 0 && mx >= 100 && mx <= 220 && my >= navY && my <= navY+40) hoverBtn = 'tut_back';
    if (mx >= W-220 && mx <= W-100 && my >= navY && my <= navY+40) hoverBtn = 'tut_next';
    return;
  }

  if (state === 'paused') {
    if (hitTest(mx, my, PAUSE_BTNS.resume)) hoverBtn = 'resume';
    else if (hitTest(mx, my, PAUSE_BTNS.sfx)) hoverBtn = 'sfx_toggle';
    else if (hitTest(mx, my, PAUSE_BTNS.music)) hoverBtn = 'music_toggle';
    else if (hitTest(mx, my, PAUSE_BTNS.quit)) hoverBtn = 'quit';
    return;
  }

  if (state === 'victory') {
    const eBtnW = 220, eBtnH = 45, eBtnX = W/2 - eBtnW/2, eBtnY = H - 145;
    if (mx >= eBtnX && mx <= eBtnX+eBtnW && my >= eBtnY && my <= eBtnY+eBtnH) hoverBtn = 'victory_endless';
    const btnW = 220, btnH = 45, btnX = W/2 - btnW/2, btnY = H - 70;
    if (mx >= btnX && mx <= btnX+btnW && my >= btnY && my <= btnY+btnH) hoverBtn = 'victory_restart';
    return;
  }

  if (state === 'gameover') {
    const btnW = 200, btnH = 55;
    const btnX = W/2 - btnW/2, btnY = 310;
    if (mx >= btnX && mx <= btnX+btnW && my >= btnY && my <= btnY+btnH) hoverBtn = 'retry';
    const mBtnY = btnY + btnH + 15;
    if (mx >= btnX && mx <= btnX+btnW && my >= mBtnY && my <= mBtnY+40) hoverBtn = 'tomenu';
    return;
  }

  if (state === 'shop') {
    const lay = getShopLayout();
    UPGRADES.forEach((up, i) => {
      const col = i % lay.cols, row = Math.floor(i / lay.cols);
      const cxS = lay.startX + col * (lay.cardW + lay.gap);
      const cyS = lay.startY + row * (lay.cardH + lay.gap);
      if (cyS + lay.cardH < 96 || cyS > lay.btnY - 6) return;
      if (mx >= cxS && mx <= cxS+lay.cardW && my >= cyS && my <= cyS+lay.cardH) hoverBtn = `shop_${up.id}`;
    });
    if (mx >= lay.btnX && mx <= lay.btnX+lay.btnW && my >= lay.btnY && my <= lay.btnY+lay.btnH) hoverBtn = 'shop_continue';
    return;
  }

  if (state === 'playing') {
    // Merchant hover
    if (merchant && merchant.active && !merchant.chosen) {
      const cardW = 200, cardH = 250, gap = 40;
      const totalW = cardW * 2 + gap;
      const cxM = W/2 - totalW/2;
      const cyM = H/2 - cardH/2;
      if (mx >= cxM && mx <= cxM + cardW && my >= cyM && my <= cyM + cardH) hoverBtn = 'merchant_0';
      else if (mx >= cxM + cardW + gap && mx <= cxM + cardW + gap + cardW && my >= cyM && my <= cyM + cardH) hoverBtn = 'merchant_1';
    }
    const btns = getIngredientBtns();
    for (const btn of btns) {
      if (mx >= btn.x && mx <= btn.x+btn.w && my >= btn.y && my <= btn.y+btn.h) { hoverBtn = btn.id; break; }
    }
    if (!hoverBtn && hitTest(mx, my, BREW_BTN)) hoverBtn = 'brew';
    if (!hoverBtn && hitTest(mx, my, DOUBLE_DOWN_BTN)) hoverBtn = 'double_down';
    if (!hoverBtn && hitTest(mx, my, CLEAR_BTN)) hoverBtn = 'clear';
    if (!hoverBtn && hitTest(mx, my, UNDO_BTN)) hoverBtn = 'undo';
  }

  // Hover sound
  if (hoverBtn && hoverBtn !== prevHoverBtn) {
    initAudio();
    playSound('hover');
  }
});

// === TOUCH SUPPORT (mobile) ===
let lastTouchY = null;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  lastTouchY = touch.clientY;
  // Synthesize a click event at the touch location
  const clickEvent = new MouseEvent('click', {
    clientX: touch.clientX,
    clientY: touch.clientY,
    bubbles: true,
  });
  canvas.dispatchEvent(clickEvent);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (state === 'shop' && lastTouchY !== null) {
    const touch = e.touches[0];
    const delta = lastTouchY - touch.clientY;
    shopScrollY = Math.max(0, Math.min(shopScrollY + delta * 1.5 / scale, getShopMaxScroll()));
    lastTouchY = touch.clientY;
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  lastTouchY = null;
}, { passive: false });

// Mouse wheel for shop scrolling
canvas.addEventListener('wheel', (e) => {
  if (state === 'shop') {
    e.preventDefault();
    shopScrollY = Math.max(0, Math.min(shopScrollY + e.deltaY * 0.5, getShopMaxScroll()));
  }
}, { passive: false });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (state === 'playing' || state === 'paused') {
      initAudio();
      togglePause();
      e.preventDefault();
      return;
    }
  }

  if (state === 'playing') {
    let avail = getAvailableIngredients();
    const keyMap = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4, '6': 5, '7': 6 };
    if (e.key in keyMap && keyMap[e.key] < avail.length) {
      if (cauldron.length < maxCauldronSlots) {
        initAudio(); undoStack.push([...cauldron]); cauldron.push(avail[keyMap[e.key]].id); playSound('add_' + avail[keyMap[e.key]].id);
        // Ingredient Magnet: queue next recipe ingredient
        if (upgradeLevels.ingredient_magnet && cauldron.length < maxCauldronSlots) {
          // Find a customer whose recipe starts with current cauldron contents
          const waitingC = customers.find(cc => cc.arrived && !cc.served && !cc.leaving && !cc.dying && cc.ailment);
          if (waitingC) {
            const recipe = waitingC.ailment.recipe;
            const nextIdx = cauldron.length; // next ingredient needed
            if (nextIdx < recipe.length) {
              const nextIng = recipe[nextIdx];
              const isAvail = avail.some(a => a.id === nextIng);
              if (isAvail) { magnetTarget = nextIng; magnetTimer = 0.3; }
            }
          }
        }
      }
    }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault(); initAudio();
      if (cauldron.length >= 2) tryCauldronBrew();
    }
    if (e.key === 'Backspace' || e.key === 'Delete') {
      if (cauldron.length > 0) undoStack.push([...cauldron]);
      cauldron = []; initAudio(); playSound('click');
    }
    if (e.key === 'z' || e.key === 'Z') {
      if (undoStack.length > 0) { cauldron = undoStack.pop(); initAudio(); playSound('undo'); }
    }
    // Potion Memory: M key replays last brewed recipe
    if ((e.key === 'm' || e.key === 'M') && upgradeLevels.potion_memory && lastBrewedRecipe.length > 0) {
      initAudio();
      undoStack.push([...cauldron]);
      cauldron = lastBrewedRecipe.slice(0, maxCauldronSlots);
      playSound('click');
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-10, text: 'MEMORY!', life: 1.0, color: '#aaddff' });
    }
    // Rush Mode: R key toggles rush mode
    if ((e.key === 'r') && upgradeLevels.rush_mode) {
      initAudio();
      rushModeActive = !rushModeActive;
      playSound('click');
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y-20, text: rushModeActive ? 'RUSH ON!' : 'RUSH OFF', life: 1.0, color: rushModeActive ? '#ff4444' : '#aaaaaa' });
    }
  }
  if (state === 'title') {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault(); initAudio(); playSound('click'); startGame();
    }
  }
  if (state === 'tutorial') {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault(); initAudio(); playSound('click');
      if (tutorialPage >= 3) state = 'title'; else tutorialPage++;
    }
    if (e.key === 'ArrowLeft') { e.preventDefault(); initAudio(); playSound('click'); if (tutorialPage > 0) tutorialPage--; }
    if (e.key === 'Escape') { e.preventDefault(); initAudio(); playSound('click'); state = 'title'; }
  }
  if (state === 'shop') {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault(); initAudio(); playSound('click');
      startTransition(() => { startWave(wave + 1); }, 0.4);
      playSound('transition');
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); shopScrollY = Math.min(shopScrollY + 40, getShopMaxScroll()); }
    if (e.key === 'ArrowUp') { e.preventDefault(); shopScrollY = Math.max(0, shopScrollY - 40); }
  }
  if (state === 'victory') {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault(); initAudio(); playSound('click'); startGame();
    }
    if (e.key === 'e' || e.key === 'E') {
      e.preventDefault(); initAudio(); playSound('click');
      endlessMode = true;
      startTransition(() => { openShop(); }, 0.4);
      playSound('transition');
    }
  }
  if (state === 'gameover') {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault(); initAudio(); playSound('click'); startGame();
    }
  }
});

// === GAME LOGIC ===
function startGame() {
  diffConfig = DIFFICULTIES[selectedDifficulty];
  score = 0;
  gold = 0;
  lives = LIVES_PER_WAVE;
  wave = 0;
  customers = [];
  cauldron = [];
  particles = [];
  floatTexts = [];
  bubbles = [];
  comboCount = 0;
  comboTimer = 0;
  brewFlash = 0;
  warningCooldowns = {};
  upgradeLevels = {};
  lastBrewedRecipe = [];
  magnetTimer = 0; magnetTarget = null;
  rushModeActive = false;
  overflowVials = [];
  recycledIngredient = null; recycledTimer = 0;
  assistantTarget = null;
  assistantBrewTimer = 0;
  assistantServesLeft = 0;
  servedAilments = {};
  patienceFreezeTimer = 0;
  reputation = 1.0;
  isRushHour = false;
  rushHourBonusMult = 1.0;
  discoveredRecipes = {};
  cauldronDamaged = 0;
  maxCauldronSlots = 4;
  undoStack = [];
  runStats = { totalServed:0, totalGold:0, maxCombo:0, maxWave:0, perfectWaves:0, rareServed:0, maxRep:1, waveLivesLost:0 };
  perfectWaveFlash = 0;
  recipeHighlight = null;
  currentModifier = null;
  brewCooldownTimer = 0;
  boss = null;
  bossActive = false;
  bossDeathRing = { active: false, x: 0, y: 0, radius: 0, maxRadius: 300, life: 0, color: '#ffaa00' };
  servePulse = { active: false, x: 0, y: 0, radius: 0, color: '#ffffff', life: 0 };
  endlessMode = false;
  runTipCount = 0;
  runExplosionCount = 0;
  achievementPopup = null;
  microEvent = null;
  perfectServeStreak = 0;
  deliveryQueue = [];
  brewQueue = [];
  lastBrewIngredients = [];
  brewer = { x: CAULDRON_X+CAULDRON_W/2, y: COUNTER_Y+20, homeX: CAULDRON_X+CAULDRON_W/2, state:'idle', target:null, potion:null, speed:200, deliverTimer:0, walkFrame:0, fatigue:0 };
  assistantBrewerChar = { x: CAULDRON_X-40, y: COUNTER_Y+20, homeX: CAULDRON_X-40, state:'idle', target:null, potion:null, speed:150, deliverTimer:0, deliveriesLeft:0, walkFrame:0, fatigue:0 };
  vipSpawnedThisWave = false;
  upcomingCustomers = [];
  // Feature 1-4 resets
  merchant = null;
  merchantCooldown = 0;
  merchantGoldMult = 1;
  merchantGoldUses = 0;
  merchantSpeedBoost = 1;
  merchantSpeedTimer = 0;
  comboShieldTimer = 0;
  merchantExtraSlotActive = false;
  doubleDown = false;
  mutationPending = null;
  linkedPairs = [];
  stopMusicLayers();
  if (!musicPlaying) startMusic();
  startTransition(() => { startWave(1); }, 0.4);
  playSound('transition');
}

function updateGame(dt) {
  if (state === 'waveIntro') {
    waveIntroTimer -= dt;
    if (waveIntroTimer <= 0) state = 'playing';
    updateParticles(dt);
    return;
  }

  if (state !== 'playing') { updateParticles(dt); return; }

  // Cauldron damage cooldown
  if (cauldronDamaged > 0) cauldronDamaged -= dt;
  // Brew cooldown (Potion Fumes modifier)
  if (brewCooldownTimer > 0) brewCooldownTimer -= dt;
  // Recipe highlight countdown
  if (recipeHighlight && recipeHighlight.timer > 0) recipeHighlight.timer -= dt;
  // Perfect wave flash countdown
  if (perfectWaveFlash > 0) perfectWaveFlash -= dt * 2;

  // === MICRO-EVENT UPDATE (Task #56) ===
  if (microEvent) {
    if (!microEvent.data.triggered) {
      microEvent.data.delay -= dt;
      if (microEvent.data.delay <= 0) {
        microEvent.data.triggered = true;
        if (microEvent.type === 'merchant') {
          floatTexts.push({ x: W/2, y: H/2 - 60, text: 'MERCHANT!', life: 2, color: P.SHOP_GOLD });
          playSound('shop_open');
        } else if (microEvent.type === 'inspector') {
          floatTexts.push({ x: W/2, y: H/2 - 60, text: 'INSPECTION!', life: 2, color: P.ACCENT });
          playSound('rare_ding');
        } else if (microEvent.type === 'ingredient_bonus') {
          floatTexts.push({ x: W/2, y: H/2 - 60, text: microEvent.data.ingredientName + ' ENCHANTED!', life: 2, color: P.POTION_GLO });
          playSound('rare_ding');
        }
      }
    } else {
      microEvent.timer -= dt;
      if (microEvent.timer <= 0) microEvent = null;
    }
  }

  // === ADAPTIVE MUSIC LAYERS UPDATE (Task #67) ===
  updateMusicLayers();

  // Serve pulse update
  if (servePulse.active) {
    servePulse.radius += dt * 200;
    servePulse.life -= dt;
    if (servePulse.life <= 0) servePulse.active = false;
  }

  // Reputation natural decay toward 1.0
  if (reputation > 1.0) reputation = Math.max(1.0, reputation - 0.02 * dt);
  else if (reputation < 1.0) reputation = Math.min(1.0, reputation + 0.01 * dt);
  if (reputation > runStats.maxRep) runStats.maxRep = reputation;

  // === MERCHANT SPEED BOOST TIMER (Feature 1) ===
  if (merchantSpeedTimer > 0) {
    merchantSpeedTimer -= dt;
    if (merchantSpeedTimer <= 0) { merchantSpeedBoost = 1; merchantSpeedTimer = 0; }
  }
  // === COMBO SHIELD TIMER (Feature 1) ===
  if (comboShieldTimer > 0) comboShieldTimer -= dt;

  // === TRAVELING MERCHANT SPAWN (Feature 1) ===
  const isBossWaveForMerchant = BOSS_WAVES.includes(wave) || (endlessMode && wave > 20 && wave % 5 === 0);
  if (!merchant && merchantCooldown <= 0 && !isBossWaveForMerchant && wave >= 2) {
    const totalCustomersThisWave = waveCustomersLeft + customers.length;
    const waveProgress = totalCustomersThisWave > 0 ? 1 - (waveCustomersLeft / totalCustomersThisWave) : 0;
    if (waveProgress >= 0.4 && waveProgress <= 0.6 && Math.random() < 0.01) { // ~chance per frame in window
      // Pick 2 random different offers
      const shuffled = [...MERCHANT_OFFERS].sort(() => Math.random() - 0.5);
      merchant = { active: true, timer: 5.0, option1: shuffled[0], option2: shuffled[1], chosen: false };
      merchantCooldown = 2 + Math.floor(Math.random() * 2);
      playSound('merchant_arrive');
    }
  }
  // Merchant timer countdown (auto-dismiss if player doesn't choose)
  if (merchant && merchant.active && !merchant.chosen) {
    merchant.timer -= dt;
    if (merchant.timer <= 0) merchant = null;
  }

  // === AILMENT MUTATION (Feature 3A) — wave 6+ ===
  if (wave >= 6 && !mutationPending && Math.random() < 0.0005) { // small per-frame chance
    const totalC = waveCustomersLeft + customers.length;
    const wp = totalC > 0 ? 1 - (waveCustomersLeft / totalC) : 0;
    if (wp >= 0.3 && wp <= 0.7) {
      const eligible = customers.filter(c => c.arrived && !c.served && !c.leaving && !c.dying && !c.reserved && !c.isVIP && !(boss && boss.customer === c));
      if (eligible.length > 0) {
        const target = eligible[Math.floor(Math.random() * eligible.length)];
        target.mutationPending = true;
        target.mutationWarnTimer = 2.0;
        mutationPending = target;
      }
    }
  }
  // Update mutation warning/execution
  if (mutationPending) {
    mutationPending.mutationWarnTimer -= dt;
    if (mutationPending.mutationWarnTimer <= 0) {
      // Execute mutation — swap ailment
      const available = getAvailableAilments().filter(a => a.id !== mutationPending.ailment.id);
      if (available.length > 0) {
        mutationPending.ailment = available[Math.floor(Math.random() * available.length)];
        floatTexts.push({ x: mutationPending.x + 15, y: mutationPending.y - 40, text: 'MUTATION!', life: 2.0, color: P.MUSH_PURPLE });
        playSound('mutation');
        shakeTimer = 0.2; shakeIntensity = 4;
      }
      mutationPending.mutationPending = false;
      mutationPending = null;
    }
  }

  // === LINKED CUSTOMERS UPDATE (Feature 3B) ===
  for (let lp = linkedPairs.length - 1; lp >= 0; lp--) {
    const pair = linkedPairs[lp];
    // Check if one was served — start the timer
    if (pair.c1.served && !pair.served1) { pair.served1 = true; pair.serveTimer = 5.0; }
    if (pair.c2.served && !pair.served2) { pair.served2 = true; pair.serveTimer = pair.serveTimer < 0 ? 5.0 : pair.serveTimer; }
    // Both served — bonus gold
    if (pair.served1 && pair.served2) {
      floatTexts.push({ x: (pair.c1.x + pair.c2.x) / 2 + 15, y: Math.min(pair.c1.y, pair.c2.y) - 50, text: 'LINKED BONUS!', life: 2.0, color: P.SHOP_GOLD });
      linkedPairs.splice(lp, 1);
      continue;
    }
    // Timer running — check if expired
    if (pair.serveTimer >= 0) {
      pair.serveTimer -= dt;
      if (pair.serveTimer <= 0) {
        // Time ran out — the unserved one dies
        const unserved = !pair.served1 ? pair.c1 : pair.c2;
        if (!unserved.served && !unserved.leaving && !unserved.dying) {
          unserved.patience = 0; // force death
        }
        linkedPairs.splice(lp, 1);
        continue;
      }
    }
    // If both are gone without being served, remove pair
    if ((pair.c1.leaving || pair.c1.dying) && (pair.c2.leaving || pair.c2.dying)) {
      linkedPairs.splice(lp, 1);
    }
  }

  // === ARGUER SWAP LOGIC (Feature 2) ===
  for (const c of customers) {
    if (c.behavior === 'arguer' && c.arrived && !c.served && !c.leaving && !c.dying) {
      c.arguerSwapTimer -= dt;
      if (c.arguerSwapTimer <= 0) {
        c.arguerSwapTimer = 4 + Math.random() * 2;
        // Find adjacent arguer
        const adj = customers.find(o => o !== c && o.behavior === 'arguer' && o.arrived && !o.served && !o.leaving && !o.dying && Math.abs(o.slot - c.slot) === 1);
        if (adj) {
          // Swap slots
          const tmpSlot = c.slot;
          c.slot = adj.slot;
          adj.slot = tmpSlot;
          c.targetX = CUSTOMER_SLOTS[c.slot].x;
          adj.targetX = CUSTOMER_SLOTS[adj.slot].x;
          c.arguerLerpT = 0.3;
          adj.arguerLerpT = 0.3;
        }
      }
    }
    // Lerp arguer position during swap
    if (c.arguerLerpT > 0) {
      c.arguerLerpT -= dt;
      c.x += (c.targetX - c.x) * 5 * dt;
    }
  }

  // Ingredient Magnet timer
  if (magnetTimer > 0) {
    magnetTimer -= dt;
    if (magnetTimer <= 0 && magnetTarget && cauldron.length < maxCauldronSlots) {
      undoStack.push([...cauldron]);
      cauldron.push(magnetTarget);
      playSound('add_' + magnetTarget);
      floatTexts.push({ x: CAULDRON_X+CAULDRON_W/2, y: CAULDRON_Y+20, text: 'MAGNET!', life: 0.6, color: '#ffdd44' });
      magnetTarget = null;
    }
  }

  // Recycled ingredient timer
  if (recycledTimer > 0) recycledTimer -= dt;

  // Overflow Vial: auto-serve stored potions when matching customer arrives
  if (overflowVials.length > 0) {
    for (let vi = overflowVials.length - 1; vi >= 0; vi--) {
      const vial = overflowVials[vi];
      const matchC = customers.find(c => c.ailment.id === vial.ailmentId && c.arrived && !c.served && !c.leaving && !c.dying && !c.reserved);
      if (matchC) {
        matchC.reserved = true;
        deliveryQueue.push({
          potionColor: vial.color,
          ailmentId: vial.ailmentId,
          customer: matchC,
          isBoss: false,
          matchData: { match: matchC.ailment, cauldronSnapshot: matchC.ailment.recipe, isAssistant: false, doubleDownActive: false },
        });
        floatTexts.push({ x: matchC.x+15, y: matchC.y-20, text: 'VIAL!', life: 1.0, color: '#aa88ff' });
        playSound('brew_good');
        overflowVials.splice(vi, 1);
        break; // one per frame
      }
    }
  }

  // Spawn
  spawnTimer -= dt;
  // Pause spawning while merchant is active
  if (spawnTimer <= 0 && waveCustomersLeft > 0 && !(merchant && merchant.active && !merchant.chosen)) {
    spawnCustomer();
    let spawnRate = Math.max(1.2, (4 - wave * 0.3) * diffConfig.spawnMult);
    if (isRushHour) spawnRate *= 0.7; // Faster spawns during rush hour
    if (currentModifier && currentModifier.spawnMult) spawnRate *= currentModifier.spawnMult;
    spawnTimer = spawnRate + Math.random() * 1.5;
  }

  // VIP spawn: 20% chance per wave (not boss), after 30-60% of wave timer, max 1 per wave
  const isBossWaveNow = BOSS_WAVES.includes(wave) || (endlessMode && wave > 20 && wave % 5 === 0);
  if (!vipSpawnedThisWave && !isBossWaveNow && wave >= 3) {
    const waveProgress = 1 - (waveCustomersLeft / Math.max(1, waveCustomersLeft + customers.length));
    if (waveProgress >= 0.3 && waveProgress <= 0.6 && Math.random() < 0.003) { // ~20% chance over the window
      spawnVIP();
    }
  }

  // Customers
  for (const c of customers) {
    c.bobTimer += dt * 3;
    if (!c.arrived) {
      c.x += (c.targetX - c.x) * 3 * dt;
      if (Math.abs(c.x - c.targetX) < 2) { c.x = c.targetX; c.arrived = true; }
    } else if (c.served) {
      c.serveAnim -= dt * 1.5;
      if (c.serveAnim <= 0) c.leaving = true;
    } else if (!c.leaving && !c.dying) {
      if (patienceFreezeTimer <= 0) {
        let patienceDrainMult = c.personality === 'panicky' ? 1.5 : 1.0;
        if (c.behavior === 'sitter') patienceDrainMult *= 0.8; // Sitters drain 20% slower
        if (rushModeActive) patienceDrainMult *= 2.0; // Rush Mode: customers drain 2x faster
        c.patience -= dt * patienceDrainMult;
      }

      // Warning sound at 25% patience
      const ratio = c.patience / c.maxPatience;
      if (ratio < 0.25 && !c.warningPlayed) {
        c.warningPlayed = true;
        playSound('warning', null, c.x);
      }

      if (c.patience <= 0) {
        c.dying = true;
        c.reserved = false; // clear reservation so delivery system cleans up
        c.deathTimer = 1.5; // 1.5 second death animation
        c.deathType = c.ailment.anim || 'throb'; // death style matches ailment
        lives--;
        runStats.waveLivesLost++;
        playSound('leave', null, c.x);
        // Ailment-specific death text
        const deathTexts = {
          throb: 'COLLAPSED!', wobble: 'DISSOLVED!', droop: 'FAINTED!',
          glow: 'COMBUSTED!', spark: 'SHATTERED!'
        };
        floatTexts.push({ x: c.x+15, y: c.y-30, text: deathTexts[c.deathType] || 'PERISHED!', life: 1.5, color: P.DANGER });
        // Contagious spread (enhanced Feature 3C) — adjacent customers lose 25% patience
        if (c.personality === 'contagious') {
          const adjacentSlots = [c.slot - 1, c.slot + 1];
          for (const adjSlot of adjacentSlots) {
            const nearby = customers.find(nc => nc !== c && nc.slot === adjSlot && !nc.served && !nc.leaving && !nc.dying && nc.arrived);
            if (nearby) {
              nearby.patience -= nearby.maxPatience * 0.25;
              floatTexts.push({ x: nearby.x+15, y: nearby.y-20, text: 'INFECTED!', life: 1.5, color: '#44dd44' });
              // Green flash particles
              for (let gi = 0; gi < 6; gi++) {
                particles.push({ x: nearby.x+15+(Math.random()-0.5)*20, y: nearby.y+10, vx:(Math.random()-0.5)*2, vy:-Math.random()*2-1, life:0.6, color:'#44dd44', size:3 });
              }
            }
          }
        }
        shakeTimer = 0.3;
        shakeIntensity = 6;
        if (lives <= 0 && !transition.active) {
          if (score > highScores[selectedDifficulty]) { highScores[selectedDifficulty] = score; saveHighScores(); }
          playSound('gameover');
          clearSaveGame(); startTransition(() => { state = 'gameover'; }, 0.5);
          return;
        }
      }
    }
    // Death animation update
    if (c.dying) {
      c.deathTimer -= dt;
      if (c.deathTimer <= 0 && !c.leaving) {
        // Death animation finished — burst into particles and mark for removal
        const deathColors = {
          throb: [P.DANGER, '#ff6644', '#cc2222'],
          wobble: [P.MOSS_GREEN, '#88ee88', '#22aa44'],
          droop: [P.CRYS_BLUE, '#88bbff', '#4466cc'],
          glow: [P.FIRE_1, P.FIRE_2, P.EMBER],
          spark: [P.MUSH_PURPLE, '#cc66ff', '#8833cc']
        };
        const colors = deathColors[c.deathType] || [P.DANGER, '#666', '#888'];
        for (let p = 0; p < 20; p++) {
          particles.push({
            x: c.x + 15 + (Math.random()-0.5)*20,
            y: c.y + 20 + (Math.random()-0.5)*30,
            vx: (Math.random()-0.5)*6,
            vy: -Math.random()*5 - 1,
            life: 1.2 + Math.random()*0.5,
            color: colors[Math.floor(Math.random()*colors.length)],
            size: 3 + Math.random()*4
          });
        }
        playSound('brew_bad');
        c.leaving = true;
        c.x = -999; // instant removal
      }
    }
    if (c.leaving) c.x -= 120 * dt;
  }

  customers = customers.filter(c => c.x > -60);

  // Patience freeze countdown
  if (patienceFreezeTimer > 0) patienceFreezeTimer -= dt;

  // === BOSS UPDATE ===
  if (bossActive && !boss && waveCustomersLeft <= 0 && customers.length <= 1) {
    // Spawn boss after most regular customers
    createBoss(wave);
    if (boss) {
      playSound('boss_appear');
      shakeTimer = 0.5; shakeIntensity = 8;
    }
  }
  if (boss && !boss.defeated) {
    if (boss.appearTimer > 0) {
      boss.appearTimer -= dt;
      if (boss.appearTimer <= 0) {
        // Boss enters
        boss.customer.arrived = false;
        boss.customer.x = -60;
        // Reserve slot 2 for boss if taken
        customers = customers.filter(c => c.slot !== 2);
      }
    } else {
      const bc = boss.customer;
      // Move boss in
      if (!bc.arrived) {
        bc.x += (bc.targetX - bc.x) * 2 * dt;
        if (Math.abs(bc.x - bc.targetX) < 2) { bc.x = bc.targetX; bc.arrived = true; }
      }
      // Boss patience drain
      if (bc.arrived && !bc.served && !bc.leaving && patienceFreezeTimer <= 0) {
        bc.patience -= dt;
        if (bc.patience <= 0) {
          bc.leaving = true;
          lives -= 2; // boss leaving is extra punishing
          runStats.waveLivesLost += 2;
          playSound('leave');
          floatTexts.push({ x: bc.x+15, y: bc.y-40, text: 'BOSS FLED!', life: 2, color: P.DANGER });
          shakeTimer = 0.5; shakeIntensity = 10;
          boss.defeated = true;
          if (lives <= 0 && !transition.active) {
            if (score > highScores[selectedDifficulty]) { highScores[selectedDifficulty] = score; saveHighScores(); }
            playSound('gameover');
            clearSaveGame(); startTransition(() => { state = 'gameover'; }, 0.5);
            return;
          }
        }
      }
      if (bc.leaving) bc.x -= 80 * dt;

      // Plaguebearer aura: all other customers drain patience 2x faster
      if (boss.def.aura && bc.arrived && !boss.defeated) {
        for (const c of customers) {
          if (c !== bc && c.arrived && !c.served && !c.leaving && patienceFreezeTimer <= 0) {
            c.patience -= dt; // extra 1x drain (total 2x with normal drain)
          }
        }
      }

      // Shapeshifter: cycle ailment every 4 seconds
      if (boss.def.shifting && bc.arrived && !boss.defeated) {
        boss.shiftTimer += dt;
        if (boss.shiftTimer >= 4) {
          boss.shiftTimer = 0;
          const idx = (boss.shiftAilments.indexOf(boss.ailment) + 1) % boss.shiftAilments.length;
          boss.ailment = boss.shiftAilments[idx];
          boss.customer.ailment = boss.ailment;
          // Visual flash on shift
          for (let i = 0; i < 8; i++) {
            particles.push({ x: bc.x+15+(Math.random()-0.5)*30, y: bc.y-20, vx:(Math.random()-0.5)*4, vy:-Math.random()*3, life:0.8, color:boss.ailment.color, size:3 });
          }
        }
      }

      // Dragon: scorch between phases
      if (boss.def.dragon && boss.scorchActive) {
        boss.scorchTimer -= dt;
        if (boss.scorchTimer <= 0) {
          boss.scorchActive = false;
          cauldronDamaged = 0; // clear scorch
        }
      }
    }
  }

  // Assistant brewer AI — auto-brews for the most urgent customer, queues potion for delivery
  if (assistantServesLeft > 0) {
    if (!assistantTarget) {
      // Pick the customer with least patience (exclude reserved/served)
      const candidates = customers.filter(c => c.arrived && !c.served && !c.leaving && !c.reserved);
      if (candidates.length > 0) {
        candidates.sort((a,b) => a.patience - b.patience);
        assistantTarget = candidates[0];
        assistantTarget.reserved = true; // reserve so player can't target same customer
        assistantBrewTimer = 4 + Math.random() * 2; // takes 4-6 seconds
      }
    } else {
      // Check if target is still valid
      if (assistantTarget.served || assistantTarget.leaving || !customers.includes(assistantTarget)) {
        if (assistantTarget) assistantTarget.reserved = false;
        assistantTarget = null;
        assistantBrewTimer = 0;
      } else {
        assistantBrewTimer -= dt;
        if (assistantBrewTimer <= 0) {
          // Assistant brewed — queue potion for delivery via assistantBrewerChar
          deliveryQueue.push({
            potionColor: assistantTarget.ailment.color,
            ailmentId: assistantTarget.ailment.id,
            customer: assistantTarget,
            isBoss: false,
            matchData: { match: assistantTarget.ailment, cauldronSnapshot: [], isAssistant: true },
          });
          playSound('brew_good');
          assistantServesLeft--;
          assistantTarget = null;
        }
      }
    }
  }

  // === DELIVERY SYSTEM UPDATE ===
  updateDeliverySystem(dt);

  // Clean up boss if leaving
  if (boss && boss.customer && boss.customer.leaving && boss.customer.x < -80) {
    bossActive = false; // BUGFIX: clear bossActive so wave completion check works
    boss = null;
  }

  const bossCleared = !bossActive || (boss && boss.defeated);
  const deliveriesPending = deliveryQueue.length > 0 || brewer.state !== 'idle' || (assistantBrewerChar.state !== 'idle' && (upgradeLevels.assistant || 0) >= 1);
  if (waveCustomersLeft <= 0 && customers.length === 0 && bossCleared && !deliveriesPending && !transition.active) {
    // Perfect wave check
    if (runStats.waveLivesLost === 0) {
      runStats.perfectWaves++;
      perfectWaveFlash = 1.0;
      floatTexts.push({ x: W/2, y: H/2 - 40, text: 'PERFECT WAVE!', life: 2.5, color: P.ACHIEVEMENT });
      // Celebration particles
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: W/2 + (Math.random()-0.5)*200, y: H/2,
          vx: (Math.random()-0.5)*8, vy: -Math.random()*8 - 2,
          life: 1.5, color: [P.ACCENT, P.ACHIEVEMENT, P.SUCCESS, P.RARE_GOLD][Math.floor(Math.random()*4)],
          size: 3 + Math.random()*4,
        });
      }
    }
    runStats.waveLivesLost = 0;
    // Achievement checks at wave end
    if (runStats.perfectWaves >= 3) unlockAchievement('perfect_3');
    if (runStats.totalGold >= 500) unlockAchievement('gold_500');
    if (runStats.rareServed >= 5) unlockAchievement('vip_5');
    if (endlessMode && wave >= 25) unlockAchievement('wave_25');
    // Victory check: beat wave 20 (only in campaign, not endless)
    if (wave >= 20 && !endlessMode) {
      if (score > highScores[selectedDifficulty]) { highScores[selectedDifficulty] = score; saveHighScores(); }
      playSound('victory');
      clearSaveGame();
      unlockAchievement('potion_master');
      if (runExplosionCount === 0) unlockAchievement('no_explosions');
      startTransition(() => { state = 'victory'; }, 0.6);
      return;
    }
    // Go to shop between waves
    startTransition(() => { openShop(); }, 0.4);
    playSound('transition');
  }

  updateParticles(dt);
}

// === MAIN LOOP ===
let lastTime = 0;
function gameLoop(timestamp) {
  const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;

  // Update transition
  if (transition.active) {
    transition.progress += dt / (transition.duration / 2);
    if (transition.phase === 'out' && transition.progress >= 1) {
      transition.progress = 0;
      transition.phase = 'in';
      if (transition.callback) transition.callback();
    } else if (transition.phase === 'in' && transition.progress >= 1) {
      transition.active = false;
    }
  }

  if (state === 'title' || state === 'tutorial' || state === 'gameover' || state === 'shop' || state === 'victory') {
    gameTime += dt;
    cloudOffset += dt * 6;
  }
  if (state !== 'paused' && state !== 'shop') {
    updateGame(dt);
  }

  ctx.save();
  if (shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity * 2;
    const sy = (Math.random() - 0.5) * shakeIntensity * 2;
    ctx.translate(sx, sy);
  }

  ctx.fillStyle = P.BG_DARK;
  ctx.fillRect(0, 0, W, H);

  if (state === 'title') {
    drawTitle();
  } else if (state === 'tutorial') {
    drawTutorial();
  } else if (state === 'victory') {
    drawVictory();
  } else if (state === 'shop') {
    drawShop();
  } else {
    drawShopBackground();
    const sortedCustomers = [...customers].sort((a,b) => a.slot - b.slot);
    for (const c of sortedCustomers) drawCustomer(c);
    drawBoss();
    drawCauldron();
    drawBrewers();
    drawAssistant();
    drawIngredientButtons();
    drawBrewButton();
    drawDoubleDownButton();
    drawLinkedChains();
    drawRecipeBook();
    drawHUD();
    drawParticles();
    // Merchant speed/gold/combo indicators
    drawMerchantBuffIndicators();

    // Danger vignette at 1 life
    if (lives === 1 && state === 'playing') {
      const vigAlpha = 0.12 + Math.sin(gameTime * 3) * 0.06;
      const vig = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.7);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, `rgba(200,30,30,${vigAlpha})`);
      ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);
    }

    // Perfect wave celebration flash
    if (perfectWaveFlash > 0) {
      ctx.fillStyle = P.ACCENT; ctx.globalAlpha = perfectWaveFlash * 0.3;
      ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1;
    }

    if (state === 'waveIntro') drawWaveIntro();
    if (state === 'paused') drawPause();
    if (state === 'gameover') drawGameOver();
    // Merchant overlay (Feature 1)
    if (merchant && merchant.active && !merchant.chosen && state === 'playing') drawMerchantOverlay();
  }

  // Achievement popup
  if (achievementPopup && achievementPopup.timer > 0) {
    achievementPopup.timer -= dt;
    const ap = achievementPopup;
    const apAlpha = Math.min(1, ap.timer, (3 - (3 - ap.timer)) ); // fade in/out
    ctx.globalAlpha = Math.min(1, ap.timer < 0.5 ? ap.timer * 2 : 1) * 0.95;
    const apW = 260, apH = 50;
    const apX = W/2 - apW/2, apY = 10;
    drawRoundRect(apX, apY, apW, apH, 8, '#2a1a00', P.ACHIEVEMENT);
    ctx.fillStyle = P.ACHIEVEMENT; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
    ctx.fillText(`${ap.icon} ACHIEVEMENT UNLOCKED! ${ap.icon}`, W/2, apY + 18);
    ctx.fillStyle = P.PARCHMENT; ctx.font = '11px monospace';
    ctx.fillText(ap.name, W/2, apY + 35);
    ctx.globalAlpha = 1;
    if (ap.timer <= 0) achievementPopup = null;
  }

  // Draw transition overlay on top of everything
  drawTransition();

  ctx.restore();
  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
